  function zugangsdatenZeigen(name, benutzer, passwort) {
    const text = `Best Home App: ${location.origin}${location.pathname}\nBenutzername: ${benutzer}\nPasswort: ${passwort}`;
    S.zugangsText = text;
    oeffneDialog(`<div class="dlg-kopf"><h2>Zugang für ${esc(name)}</h2><button class="knopf still" data-aktion="dialog-zu" type="button">Fertig</button></div>
      <div class="dlg-inhalt"><p class="leise">Gib diese Daten an ${esc(name)} weiter. Das Passwort wird nur jetzt angezeigt.</p>
        <div class="liste">
          <div class="liste-zeile"><div class="text"><span class="leise klein">Adresse</span><b>${esc(location.origin + location.pathname)}</b></div></div>
          <div class="liste-zeile"><div class="text"><span class="leise klein">Benutzername</span><b id="zd-benutzer">${esc(benutzer)}</b></div></div>
          <div class="liste-zeile"><div class="text"><span class="leise klein">Passwort</span><b id="zd-passwort" style="font-family:ui-monospace,Menlo,monospace">${esc(passwort)}</b></div></div>
        </div></div>
      <div class="dlg-fuss"><span></span><div class="aktionen">
        <button class="knopf zweit" type="button" data-aktion="zugang-kopieren">Kopieren</button>
        ${navigator.share ? `<button class="knopf" type="button" data-aktion="zugang-teilen">Teilen (WhatsApp …)</button>` : ""}</div></div>`);
  }

  // ---------- Daten übernehmen (Übernahme-Datei, z. B. aus der claude.ai-Version) ----------
  const UEBERNAHME_PFAD = /^(techniker|einstellungen|zettel|kosten|belege|einsaetze|abwesenheiten|dateien|rechnungen)\/[^/]+$/;
  const UEBERNAHME_GEHEIM = (p) => p === "einstellungen/app" || p === "einstellungen/kunden" || p.startsWith("rechnungen/");
  async function uebernahmeLesen(datei) {
    let paket = null;
    try { paket = JSON.parse(await datei.text()); } catch { /* unten gemeldet */ }
    if (!paket || paket.format !== "besthome-uebernahme" || !paket.dokumente || typeof paket.dokumente !== "object") {
      melde("Das ist keine Übernahme-Datei der Best-Home-App.", true);
      return;
    }
    const pfade = Object.keys(paket.dokumente).filter((p) => UEBERNAHME_PFAD.test(p) && !["einstellungen/pruef", "einstellungen/export"].includes(p)
      && paket.dokumente[p] && typeof paket.dokumente[p] === "object");
    S.uebernahme = { paket, pfade };
    const von = (s) => pfade.filter((p) => p.startsWith(`${s}/`));
    const app = pfade.includes("einstellungen/app") ? paket.dokumente["einstellungen/app"] : null;
    const zeile = (titel, text = "") => `<div class="liste-zeile"><div class="text"><b>${titel}</b>${text ? `<div class="leise klein">${text}</div>` : ""}</div></div>`;
    const weitere = { zettel: "Auftragszettel", rechnungen: "Rechnungen", kosten: "Kosten", belege: "Belege", einsaetze: "Einsätze ohne Zettel", abwesenheiten: "Urlaubs- und Krankheitseinträge" };
    oeffneDialog(`<div class="dlg-kopf"><h2>Daten übernehmen</h2><button class="knopf still" data-aktion="dialog-zu" type="button">Abbrechen</button></div>
      <div class="dlg-inhalt"><p class="leise">${esc(paket.quelle || "Übernahme-Datei")}${paket.erstellt ? `, erstellt am ${esc(datumZeit(paket.erstellt))}` : ""}</p>
        <div class="liste">
          ${von("techniker").length ? zeile(`${von("techniker").length} Techniker`, esc(von("techniker").map((p) => paket.dokumente[p].name || p.slice(10)).join(", "))) : ""}
          ${app ? zeile("Einstellungen", `${esc(app.firma_name || "")} · nächste Rechnung ${esc(`${app.nummer_jahr}-${String(app.nummer_naechste).padStart(3, "0")}`)} · ${esc(K.euro(Number(app.stundensatz) || 0))} je Std.`) : ""}
          ${pfade.includes("einstellungen/logo") ? zeile("Logo") : ""}
          ${pfade.includes("einstellungen/kunden") ? zeile("Kundenliste") : ""}
          ${Object.entries(weitere).filter(([s]) => von(s).length).map(([s, t]) => zeile(`${von(s).length} ${t}`)).join("")}
        </div>
        ${pfade.length ? `<p class="hinweis info">Gleichnamige Einträge werden überschrieben. Einstellungen und Rechnungen werden mit dem Schlüssel dieser App verschlüsselt.</p>` : `<p class="hinweis">Die Datei enthält nichts, was übernommen werden kann.</p>`}</div>
      <div class="dlg-fuss"><span></span>${pfade.length ? `<button class="knopf" type="button" data-aktion="uebernahme-los">${pfade.length} Einträge übernehmen</button>` : ""}</div>`);
  }
  async function uebernahmeAusfuehren(knopf) {
    const u = S.uebernahme;
    if (!u) return;
    if (!S.ich.owner || !S.schluessel) { melde("Daten übernehmen kann nur der Inhaber.", true); return; }
    knopf.disabled = true; knopf.textContent = "Wird übernommen …";
    const ok = await schreibe(async () => {
      for (const p of u.pfade) {
        const d = u.paket.dokumente[p];
        if (UEBERNAHME_GEHEIM(p)) await geheimSpeichern(p, d);
        else await S.db.doc(p).set(d);
      }
    }, `${u.pfade.length} Einträge übernommen.`);
    S.uebernahme = null;
    schliesseDialog();
    if (ok) render();
  }

  async function zugangSetzen(id, wert) {
    const jetzt = new Date().toISOString();
    const war = S.zuordnung[id] || {};
    await schreibe(async () => {
      if (wert === "admin") {
        if (!S.ich.owner || !S.schluesselRoh) throw new Error("Admins kann nur der Inhaber ernennen.");
        await S.db.doc(`schluessel/${id}`).set({ k: S.schluesselRoh, erstellt: jetzt });
        await S.db.doc(`zuordnung/${id}`).set({ rolle: "admin", geaendert: jetzt });
        return;
      }
      if (war.rolle === "admin") {
        if (!S.ich.owner) throw new Error("Admins kann nur der Inhaber ändern.");
        await S.db.doc(`schluessel/${id}`).delete();
      }
      if (wert) await S.db.doc(`zuordnung/${id}`).set({ rolle: "techniker", techniker: wert, geaendert: jetzt });
      else await S.db.doc(`zuordnung/${id}`).delete();
    }, wert === "admin" ? "Als Admin freigeschaltet." : wert ? `Zugeordnet: ${S.techniker[wert].name}.` : "Zugang entfernt.");
  }

  // ---------- Kalender ----------
  const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const WT_LANG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const utcHeute = () => { const h = heute(); return new Date(Date.UTC(h.getFullYear(), h.getMonth(), h.getDate())); };
  const ersterDes = (d) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
  const plusTage = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };

  function technikerFarben() {
    const ks = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));
    return Object.fromEntries(ks.map((k, i) => [k, `var(--m${(i % 6) + 1})`]));
  }

  const abwesenheitenVon = (k) => Object.entries(S.abwesenheiten).filter(([, x]) => x && x.techniker === k).map(([id, x]) => ({ ...x, id }));
  const sollVon = (k) => K.tagessoll((S.techniker[k] || {}).tagessoll);
  const stdText = (x) => K.zahl(x).replace(/,00$/, "").replace(/(,\d)0$/, "$1"); // 8 / 7,5 / 0,25
  /** +1,5 / −8 / ±0 */
  const diffText = (x) => (Math.abs(x) < 0.005 ? "±0" : `${x > 0 ? "+" : "−"}${stdText(Math.abs(x))}`);
  const diffKlasse = (x) => (Math.abs(x) < 0.005 ? "diff" : x > 0 ? "diff plus" : "diff minus");
  const tageText = (n) => `${n} Tag${n === 1 ? "" : "e"}`;
  const monatsEnde = (erster) => new Date(Date.UTC(erster.getUTCFullYear(), erster.getUTCMonth() + 1, 0));
  const datumOderNull = (t) => { try { return K.parseDatum(t); } catch { return null; } };
  const ausIso = (x) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(x || "")); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
  const NIE = new Date(Date.UTC(9999, 0, 1));

  /** Ab wann das Soll zählt: eingestellt (soll_ab) oder der erste Tag mit Einsatz, Urlaub oder Krankheit */
  function sollAbVon(k, tage, abwesend) {
    const fest = datumOderNull((S.techniker[k] || {}).soll_ab);
    if (fest) return fest;
    const alle = [...Object.keys(tage), ...Object.keys(abwesend)].map(datumOderNull).filter(Boolean);
    return alle.length ? new Date(Math.min(...alle)) : NIE;
  }

  /** Mitarbeiter, die der Kalender gerade zeigt */
  function kalenderMitarbeiter() {
    const nurK = S.rolle === "techniker" ? S.meinK : S.kalender && S.kalender.techniker;
    const name = (k) => (S.techniker[k] || {}).name || k;
    return Object.keys(S.techniker).filter((k) => !nurK || k === nurK).sort((x, y) => name(x).localeCompare(name(y), "de"));
  }

  /** {k: {tage: arbeitstage(), abwesend: {datum: art}, soll: Tagessoll, ab: Beginn der Erfassung}} */
  function kalenderProK() {
    return Object.fromEntries(kalenderMitarbeiter().map((k) => {
      const tage = K.arbeitstage(einsaetzeVon(k)), abwesend = K.abwesenheitsTage(abwesenheitenVon(k));
      return [k, { tage, abwesend, soll: sollVon(k), ab: sollAbVon(k, tage, abwesend) }];
    }));
  }

  /** {datum: {k: arbeitstag}} für alle (bzw. den gewählten) Mitarbeiter */
  function kalenderDaten(proK = kalenderProK()) {
    const erg = {};
    for (const [k, p] of Object.entries(proK)) for (const [datum, tag] of Object.entries(p.tage)) (erg[datum] = erg[datum] || {})[k] = tag;
    return erg;
  }

  /** Soll/Ist je Tag; Soll und Differenz zählen ab Beginn der Erfassung bis heute */
  const kontoVon = (p, von, bis) => K.stundenKonto({ von, bis, tage: p.tage, abwesend: p.abwesend, soll: p.soll, stichtag: utcHeute(), ab: p.ab });
  const nachDatum = (konto) => Object.fromEntries(konto.tage.map((x) => [x.datum, x]));

  function kalenderStart(daten) {
    const tage = Object.keys(daten).map((d) => K.parseDatum(d)).sort((a, b) => b - a);
    const d = tage.length ? tage[0] : utcHeute();
    S.kalender = { monat: ersterDes(d), woche: K.wocheVon(d), techniker: "" };
  }

  function ansichtKalender() {
    if (!S.kalender) kalenderStart(kalenderDaten());
    const kal = S.kalender;
    const ks = kalenderMitarbeiter();
    const proK = kalenderProK();
    const daten = kalenderDaten(proK);
    const farben = technikerFarben();
    const name = (k) => (S.techniker[k] || {}).name || k;
    const punkt = (k, stil = "") => `<i class="punkt" style="background:${farben[k]}${stil}"></i>`;
    const heuteD = utcHeute();
    const heuteText = K.datumText(heuteD);
    const [mo, so] = K.wocheZeitraum(kal.woche);
    const erster = kal.monat, letzter = monatsEnde(erster);
    const jahr = erster.getUTCFullYear();
    const monatsName = `${MONATE[erster.getUTCMonth()]} ${jahr}`;
    const einer = ks.length === 1 ? ks[0] : null;
    const mehrere = ks.length > 1;
    const monatKonto = Object.fromEntries(ks.map((k) => [k, kontoVon(proK[k], erster, letzter)]));
    const monatTag = Object.fromEntries(ks.map((k) => [k, nachDatum(monatKonto[k])]));
    const wocheKonto = Object.fromEntries(ks.map((k) => [k, kontoVon(proK[k], mo, so)]));
    const wocheTag = Object.fromEntries(ks.map((k) => [k, nachDatum(wocheKonto[k])]));

    // Monatsraster (Mo–So)
    const versatz = ((erster.getUTCDay() || 7) - 1);
    const start = plusTage(erster, -versatz);
    const zellen = [];
    for (let i = 0; i < 42; i++) {
      const d = plusTage(start, i);
      if (i >= 35 && d.getUTCMonth() !== erster.getUTCMonth()) break;
      const dt = K.datumText(d);
      const imMonat = d.getUTCMonth() === erster.getUTCMonth();
      const tag = daten[dt] || {};
      const mit = Object.keys(tag);
      const std = mit.reduce((s, k) => s + tag[k].stunden, 0);
      const ft = K.feiertag(dt);
      const abw = ks.filter((k) => proK[k].abwesend[dt]).map((k) => [k, proK[k].abwesend[dt]]);
      const z = einer && imMonat ? monatTag[einer][dt] : null;
      const zeigeDiff = z && z.zaehlt && (z.soll > 0 || z.ist > 0);
      const klassen = ["tag-zelle", imMonat ? "" : "fremd", d >= mo && d <= so ? "gewaehlt" : "", dt === heuteText ? "heute" : "", ft ? "feiertag" : ""].join(" ");
      const label = [dt, ft ? `Feiertag ${ft.name}` : "", ...abw.map(([k, x]) => `${mehrere ? `${name(k)} ` : ""}${K.ABWESENHEITEN[x]}`),
        mit.length ? `${mit.map(name).join(", ")}, ${K.zahl(std)} Stunden` : "", zeigeDiff ? `Differenz zum Soll ${diffText(z.diff)} Stunden` : ""].filter(Boolean).join(", ");
      zellen.push(`<button class="${klassen}" data-aktion="kal-tag" data-datum="${dt}" aria-label="${esc(label)}">
        <span class="nr">${d.getUTCDate()}</span>
        ${ft ? `<span class="ft">${esc(ft.kurz)}</span>` : ""}
        ${mit.length ? `<span class="punkte">${mit.map((k) => punkt(k)).join("")}</span><span class="std">${esc(stdText(K.runden(std)))}</span>` : ""}
        ${abw.length ? `<span class="abws">${abw.map(([k, x]) => `<span class="abw ${x}"${mehrere ? ` style="box-shadow:inset 0 -2px 0 ${farben[k]}"` : ""}>${x === "urlaub" ? "U" : "K"}</span>`).join("")}</span>` : ""}
        ${zeigeDiff ? `<span class="${diffKlasse(z.diff)}">${diffText(z.diff)}</span>` : ""}
      </button>`);
    }

    // Monatsübersicht je Mitarbeiter
    const laufend = erster <= heuteD && heuteD <= letzter;
    const ftMonat = Object.entries(K.feiertage(jahr)).filter(([dt]) => K.parseDatum(dt).getUTCMonth() === erster.getUTCMonth());
    const uebersicht = ks.map((k) => {
      const s = monatKonto[k].summe;
      const ab = proK[k].ab;
      const abText = ab <= erster ? "" : ab === NIE ? "Soll zählt ab dem ersten Einsatz" : `Soll zählt ab ${K.datumText(ab)}`;
      const urlaubJahr = K.stundenKonto({ von: new Date(Date.UTC(jahr, 0, 1)), bis: new Date(Date.UTC(jahr, 11, 31)), abwesend: proK[k].abwesend, soll: proK[k].soll }).summe.urlaub;
      return `<div class="mo-person" data-k="${esc(k)}">
        <div class="mo-kopf"><span class="wer">${punkt(k)}<b>${esc(name(k))}</b></span><span class="${diffKlasse(s.diff)} gross">${diffText(s.diff)} Std.</span></div>
        <div class="mo-zahlen">
          <div><span>Gearbeitet</span><b>${stdText(s.ist)} Std.</b></div>
          <div><span>Soll${laufend ? " bis heute" : ""}</span><b>${stdText(s.soll)} Std.</b></div>
          <div><span>Differenz</span><b class="${diffKlasse(s.diff)}">${diffText(s.diff)} Std.</b></div>
        </div>
        <div class="leise klein">${[`${tageText(s.arbeitstage)} gearbeitet`, s.urlaub ? `Urlaub ${tageText(s.urlaub)}` : "", s.krank ? `krank ${tageText(s.krank)}` : "",
          s.feiertage ? `${s.feiertage} Feiertag${s.feiertage > 1 ? "e" : ""}` : "", abText, `Soll im ganzen Monat ${stdText(s.sollGesamt)} Std. (${stdText(proK[k].soll)} Std. je Werktag)`].filter(Boolean).join(" · ")}</div>
        <div class="leise klein">Urlaub ${jahr} eingetragen: ${tageText(urlaubJahr)}</div>
      </div>`;
    }).join("");

    // Urlaub und Krankheit
    const darfLoeschen = (x) => S.kannSchreiben && (istAdmin() || (S.rolle === "techniker" && x.techniker === S.meinK));
    const abwListe = ks.flatMap((k) => abwesenheitenVon(k)).filter((x) => {
      const v = datumOderNull(x.von), b = datumOderNull(x.bis);
      return v && b && v <= letzter && b >= erster;
    }).sort((x, y) => K.parseDatum(x.von) - K.parseDatum(y.von) || name(x.techniker).localeCompare(name(y.techniker), "de"));
    const abwZeilen = abwListe.map((x) => {
      const n = K.stundenKonto({ von: K.parseDatum(x.von), bis: K.parseDatum(x.bis), abwesend: K.abwesenheitsTage([x]) }).summe[x.art] || 0;
      return `<div class="liste-zeile abwesenheit"><div class="text"><b>${mehrere ? `${punkt(x.techniker, ";margin-right:6px")}${esc(name(x.techniker))} · ` : ""}${esc(K.ABWESENHEITEN[x.art] || x.art)}</b>
        <div class="leise klein">${x.von === x.bis ? esc(x.von) : `${esc(x.von)} – ${esc(x.bis)}`} · ${tageText(n)} (Mo–Fr ohne Feiertage)${x.notiz ? ` · ${esc(x.notiz)}` : ""}</div></div>
        ${darfLoeschen(x) ? loeschKnopf("abwesenheit-loeschen", x.id, "Löschen") : ""}</div>`;
    }).join("");
    const formK = S.rolle === "techniker" ? S.meinK : einer;
    const formular = S.kannSchreiben && ks.length && (istAdmin() || S.rolle === "techniker") ? `
      <details data-key="abwesenheit-neu"><summary>Urlaub oder Krankheit eintragen</summary>
        <form data-form="abwesenheit" class="felder"${formK ? ` data-techniker="${esc(formK)}"` : ""}>
          ${formK ? "" : `<label>Mitarbeiter<select name="techniker" required id="abw-techniker"><option value="">Bitte wählen</option>${ks.map((k) => `<option value="${esc(k)}">${esc(name(k))}</option>`).join("")}</select></label>`}
          <label>Art<select name="art" id="abw-art"><option value="urlaub">Urlaub</option><option value="krank">Krank</option></select></label>
          <label>Von<input type="date" name="von" required id="abw-von"></label>
          <label>Bis (leer = nur ein Tag)<input type="date" name="bis" id="abw-bis"></label>
          <label class="ganz">Notiz (freiwillig)<input name="notiz" maxlength="200" id="abw-notiz" placeholder="z. B. Arzttermin, Familienfeier"></label>
          <button class="knopf">Eintragen</button>
        </form></details>` : "";

    // Woche im Detail
    const wochenTage = [...Array(7)].map((_, i) => plusTage(mo, i));
    const eintraege = wochenTage.flatMap((d) => Object.values(daten[K.datumText(d)] || {}));
    const minB = Math.min(6 * 60, ...eintraege.map((t) => t.beginnMin));
    const maxE = Math.max(19 * 60, ...eintraege.map((t) => t.endeMin));
    const von = Math.floor(minB / 60) * 60, bis = Math.ceil(maxE / 60) * 60;
    const pos = (m) => (((m - von) / (bis - von)) * 100).toFixed(2);
    const achse = [];
    for (let h = von; h <= bis; h += 120) achse.push(`<span style="left:${pos(h)}%">${String((h / 60) % 24).padStart(2, "0")}</span>`);
    const tageHtml = wochenTage.map((d) => {
      const dt = K.datumText(d);
      const tag = daten[dt] || {};
      const ft = K.feiertag(dt);
      const fehlt = [];
      const inhalt = ks.map((k) => {
        const t = tag[k], z = wocheTag[k][dt], abw = z.abwesend;
        const sollZeile = z.zaehlt && (z.soll > 0 || z.ist > 0)
          ? `<div class="soll-zeile">Soll ${esc(stdText(z.soll))} Std.${z.soll === 0 ? ` (${ft ? "Feiertag" : abw ? K.ABWESENHEITEN[abw] : "Wochenende"})` : ""} · Differenz <b class="${diffKlasse(z.diff)}">${diffText(z.diff)} Std.</b></div>` : "";
        if (t) {
          const auftr = [...new Map(t.einsaetze.map((e) => [e.schluessel, e])).values()]
            .map((e) => `${e.auftrags_nr ? `Auftrag ${esc(e.auftrags_nr)} ` : ""}${esc(e.kunde)}`).join(" · ");
          return `<div class="kal-eintrag">
            <div class="kal-zeile"><span class="wer">${punkt(k)}${esc(name(k))}</span>
              <span class="von-bis">${esc(t.beginn)} – ${esc(t.ende)}</span><span class="summe">${esc(K.zahl(t.stunden))} Std.</span></div>
            <div class="balken" aria-hidden="true">${t.spannen.map((sp) => `<span class="${sp.art}" style="left:${pos(sp.von)}%;width:${(pos(sp.bis) - pos(sp.von)).toFixed(2)}%"></span>`).join("")}</div>
            <div class="auftraege-klein">${auftr}</div>
            ${sollZeile}
            ${t.abfahrtFehlt ? `<div class="hinweis klein">Abfahrt fehlt auf dem Zettel – Ende ist das Ende der Arbeitszeit.</div>` : ""}
          </div>`;
        }
        if (abw) return `<div class="kal-eintrag"><div class="kal-zeile"><span class="wer">${punkt(k)}${esc(name(k))}</span><span class="abw-text ${abw}">${K.ABWESENHEITEN[abw]}</span></div></div>`;
        if (z.zaehlt && z.soll > 0) fehlt.push(k);
        return "";
      }).join("");
      const fehltHtml = fehlt.length ? `<div class="kal-zeile fehlt"><span class="leise">Kein Einsatz eingetragen${mehrere ? ":" : ""}</span>${fehlt.map((k) =>
        `${mehrere ? `<span class="wer">${punkt(k)}${esc(name(k))} ` : "<span>"}<b class="diff minus">${diffText(-wocheTag[k][dt].soll)} Std.</b></span>`).join("")}</div>` : "";
      return `<div class="kal-tag" id="tag-${dt.split(".").reverse().join("-")}">

  async function kalenderCsv() {
    const kal = S.kalender;

    const name = (k) => (S.techniker[k] || {}).name || k;
    const z = (x) => K.zahl(x).replace(/\./g, "");
    const zeilen = [];
    for (const [k, p] of Object.entries(proK)) {
      const konto = kontoVon(p, kal.monat, monatsEnde(kal.monat));
      for (const t of konto.tage) {
        const tag = p.tage[t.datum];
        const werktag = t.wochentag >= 1 && t.wochentag <= 5;
        if (!tag && (!werktag || (!t.zaehlt && !t.abwesend))) continue;
        zeilen.push([t.datum, WT_LANG[t.wochentag], name(k), tag ? tag.beginn : "", tag ? tag.ende : "", z(t.ist), t.zaehlt ? z(t.soll) : "", t.zaehlt ? z(t.diff) : "",
          [t.feiertag ? `Feiertag: ${t.feiertag.name}` : "", t.abwesend ? K.ABWESENHEITEN[t.abwesend] : ""].filter(Boolean).join(", "),
          tag ? [...new Set(tag.einsaetze.map((e) => e.auftrags_nr).filter(Boolean))].join(", ") : "", tag && tag.abfahrtFehlt ? "Abfahrt fehlt" : ""]);
      }
      const s = konto.summe;
      zeilen.push(["Summe", "", name(k), "", "", z(s.ist), z(s.soll), z(s.diff),
        [s.urlaub ? `Urlaub ${tageText(s.urlaub)}` : "", s.krank ? `krank ${tageText(s.krank)}` : ""].filter(Boolean).join(", "), "", ""]);
    }
    const feld = (x) => { const s2 = String(x ?? ""); return /[;"\n]/.test(s2) ? `"${s2.replace(/"/g, '""')}"` : s2; };
    const csv = [["Datum", "Wochentag", "Mitarbeiter", "Beginn", "Ende", "Stunden", "Soll", "Differenz", "Urlaub/Krank/Feiertag", "Aufträge", "Hinweis"], ...zeilen]
      .map((zeile) => zeile.map(feld).join(";")).join("\r\n");
    const monat = `${kal.monat.getUTCFullYear()}-${String(kal.monat.getUTCMonth() + 1).padStart(2, "0")}`;
    try {
      await S.downloads.save({ filename: `arbeitszeiten-${monat}.csv`, data: "﻿" + csv });
      melde("Arbeitszeiten gespeichert.");
    } catch (e) {
      if (e && e.code !== "declined") melde(`Speichern nicht möglich: ${e.message || e}`, true);
    }
  }

  // ---------- Belege (Fotos von Hotel- und Parkrechnungen) ----------
  const BILDTYPEN = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  async function bildVerkleinern(datei, max = 2000, qualitaet = 0.85) {
    const url = URL.createObjectURL(datei);
    try {
      const bild = await new Promise((ok, fehler) => {
        const img = new Image();
        img.onload = () => ok(img);
        img.onerror = () => fehler(new Error("bild"));
        img.src = url;
      });
      const f = Math.min(1, max / Math.max(bild.naturalWidth, bild.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(bild.naturalWidth * f));
      c.height = Math.max(1, Math.round(bild.naturalHeight * f));
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bild, 0, 0, c.width, c.height);
      const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", qualitaet));
      if (!blob) throw new Error("bild");
      return blob;
    } finally { URL.revokeObjectURL(url); }
  }
  function assetFehler(e) {
    const code = e && e.code;
    return code === "too_large" ? "Die Datei ist zu groß (höchstens 20 MB)."
      : code === "unsupported_type" ? "Dieses Dateiformat geht nicht – bitte Foto (JPG/PNG) oder PDF."
      : code === "quota_or_state" ? "Der Speicher für Belege ist voll. Bitte alte Belege löschen."
      : code === "rate_limited" ? "Zu viele Uploads auf einmal – bitte kurz warten und erneut versuchen."
      : `Hochladen fehlgeschlagen: ${(e && e.message) || e}`;
  }
  /** Ohne Asset-Recht: Bild so klein rechnen, dass es in ein Datenbank-Dokument passt (< 256 KB). */
  async function alsDatenUrl(datei) {
    for (const [max, q] of [[1600, 0.75], [1400, 0.65], [1200, 0.6], [1000, 0.55], [800, 0.5]]) {
      const blob = await bildVerkleinern(datei, max, q);
      if (blob.size < 175000) return await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
    }
    throw new Error(`${datei.name}: Bild ist zu groß.`);
  }
  async function belegInDb(datei) {
    let daten, typ;
    if (datei.type === "application/pdf" || /\.pdf$/i.test(datei.name)) {
      if (datei.size > 175000) throw new Error(`${datei.name}: PDF ist zu groß – bitte ein Foto davon hochladen.`);
      daten = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(datei); });
      typ = "application/pdf";
    } else { daten = await alsDatenUrl(datei); typ = "image/jpeg"; }
    const ref = await S.db.collection("dateien").add({ daten, typ, erstellt: new Date().toISOString() });
    return { datei: ref.id, typ, groesse: daten.length };
  }
  const belegUrl = (b) => (b.asset ? blobUrl(b.asset) : b.datei ? S.dateiUrls[b.datei] || "" : "");
  function dateiUrlLaden(id) {
    if (!id || id in S.dateiUrls) return;
    S.dateiUrls[id] = "";
    S.db.doc(`dateien/${id}`).get().then((d) => { if (d.exists) { S.dateiUrls[id] = d.data().daten; planeRender(); } }).catch(() => {});
  }
  async function belegeHochladen(k, einsatz, dateien) {
    if (!S.db) { melde("Hochladen ist hier nicht möglich – bitte die App in claude.ai öffnen.", true); return; }
    const marke = `b:${einsatz}`;
    S.beschaeftigt.add(marke); render();
    let ok = 0;
    const fehler = [];
    const neu = [];
    for (const datei of dateien) {
      try {
        if (!S.assets) {
          const x = await belegInDb(datei);
          const basis = { techniker: k, einsatz, ...x, name: datei.name || "", erstellt: new Date().toISOString() };
          const ref = await S.db.collection("belege").add(basis);
          neu.push({ id: ref.id, basis, quelle: datei });
          ok++;
          continue;
        }
        let blob, typ;
        if (datei.type === "application/pdf" || /\.pdf$/i.test(datei.name)) { blob = datei; typ = "application/pdf"; }
        else {
          try { blob = await bildVerkleinern(datei); typ = "image/jpeg"; }
          catch {
            if (!BILDTYPEN.includes(datei.type)) throw new Error(`${datei.name}: Bild konnte nicht gelesen werden – bitte als JPG oder PDF.`);
            blob = datei; typ = datei.type;
          }
        }
        let erg;
        try { erg = await S.assets.upload(blob, { type: typ }); }
        catch (e) {
          if (e && e.code === "store_unavailable") { await new Promise((r) => setTimeout(r, 1500)); erg = await S.assets.upload(blob, { type: typ }); }
          else throw e;
        }
        try {
          const basis = { techniker: k, einsatz, asset: erg.id, typ: erg.contentType || typ,
            name: datei.name || "", groesse: erg.sizeBytes || blob.size, erstellt: new Date().toISOString() };
          const ref = await S.db.collection("belege").add(basis);
          neu.push({ id: ref.id, basis, quelle: datei });
        } catch (e) { S.assets.delete(erg.id).catch(() => {}); throw e; }
        ok++;
      } catch (e) {
        console.error(e);
        fehler.push(e && e.code ? assetFehler(e) : (e && e.message) || String(e));
      }
    }
    S.beschaeftigt.delete(marke); render();
    if (fehler.length) melde(fehler[0], true);
    else melde(ok === 1 ? "Beleg gespeichert." : `${ok} Belege gespeichert.`);
    return neu;
  }
  function belegDialog(id) {
    const b = S.belege[id];
    if (!b) return;
    dateiUrlLaden(b.datei);
    const url = belegUrl(b);
    const e = einsaetzeVon(b.techniker).find((x) => x.schluessel === b.einsatz);

        ${S.kannSchreiben ? `<button class="knopf still" data-aktion="beleg-loeschen" data-id="${esc(id)}">Löschen</button>` : ""}

  async function belegLoeschen(id) {
    const b = S.belege[id];
    if (!b) return;
    // Ein Foto kann zu mehreren Belegen gehören (z. B. Hotelrechnung für zwei Techniker)
    const geteilt = Object.entries(S.belege).some(([bid, x]) => bid !== id && ((b.asset && x.asset === b.asset) || (b.datei && x.datei === b.datei)));
    if (await schreibe(() => S.db.doc(`belege/${id}`).delete(), "Beleg gelöscht.")) {

      if (!geteilt && b.datei) S.db.doc(`dateien/${b.datei}`).delete().catch(() => {});
      schliesseDialog();
    }
  }

- mwst_tabelle: die Steueraufstellung des Belegs (Netto, MwSt, Brutto je Satz), sonst [].
- auftragsnummer_handschriftlich: NUR eine mit Stift von Hand auf den Beleg geschriebene Auftragsnummer (meist 7 Ziffern). Gedruckte Nummern (Beleg-, Kassen-, Terminal-, Artikel-, EAN-Nummern) zählen nicht. Sonst null.
- naechte: Übernachtungen je Gast. Datum immer TT.MM.JJJJ, Beträge als Zahl mit Punkt (63.7).
- lesbar: false, wenn Beträge oder Datum nicht sicher zu lesen sind.`;
  const ART_TEXT = { hotel: "Hotel", parken: "Parken", material: "Material", sonstiges: "Beleg" };

  /** Gesamtbild plus überlappende Ausschnitte in voller Auflösung – Claude bekommt je Bild nur ca. 1,2 Megapixel */
  async function belegBilderFuerClaude(quelle) {
    const url = URL.createObjectURL(quelle);
    try {
      const bild = await new Promise((ok, fehler) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fehler(new Error("bild")); i.src = url; });
      const W = bild.naturalWidth, H = bild.naturalHeight;
      const zeichne = (sx, sy, sw, sh, max) => {
        const f = Math.min(1, max / Math.max(sw, sh));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(sw * f)); c.height = Math.max(1, Math.round(sh * f));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(bild, sx, sy, sw, sh, 0, 0, c.width, c.height);
        return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9));
      };
      const maxBilder = (S.sampleBilder && S.sampleBilder.maxCount) || 4;
      const bilder = [await zeichne(0, 0, W, H, (S.sampleBilder && S.sampleBilder.maxKante) || 1600)];
      const n = Math.min(Math.max(0, Math.min(6, maxBilder - 1)), Math.ceil((W * H) / 1e6 / 1.15));
      if (n >= 2) {
        const spalten = n > 3 ? 2 : 1, zeilen = Math.ceil(n / spalten);
        const [cols, rows] = H >= W ? [spalten, zeilen] : [zeilen, spalten];
        const tw = W / cols, th = H / rows, ox = tw * 0.08, oy = th * 0.08;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const sx = Math.max(0, c * tw - ox), sy = Math.max(0, r * th - oy);
          bilder.push(await zeichne(sx, sy, Math.min(W - sx, tw + 2 * ox), Math.min(H - sy, th + 2 * oy), 2400));
        }
      }
      return bilder.filter(Boolean).slice(0, maxBilder);
    } finally { URL.revokeObjectURL(url); }
  }
  async function belegLesen(quelle, typ) {
    if (typ === "application/pdf") {
      const lib = await pdfjs();
      const doc = await lib.getDocument({ data: new Uint8Array(await quelle.arrayBuffer()), isEvalSupported: false }).promise;
      let text = "";
      for (let i = 1; i <= Math.min(doc.numPages, 5); i++) text += (await (await doc.getPage(i)).getTextContent()).items.map((x) => x.str).join(" ") + "\n";
      return S.sample.json(`${BELEG_PROMPT}\n\nText des Belegs (aus einer PDF-Datei):\n${text.slice(0, 20000)}`, { modelTier: "default" });
    }
    if (!S.sampleBilder) throw { code: "images_unavailable" };
    const bilder = await belegBilderFuerClaude(quelle);
    const hinweis = bilder.length > 1 ? `\n\nBild 1 zeigt den ganzen Beleg, die Bilder 2 bis ${bilder.length} sind vergrößerte, überlappende Ausschnitte desselben Belegs zum genauen Lesen. Jede Zeile nur einmal aufnehmen.` : "";
    return S.sample.json(BELEG_PROMPT + hinweis, { images: bilder, modelTier: "default" });
  }
  function sampleFehlerText(e) {
    const c = e && e.code;
    return c === "not_granted" ? "Auslesen wurde nicht erlaubt. Der Beleg ist gespeichert, die Kosten bitte von Hand eintragen. Nach dem Neuladen der App fragt sie wieder."
      : c === "rate_limited" ? "Gerade zu viele Anfragen. Bitte kurz warten und beim Beleg „Auslesen und buchen“ tippen."
      : c === "invalid_json" || c === "empty_completion" || c === "refused" ? "Der Beleg ließ sich nicht sicher lesen. Bitte gerade und scharf fotografieren oder die Kosten von Hand eintragen."
      : c === "image_rejected" ? "Das Bild wurde nicht angenommen (Format oder Größe)."
      : c === "sampling_disabled" || c === "images_unavailable" || c === "not_declared" ? "Auslesen ist hier nicht verfügbar. Kosten bitte von Hand eintragen."
      : c === "session_expired" ? (window.PLATTFORM ? "Bitte neu anmelden." : "Bitte in claude.ai neu anmelden.")
      : `Auslesen nicht möglich${c ? ` (${c})` : ""}. Der Beleg ist gespeichert, die Kosten bitte von Hand eintragen.`;
  }
  function auslesenKontext(k) {
    const ks = Object.keys(S.techniker);
    return { hochlader: k,
      techniker: ks.map((x) => ({ k: x, name: S.techniker[x].name, namen: S.techniker[x].aliase || [] })),
      einsaetze: Object.fromEntries(ks.map((x) => [x, einsaetzeVon(x).map((e) => ({ schluessel: e.schluessel, datum: e.datum, auftrags_nr: e.auftrags_nr }))])) };
  }
  const tageAbstand = (a, b) => { try { return Math.abs(Math.round((K.parseDatum(a) - K.parseDatum(b)) / 86400000)); } catch { return 9999; } };
  function einsatzOptionen(k, gewaehlt, datum) {
    let liste = S.techniker[k] ? einsaetzeVon(k) : [];
    // Techniker sehen bei Kollegen nur gemeinsame Einsätze (gleicher Auftrag und Tag)
    if (!istAdmin() && k !== S.meinK) {
      const eigene = new Set(einsaetzeVon(S.meinK).map((e) => e.schluessel));
      liste = liste.filter((e) => eigene.has(e.schluessel));
    }
    const sortiert = datum ? [...liste].sort((a, b) => tageAbstand(a.datum, datum) - tageAbstand(b.datum, datum)) : [...liste].reverse();
    return sortiert.slice(0, 40).map((e) => {
      const d = K.parseDatum(e.datum);
      return `<option value="${esc(e.schluessel)}" ${e.schluessel === gewaehlt ? "selected" : ""}>${WOCHENTAG[d.getUTCDay()]} ${esc(e.datum)} · ${e.auftrags_nr ? `Auftrag ${esc(e.auftrags_nr)}` : esc(e.bezeichnung || "Einsatz")}${e.kunde ? ` · ${esc(e.kunde)}` : ""}</option>`;
    }).join("");
  }
  function naechsterEinsatz(k, datum) {
    const liste = S.techniker[k] ? einsaetzeVon(k).filter((e) => tageAbstand(e.datum, datum) <= 3) : [];
    return liste.sort((a, b) => tageAbstand(a.datum, datum) - tageAbstand(b.datum, datum)).map((e) => e.schluessel)[0] || "";
  }

  /** Neue Belege nacheinander auslesen und den Vorschlag bestätigen lassen */
  async function belegeAuslesen(k, neue, vorgabe) {
    if (!S.sample) return;
    for (const n of neue) {
      const vorschau = n.basis.typ && n.basis.typ.startsWith("image/") ? URL.createObjectURL(n.quelle) : "";
      S.vorschlag = { k, belegId: n.id, basis: n.basis, vorschau, laeuft: true, eintraege: [], hinweise: [] };
      vorschlagZeigen();
      try {
        const a = await belegLesen(n.quelle, n.basis.typ);
        if (!a || typeof a !== "object") throw { code: "invalid_json" };
        const r = K.belegAuswerten(a, auslesenKontext(k));
        const datum = K.datumAus(a.anreise) || K.datumAus(a.datum);
        const hinweise = [...r.hinweise];
        // schon gebucht (auch über eine Kopie desselben Fotos)? Dann nicht noch einmal vorschlagen
        const foto = n.basis.asset || n.basis.datei;
        const gebucht = Object.values(S.kosten).filter((x) => x.beleg && (x.beleg === n.id
          || (foto && S.belege[x.beleg] && (S.belege[x.beleg].asset || S.belege[x.beleg].datei) === foto)));
        if (gebucht.length) hinweise.unshift(`Dieser Beleg ist schon gebucht (${gebucht.map((x) => x.bezeichnung).join(", ")}). Nur ankreuzen, wenn wirklich zusätzlich gebucht werden soll.`);
        if (a.lesbar === false) hinweise.unshift("Der Beleg ist schlecht lesbar – bitte die Werte genau prüfen.");
        if (datum && tageAbstand(datum, heuteText()) > 120) hinweise.push(`Der Beleg ist vom ${datum} und liegt lange zurück.`);
        Object.assign(S.vorschlag, { laeuft: false, auslesung: a, art: r.art, datum, hinweise,
          eintraege: r.eintraege.map((e) => ({ ...e, einsatz: (vorgabe && e.k === k ? vorgabe : e.einsatz) || "", an: Boolean(e.k) && !gebucht.length,
            betrag: zahlText(e.betrag), menge: zahlText(e.menge), naechte: e.naechte ? zahlText(e.naechte) : null })) });
      } catch (e) {
        console.error(e);
        Object.assign(S.vorschlag, { laeuft: false, fehler: sampleFehlerText(e) });
        // Nicht erlaubt oder nicht verfügbar: für diese Sitzung nicht mehr fragen, Fotos nur noch ablegen
        if (["not_granted", "sampling_disabled", "images_unavailable", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code)) S.sample = null;
      }
      vorschlagZeigen();
      await new Promise((ok) => { S.vorschlagFertig = ok; });
      if (vorschau) URL.revokeObjectURL(vorschau);
      if (!S.sample) break;
    }
  }
  function vorschlagZeigen() {
    const v = S.vorschlag;
    if (!v) return;
    const bild = v.vorschau ? `<img src="${esc(v.vorschau)}" alt="">` : "";
    if (v.laeuft) {
      oeffneDialog(`<div class="dlg-kopf"><h2>Beleg wird gelesen</h2></div>
        <div class="dlg-inhalt"><div class="lesen">${bild}<div class="kreisel" aria-hidden="true"></div>
          <p>Claude liest Betrag, Datum und Nächte aus.</p><p class="leise klein">Das dauert meist 10 bis 40 Sekunden. Der Beleg ist schon gespeichert.</p></div></div>`);
      return;
    }
    const a = v.auslesung || {};
    const ks = Object.keys(S.techniker).sort((x, y) => S.techniker[x].name.localeCompare(S.techniker[y].name, "de"));
    const brutto = Number(a.summe_brutto);
    const netto = (v.eintraege || []).reduce((s, e) => s + Number(e.netto || 0), 0);
    const karten = (v.eintraege || []).map((e, i) => `<section class="vorschlag">
        <label class="check"><input type="checkbox" data-v="an" data-i="${i}" id="v-an-${i}" ${e.an ? "checked" : ""}> <b>${esc(e.bezeichnung)}</b></label>
        <div class="felder">
          <label>Techniker<select data-v="k" data-i="${i}" id="v-k-${i}"><option value="">– wählen –</option>${ks.map((x) => `<option value="${esc(x)}" ${x === e.k ? "selected" : ""}>${esc(S.techniker[x].name)}</option>`).join("")}</select></label>
          <label>Einsatz<select data-v="einsatz" data-i="${i}" id="v-e-${i}"><option value="">– Einsatz wählen –</option>${einsatzOptionen(e.k, e.einsatz, v.datum)}</select></label>
          <label class="ganz">Bezeichnung auf der Rechnung<input data-v="bezeichnung" data-i="${i}" id="v-b-${i}" value="${esc(e.bezeichnung)}"></label>
          <label>Netto €<input data-v="betrag" data-i="${i}" id="v-p-${i}" value="${esc(e.betrag)}" inputmode="decimal"></label>
          <label>Menge<input data-v="menge" data-i="${i}" id="v-m-${i}" value="${esc(e.menge)}" inputmode="decimal"></label>
          ${e.naechte !== null ? `<label>Nächte<input data-v="naechte" data-i="${i}" id="v-n-${i}" value="${esc(e.naechte)}" inputmode="numeric"></label>` : ""}
        </div>
        <p class="leise klein">Netto ${esc(K.zahl(e.netto))} € · brutto ${esc(K.zahl(e.brutto))} € laut Beleg</p>
        ${e.hinweise.map((h) => `<p class="hinweis klein">${esc(h)}</p>`).join("")}
      </section>`).join("");
    const bereit = (v.eintraege || []).some((e) => e.an && e.k && e.einsatz);
    oeffneDialog(`<div class="dlg-kopf"><h2>${v.fehler ? "Beleg gespeichert" : "Beleg ausgelesen"}</h2><button class="knopf still" data-aktion="vorschlag-ablegen" type="button">Schließen</button></div>
      <div class="dlg-inhalt">
        ${v.fehler ? `<div class="lesen">${bild}<p class="hinweis">${esc(v.fehler)}</p></div>` : `
        <div class="beleg-kopf">${bild}<div><b>${esc(ART_TEXT[v.art] || "Beleg")}${a.haendler ? ` · ${esc(a.haendler)}` : ""}</b>
          <div class="leise">${esc(v.datum || a.datum || "")}${Number.isFinite(brutto) ? ` · ${esc(K.euro(brutto))} brutto` : ""}${netto ? ` · ${esc(K.euro(K.runden(netto)))} netto` : ""}</div></div></div>
        ${v.hinweise.map((h) => `<p class="hinweis">${esc(h)}</p>`).join("")}
        ${karten || `<p class="leise">Nichts zu verrechnen. Der Beleg bleibt abgelegt${v.basis.einsatz ? " beim Einsatz" : " unter „Belege ohne Einsatz“"}.</p>`}`}
      </div>
      <div class="dlg-fuss"><span class="leise klein">${v.fehler ? "" : "Hotel und Parken werden netto gebucht."}</span>
        <div class="aktionen">
          <button class="knopf zweit" data-aktion="vorschlag-ablegen" type="button">${karten ? "Nur ablegen" : "Fertig"}</button>
          ${karten ? `<button class="knopf" data-aktion="vorschlag-uebernehmen" type="button" ${bereit ? "" : "disabled"}>Buchen</button>` : ""}
        </div></div>`);
  }
  function vorschlagBeenden() {
    const fertig = S.vorschlagFertig;
    S.vorschlag = null; S.vorschlagFertig = null;
    schliesseDialog();
    if (fertig) fertig();
  }
  async function vorschlagUebernehmen(knopf) {
    const v = S.vorschlag;
    if (!v) return;
    const gewaehlt = v.eintraege.filter((e) => e.an && e.k && e.einsatz);
    const werte = [];
    for (const e of gewaehlt) {
      let betrag, menge, naechte = null;
      try { betrag = K.zahlEingabe(e.betrag); menge = K.zahlEingabe(e.menge) ?? 1; if (e.naechte !== null) naechte = K.zahlEingabe(e.naechte) || 1; } catch { betrag = null; }
      if (!Number.isFinite(betrag) || betrag === null || !menge) { melde(`„${e.bezeichnung}“: Betrag und Menge bitte als Zahl eingeben.`, true); return; }
      werte.push({ e, betrag, menge, naechte });
    }
    knopf.disabled = true;
    const jetzt = new Date().toISOString();
    const ok = await schreibe(async () => {
      let basisVergeben = false;
      // das hochgeladene Foto gehört zuerst zum eigenen Eintrag, sonst zum ersten
      const reihenfolge = [...werte].sort((x, y) => (y.e.k === v.k) - (x.e.k === v.k));
      for (const { e, betrag, menge, naechte } of reihenfolge) {
        let belegId;
        if (!basisVergeben) {
          await S.db.doc(`belege/${v.belegId}`).set({ ...v.basis, techniker: e.k, einsatz: e.einsatz });
          belegId = v.belegId; basisVergeben = true;
        } else {
          belegId = (await S.db.collection("belege").add({ ...v.basis, techniker: e.k, einsatz: e.einsatz, erstellt: jetzt })).id;
        }
        await S.db.collection("kosten").add({ techniker: e.k, einsatz: e.einsatz, bezeichnung: String(e.bezeichnung || "").trim() || "Kosten",
          betrag, menge, ...(naechte ? { naechte } : {}), beleg: belegId, erstellt: jetzt, von: S.ich.id });
      }
    }, werte.length === 1 ? "Gebucht." : `${werte.length} Buchungen angelegt.`);
    knopf.disabled = false;
    if (ok) vorschlagBeenden();
  }

  // ---------- Dialoge ----------

    const d = $("#dialog");
    $("#dialog-inhalt").innerHTML = html;
    if (!d.open) d.showModal();
  }
  function schliesseDialog() { const d = $("#dialog"); if (d.open) d.close(); }

  function korrekturDialog(id) {
    const z = S.zettel[id];
    if (!z) return;
    const internText = (r) => ((z.intern || {})[K.blockKey(r.datum, r.techniker)] || [])
      .map((i) => (i.von ? `${i.von}-${i.bis}` : K.zahl(i.stunden || 0))).join("; ");
    const zeile = (r, n) => `<div class="zeile-edit felder" data-zeile="${n}">
      <label>Datum<input name="datum" value="${esc(r.datum)}" placeholder="TT.MM.JJJJ" id="kz-d-${n}"></label>
      <label>Techniker<input name="techniker" value="${esc(r.techniker)}" id="kz-t-${n}"></label>
      <label>Anfahrt<input name="anfahrt" value="${esc(r.anfahrt || "")}" placeholder="07:15-08:30" id="kz-an-${n}"></label>

      <label class="ganz">Planungszeit (ibs intern)<input name="intern" value="${esc(internText(r))}" placeholder="13:30-14:45 oder 1,5 – mehrere mit ;" id="kz-i-${n}"></label>
    </div>`;
    const neu = { datum: "", techniker: (S.techniker[z.techniker] || {}).name || "", anfahrt: "", arbeit: "", abfahrt: "", km: null };
    oeffneDialog(`
      <div class="dlg-kopf"><h2>${esc(z.datei)} korrigieren</h2><button class="knopf still" data-aktion="dialog-zu">Abbrechen</button></div>

        </div>

        <p class="leise klein">Die leere Zeile unten fügt einen Tag hinzu. Zum Entfernen das Datum leeren.</p>
        ${Object.values(z.arbeiten || {}).map((t) => `<p class="leise klein"><b>Arbeiten ausgeführt:</b> ${esc(t)}</p>`).join("")}
      </form>
      <div class="dlg-fuss"><span></span><button class="knopf" type="submit" form="korrektur-form">Speichern</button></div>`);
  }

  function korrekturSpeichern(form) {
    const id = form.dataset.id;
    const z = S.zettel[id];
    const zeilen = [];
    const intern = {};
    for (const zeileEl of form.querySelectorAll("[data-zeile]")) {
      const wert = (n) => zeileEl.querySelector(`[name="${n}"]`).value.trim();
      if (!wert("datum")) continue;
      K.parseDatum(wert("datum"));
      const r = { datum: wert("datum"), techniker: wert("techniker") };
      for (const s of K.SEGMENTE) r[s] = K.spanneEingabe(wert(s));
      r.km = wert("km") ? parseInt(wert("km"), 10) : null;
      if (wert("km") && !Number.isFinite(r.km)) throw new Error("km");
      zeilen.push(r);
      const eintraege = wert("intern").split(";").map((x) => x.trim()).filter(Boolean).map((teil) => {
        if (teil.includes("-") || teil.includes("–")) {
          const [von, bis] = K.spanneEingabe(teil).split("-");
          return { von, bis, stunden: null, text: `ibs intern ${teil}` };
        }
        return { von: null, bis: null, stunden: K.betrag(teil), text: `ibs intern ${teil} Std` };
      });
      if (eintraege.length) intern[K.blockKey(r.datum, r.techniker)] = eintraege;
    }
    const f = new FormData(form);
    const neu = { ...z, auftrags_nr: String(f.get("auftrags_nr") || "").trim() || z.auftrags_nr, kunde: String(f.get("kunde") || "").trim(),
      rueckfahrt: f.get("rueckfahrt") === "on", zeilen, intern, warnungen: [], korrigiert: true };
    // Auftrags-Nr. oder Datum geändert: gebuchte Kosten und Belege hängen am alten Einsatz und ziehen mit um
    const datei = z.datei || id;
    const technikerVon = (name) => Object.keys(S.techniker).find((k) => namenVon(k).some((n) => K.normName(n) === K.normName(name)));
    const umzug = [];
    for (const zeileEl of form.querySelectorAll("[data-zeile]")) {
      const alt = (z.zeilen || [])[+zeileEl.dataset.zeile];
      const datum = zeileEl.querySelector('[name="datum"]').value.trim();
      if (!alt || !datum) continue;
      const von = `${z.auftrags_nr || datei}|${alt.datum}`;
      const nach = `${neu.auftrags_nr || datei}|${datum}`;
      const k = technikerVon(zeileEl.querySelector('[name="techniker"]').value) || technikerVon(alt.techniker) || z.techniker;
      if (von !== nach && k) umzug.push({ k, von, nach });
    }
    return { zettel: neu, umzug };
  }
  async function korrekturUebernehmen(id, { zettel, umzug }) {
    await S.db.doc(`zettel/${id}`).set(zettel);
    for (const { k, von, nach } of umzug) {
      for (const [kid, x] of Object.entries(S.kosten)) if (x.techniker === k && x.einsatz === von) await S.db.doc(`kosten/${kid}`).update({ einsatz: nach });
      for (const [bid, x] of Object.entries(S.belege)) if (x.techniker === k && x.einsatz === von) await S.db.doc(`belege/${bid}`).update({ einsatz: nach });
    }
  }

      return;
    }
    if (el.matches("[data-kunde-wahl]") && S.entwurf) {
      const k = S.kunden.find((x) => x.id === el.value);
      Object.assign(S.entwurf, k ? { kunde_id: k.id, kunde_name: k.name, adresse: k.adresse || "" } : { kunde_id: "", kunde_name: "", adresse: "" });
      entwurfMerken(); render(); return;
    }
    if (el.matches("[data-filter-techniker]")) { S.filter.techniker = el.value; render(); return; }
    if (el.matches("[data-kal-techniker]")) { S.kalender.techniker = el.value; render(); return; }
    if (el.dataset.zugang) { await zugangSetzen(el.dataset.zugang, el.value); return; }
    if (el.dataset.schreibweise && el.value) { await schreibweiseZuordnen(el.dataset.schreibweise, el.value); return; }
    if (el.dataset.bezahltDatum) {
      if (!el.value) { melde("Bitte ein Datum wählen – zum Zurücksetzen auf „Bezahlt“ tippen.", true); render(); return; }
      await bezahltSetzen(el.dataset.bezahltDatum, true, el.value);
      return;
    }
    if (el.dataset.belegEinsatz && el.files.length) {
      const dateien = [...el.files];
      el.value = "";
      const neue = await belegeHochladen(el.dataset.techniker, el.dataset.belegEinsatz, dateien);
      if (neue && neue.length) await belegeAuslesen(el.dataset.techniker, neue, el.dataset.belegEinsatz);
      return;
    }
    if (el.id === "datei-wahl" && el.files.length) {
      const dateien = [...el.files];
      el.value = "";
      try { await zettelHochladen(el.dataset.techniker, dateien); }
      catch (e) { melde(e.message || String(e), true); }
    }
    if (el.id === "uebernahme-wahl" && el.files.length) {
      const datei = el.files[0];
      el.value = "";
      await uebernahmeLesen(datei);
      return;
    }
    if (el.id === "logo-wahl" && el.files.length) {
      const datei = el.files[0];
      el.value = "";
      try {
        const bild = await new Promise((ok, fehler) => {
          const img = new Image();
          img.onload = () => ok(img);
          img.onerror = () => fehler(new Error("Das Bild konnte nicht gelesen werden."));
          img.src = URL.createObjectURL(datei);
        });
        const faktor = Math.min(1, 1200 / bild.naturalWidth);
        const c = document.createElement("canvas");
        c.width = Math.round(bild.naturalWidth * faktor);
        c.height = Math.round(bild.naturalHeight * faktor);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(bild, 0, 0, c.width, c.height);
        const daten = c.toDataURL("image/jpeg", 0.88);
        await schreibe(() => S.db.doc("einstellungen/logo").set({ daten, format: "JPEG", breite: c.width, hoehe: c.height }), "Logo gespeichert.");
      } catch (e) { melde(e.message || String(e), true); }
    }
  }

  window.addEventListener("hashchange", () => { S.loeschBestaetigung = null; render(); window.scrollTo(0, 0); });
  $("#dialog").addEventListener("click", (ev) => { if (ev.target === $("#dialog")) schliesseDialog(); });
  $("#dialog").addEventListener("close", () => { if (S.vorschlagFertig && S.vorschlag && !S.vorschlag.laeuft) vorschlagBeenden(); });

  // ---------- Start ----------
  async function start() {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") { S.ohneDb = true; render(); return; }
    const [db, user, downloads, assets, sample] = await Promise.all(["db", "user", "downloads", "assets", "sample"].map((n) => claude.use(n).catch(() => null)));
    S.db = db; S.downloads = downloads; S.assets = assets; S.user = user; S.sample = sample;
    if (sample) S.sampleBilder = ((await sample.limits().catch(() => null)) || {}).images || null;
    if (!db) { S.ohneDb = true; render(); return; }
    if (user) {
      const ich = await user.me();
      S.ich = { id: ich.id, name: ich.name || "", owner: Boolean(ich.isOwner) };
      const darf = await user.can("data.write").catch(() => null);
      S.kannSchreiben = darf !== false;
    }
    const fehler = (e) => { console.error(e); melde("Die Verbindung zum Speicher ist unterbrochen. Bitte die Seite neu laden.", true); };
    db.collection("zuordnung").onSnapshot((snap) => {
      S.zuordnung = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
      S.geladen.add("zuordnung"); rolleBestimmen();
    }, fehler);
    for (const name of SAMMLUNGEN) {
      db.collection(name).onSnapshot((snap) => {
        S[name] = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
        S.geladen.add(name); rolleBestimmen();
      }, fehler);
    }
    try { await schluesselLaden(); } catch (e) { console.error(e); }
    S.geladen.add("schluessel");
    rolleBestimmen();
  }

  /** Admin ist, wer den Schlüssel hat (der Inhaber bekommt ihn beim ersten Öffnen). */
  async function schluesselLaden() {
    if (!S.ich.id) return;
    const eigen = await S.db.doc(`schluessel/${S.ich.id}`).get();
    let roh = eigen.exists ? (eigen.data() || {}).k : null;
    const pruef = await S.db.doc("einstellungen/pruef").get();
    if (!roh) {
      if (!S.ich.owner) return;
      // Nie einen neuen Schlüssel erzeugen, wenn schon verschlüsselt wurde – sonst wären die Rechnungen unlesbar
      if (pruef.exists) { S.schluesselFehlt = true; return; }
      roh = b64(crypto.getRandomValues(new Uint8Array(32)));
      await S.db.doc(`schluessel/${S.ich.id}`).set({ k: roh, erstellt: new Date().toISOString() });
      // Falls die App gleichzeitig auf einem zweiten Gerät startet: den gespeicherten Schlüssel nehmen
      await new Promise((r) => setTimeout(r, 400));
      roh = ((await S.db.doc(`schluessel/${S.ich.id}`).get()).data() || {}).k || roh;
      S.schluessel = await schluesselImport(roh);
      await S.db.doc("einstellungen/pruef").set(await verschluesseln({ pruef: "ok" }));
    } else {
      const key = await schluesselImport(roh);
      if (pruef.exists) {
        try { if ((await entschluesseln(pruef.data(), key)).pruef !== "ok") throw new Error(); } catch { S.schluesselFalsch = true; return; }
      }
      S.schluessel = key;
      S.nurVerschluesselt = pruef.exists;
    }
    S.schluesselRoh = roh;
  }

  let adminGestartet = false;
  function rolleBestimmen() {
    if (!["zuordnung", "schluessel", ...SAMMLUNGEN].every((x) => S.geladen.has(x))) return;
    const z = S.ich.id ? S.zuordnung[S.ich.id] : null;
    const vorher = S.rolle;
    if (S.schluessel) S.rolle = "admin";
    else if (z && z.techniker && S.techniker[z.techniker]) { S.rolle = "techniker"; S.meinK = z.techniker; }
    else S.rolle = "wartet";
    if (S.rolle === "admin" && !adminGestartet) { adminGestartet = true; adminDatenLaden(); }
    if (S.rolle === "wartet" && vorher !== "wartet") anmeldungMelden();
    if (vorher !== S.rolle && S.rolle === "techniker" && !location.hash.startsWith("#kalender")) history.replaceState(null, "", `#t-${S.meinK}`);
    planeRender();
  }

  async function anmeldungMelden() {
    if (!S.ich.id || !S.kannSchreiben) return;
    try {
      const ref = S.db.doc(`anmeldung/${S.ich.id}`);
      if (!(await ref.get()).exists) await ref.set({ erstellt: new Date().toISOString() });
    } catch (e) { console.warn("Anmeldung nicht gespeichert", e); }
  }

  const unverschluesselt = new Set();
  async function nachverschluesseln(pfad, daten) {
    // Alte Daten aus der Zeit vor der Anmeldung einmalig verschlüsseln
    if (!S.schluessel || !S.kannSchreiben || unverschluesselt.has(pfad)) return;
    unverschluesselt.add(pfad);
    try { await geheimSpeichern(pfad, daten); } catch (e) { console.warn("Nicht verschlüsselt:", pfad, e); }
  }

  function adminDatenLaden() {
    const db = S.db;
    const fehler = (e) => { console.error(e); melde("Die Verbindung zum Speicher ist unterbrochen. Bitte die Seite neu laden.", true); };
    let lauf = 0;
    db.collection("rechnungen").onSnapshot(async (snap) => {
      const meinLauf = ++lauf;
      const erg = {};
      for (const d of snap.docs) {
        const roh = d.data();
        try {
          erg[d.id] = await entschluesseln(roh);
          if (!roh.enc) nachverschluesseln(`rechnungen/${d.id}`, roh);
          S.unlesbar.delete(`rechnungen/${d.id}`);
        } catch (e) { console.warn("Rechnung nicht lesbar", d.id, e); S.unlesbar.add(`rechnungen/${d.id}`); }
      }
      if (meinLauf !== lauf) return;
      for (const x of [...S.unlesbar]) if (x.startsWith("rechnungen/") && !snap.docs.some((d) => `rechnungen/${d.id}` === x)) S.unlesbar.delete(x);
      S.rechnungen = erg; S.geladen.add("rechnungen"); planeRender();
    }, fehler);
    db.doc("einstellungen/app").onSnapshot(async (snap) => {
      const roh = snap.exists ? snap.data() : {};
      try { S.einstRoh = snap.exists ? await entschluesseln(roh) : {}; S.unlesbar.delete("einstellungen/app"); }
      catch { S.einstRoh = {}; S.unlesbar.add("einstellungen/app"); }
      if (snap.exists && !roh.enc) nachverschluesseln("einstellungen/app", roh);
      S.geladen.add("einst"); planeRender();
    }, fehler);
    db.doc("einstellungen/export").onSnapshot(async (snap) => {
      try { S.exportStand = snap.exists ? await entschluesseln(snap.data()) : null; } catch { S.exportStand = null; }
      planeRender();
    }, fehler);
    db.doc("einstellungen/logo").onSnapshot((snap) => { S.logo = snap.exists ? snap.data() : null; planeRender(); }, fehler);
    db.doc("einstellungen/kunden").onSnapshot(async (snap) => {
      try { S.kunden = snap.exists ? ((await entschluesseln(snap.data())).liste || []) : []; S.unlesbar.delete("einstellungen/kunden"); }
      catch { S.kunden = []; S.unlesbar.add("einstellungen/kunden"); }
      planeRender();
    }, fehler);
    db.collection("anmeldung").onSnapshot((snap) => {
      S.anmeldungen = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
      planeRender();
    }, fehler);
  }

  start();
})();
</script>
