  const S = {
    db: null, downloads: null, assets: null, user: null, kannSchreiben: true, ohneDb: false,
    // Anmeldung: rolle "admin" (hat den Schlüssel), "techniker" (zugeordnet), "wartet" (noch nicht freigeschaltet)
    ich: { id: null, name: "", owner: false }, rolle: null, meinK: null, schluessel: null, schluesselRoh: null, schluesselFehlt: false, schluesselFalsch: false,
    nurVerschluesselt: false, unlesbar: new Set(),
    zuordnung: {}, anmeldungen: {}, profile: {}, exportStand: null, dateiUrls: {},
    kunden: [], entwurf: null, entwurfFehler: null, // freie Rechnungen an andere Kunden
    sample: null, sampleBilder: null, vorschlag: null, vorschlagFertig: null, // Belege auslesen
    einstRoh: null, logo: null, techniker: {}, zettel: {}, kosten: {}, einsaetze: {}, rechnungen: {}, belege: {}, abwesenheiten: {},
    geladen: new Set(), offeneDetails: new Set(), beschaeftigt: new Set(), loeschBestaetigung: null,
    filter: { status: "alle", techniker: "" },
    kalender: null, // {monat: Date (1. des Monats, UTC), woche: "2026-KW40", techniker: ""}
  };
  // Dateien (Auftragszettel, Belegfotos) liegen unter /_blob/<id>; die eigenständige Version kann in einem Unterordner liegen
  const blobUrl = (id) => `${(window.PLATTFORM && window.PLATTFORM.blobPfad) || "/_blob/"}${id}`;
  const SAMMLUNGEN = ["techniker", "zettel", "kosten", "einsaetze", "belege", "abwesenheiten"]; // für alle angemeldeten Mitarbeiter
  const istAdmin = () => S.rolle === "admin";

  // ---------- Hilfen ----------
  const $ = (sel, wurzel = document) => wurzel.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const einst = () => ({ ...STANDARD, ...(S.einstRoh || {}) });
  const heute = () => new Date();
  const heuteText = () => { const d = heute(); return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`; };
  const zeitText = (sp) => (sp ? sp.replace("-", "–") : "–");
  const wocheText = (w) => w.replace("-KW", " · KW ");
  const docId = (s) => String(s).normalize("NFKD").replace(/[^\w.\-~:@+]/g, "_").replace(/^\.+$/, "_").slice(0, 150);

  // ---------- Verschlüsselung: Rechnungen und Einstellungen lesen nur Admins ----------
  const b64 = (buf) => btoa(Array.from(new Uint8Array(buf), (c) => String.fromCharCode(c)).join(""));
  const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
  const schluesselImport = (roh) => crypto.subtle.importKey("raw", unb64(roh), "AES-GCM", false, ["encrypt", "decrypt"]);
  async function verschluesseln(obj, key = S.schluessel) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const daten = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { enc: 1, iv: b64(iv), daten: b64(daten) };
  }
  async function entschluesseln(d, key = S.schluessel) {
    if (d && !d.enc && S.nurVerschluesselt) throw new Error("unverschlüsselt – nicht übernommen");
    if (!d || !d.enc) return d;
    const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(d.iv) }, key, unb64(d.daten));
    return JSON.parse(new TextDecoder().decode(klar));
  }
  async function geheimSpeichern(pfad, obj) {
    if (!S.schluessel) throw new Error("Nur Admins können das speichern.");
    if (S.unlesbar.has(pfad)) throw new Error(`${pfad} ist nicht lesbar – Speichern gesperrt, damit nichts überschrieben wird.`);
    await S.db.doc(pfad).set(await verschluesseln(obj));
  }

  let meldungTimer = 0;
  function melde(text, fehler = false) {
    const el = $("#meldung");
    el.textContent = text;
    el.className = fehler ? "fehler" : "";
    el.hidden = false;
    clearTimeout(meldungTimer);
    meldungTimer = setTimeout(() => { el.hidden = true; }, fehler ? 7000 : 3500);
  }

  const skripte = {};
  function ladeSkript(url) {
    return (skripte[url] ||= new Promise((ok, fehler) => {
      const s = document.createElement("script");
      s.src = url;
      s.onload = ok;
      s.onerror = () => { delete skripte[url]; fehler(new Error("Eine Programmbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.")); };
      document.head.appendChild(s);
    }));
  }
  async function pdfjs() { await ladeSkript(CDN.pdf); await ladeSkript(CDN.worker); return window.pdfjsLib; }
  async function jsPDF() { await ladeSkript(CDN.jspdf); return window.jspdf.jsPDF; }

  async function schreibe(fn, erfolg) {
    if (!S.db) { melde("Speichern ist hier nicht möglich – bitte die App in claude.ai öffnen.", true); return false; }
    try {
      await fn();
      if (erfolg) melde(erfolg);
      return true;
    } catch (e) {
      console.error(e);
      const code = e && e.code;
      melde(code === "invalid_argument" ? "Keine Berechtigung zum Ändern – du kannst die Daten nur ansehen."
        : code === "quota_exceeded" ? "Der Speicher ist voll. Bitte alte Auftragszettel oder Rechnungen löschen."
        : `Speichern fehlgeschlagen: ${e && e.message ? e.message : e}`, true);
      return false;
    }
  }

  // ---------- Daten ableiten ----------
  /** Zettel, die zu Techniker k gehören: selbst hochgeladen oder er steht mit drauf (z. B. Zettel des Kollegen). */
  /** Name und weitere Schreibweisen, unter denen der Techniker auf Zetteln steht (z. B. „Samed Makbay“) */
  function namenVon(k) {
    const t = S.techniker[k];
    return t ? [t.name, ...(t.aliase || [])].filter(Boolean) : [];
  }
  function zettelVon(k) {
    const namen = new Set(namenVon(k).map(K.normName));
    return Object.entries(S.zettel).filter(([, z]) => z.techniker === k || (z.zeilen || []).some((r) => namen.has(K.normName(r.techniker))));
  }
  /** {Schlüssel im Einsatz (Dateiname) → [Dokument-ID, Zettel]} */
  function zettelIndexVon(k) {
    const index = {};
    for (const [id, z] of zettelVon(k).sort(([a], [b]) => (a < b ? -1 : 1))) {
      const key = z.datei && !index[z.datei] ? z.datei : id;
      index[key] = [id, z];
    }
    return index;
  }
  /** Techniker (Kürzel), die auf einem Zettel stehen */
  function technikerAufZettel(z) {
    const namen = new Set((z.zeilen || []).map((r) => K.normName(r.techniker)));
    return Object.keys(S.techniker).filter((k) => namenVon(k).some((n) => namen.has(K.normName(n))));
  }
  /** Namen auf dem Zettel, die zu keinem Techniker passen (Schreibweise wie auf dem Zettel) */
  function unbekannteNamen(z) {
    const bekannt = new Set(Object.keys(S.techniker).flatMap((k) => namenVon(k).map(K.normName)));
    const erg = new Map();
    for (const r of z.zeilen || []) if (r.techniker && !bekannt.has(K.normName(r.techniker))) erg.set(K.normName(r.techniker), r.techniker.trim());
    return [...erg.values()];
  }
  async function schreibweiseZuordnen(name, k) {
    const t = S.techniker[k];
    if (!t) return;
    const aliase = [...new Set([...(t.aliase || []), name])];
    await schreibe(() => S.db.doc(`techniker/${k}`).set({ ...t, aliase }), `„${name}“ gehört jetzt zu ${t.name}.`);
  }
  function extrasVon(k) {
    return {
      kosten: Object.entries(S.kosten).filter(([, x]) => x.techniker === k).map(([id, x]) => ({ ...x, id })),
      einsaetze: Object.entries(S.einsaetze).filter(([, x]) => x.techniker === k).map(([id, x]) => ({ ...x, id })),
    };
  }
  function belegeVon(k, einsatz) {
    return Object.entries(S.belege).filter(([, b]) => b.techniker === k && b.einsatz === einsatz)
      .sort(([, a], [, b]) => String(a.erstellt).localeCompare(String(b.erstellt)));
  }
  function einsaetzeVon(k) {
    const t = S.techniker[k];
    if (!t) return [];
    const index = Object.fromEntries(Object.entries(zettelIndexVon(k)).map(([key, [, z]]) => [key, z]));
    return K.einsaetze(index, namenVon(k), extrasVon(k));
  }
  function rechnungFuer(k, woche) {
    return Object.values(S.rechnungen).find((r) => r.techniker === k && r.woche === woche) || null;
  }
  function kurzname(k) { const t = S.techniker[k] || {}; return t.kurzname || K.kurznameVon(t.name); }
  function offeneWochenVon(k) {
    const vorhanden = new Set(Object.values(S.rechnungen).filter((r) => r.techniker === k).map((r) => r.woche));
    return K.offeneWochen(einsaetzeVon(k), vorhanden, heute());
  }
  function naechsteNummerAnzeige() {
    const e = einst();
    const jahr = heute().getFullYear();
    const nr = Number(e.nummer_jahr) === jahr ? Number(e.nummer_naechste) : 1;
    return `${jahr}-${String(nr).padStart(3, "0")}`;
  }

  // ---------- Zahlungsstatus ----------
  const isoDatum = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const isoZuText = (iso) => (iso ? iso.split("-").reverse().join(".") : "");
  const textZuIso = (t) => (/^\d{2}\.\d{2}\.\d{4}$/.test(t || "") ? t.split(".").reverse().join("-") : "");
  const zahlText = (x) => (x === null || x === undefined || x === "" ? "" : String(Math.round(Number(x) * 1000) / 1000).replace(".", ","));
  const istFrei = (r) => r && r.art === "frei";
  /** Für Listen: an wen bzw. für wen (IBS-Rechnung: Techniker, freie Rechnung: Kunde) */
  const rechnungWer = (r) => (istFrei(r) ? r.kunde_name || "Kunde" : r.techniker_name || "");
  const rechnungWas = (r) => (istFrei(r) ? r.betreff || r.leistungszeitraum || "freie Rechnung" : wocheText(r.woche || ""));
  function faelligAm(r) {
    const d = K.parseDatum(r.datum);
    d.setUTCDate(d.getUTCDate() + (Number(einst().zahlungsziel_tage) || 0));
    return d;
  }
  function zahlungsstatus(r) {
    if (r.bezahlt) return "bezahlt";
    const h = heute();
    return faelligAm(r) < Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) ? "ueberfaellig" : "offen";
  }
  const STATUS_TEXT = { offen: "Offen", ueberfaellig: "Überfällig", bezahlt: "✓ Bezahlt" };
  function offenSumme(liste) {
    const offen = liste.filter((r) => !r.bezahlt);
    const ueber = offen.filter((r) => zahlungsstatus(r) === "ueberfaellig");
    return { offen, ueber, betrag: K.runden(offen.reduce((s, r) => s + r.brutto, 0)), ueberBetrag: K.runden(ueber.reduce((s, r) => s + r.brutto, 0)) };
  }

  async function bezahltSetzen(nummer, bezahlt, datumIso) {
    const r = S.rechnungen[nummer];
    if (!r) return;
    const aenderung = bezahlt ? { bezahlt: true, bezahlt_am: datumIso || isoDatum(heute()) } : { bezahlt: false, bezahlt_am: null };
    const ok = await schreibe(() => geheimSpeichern(`rechnungen/${nummer}`, { ...r, ...aenderung }),
      bezahlt ? `Rechnung ${nummer} als bezahlt markiert.` : `Rechnung ${nummer} wieder offen.`);
    if (ok) { S.rechnungen[nummer] = { ...r, ...aenderung }; planeRender(); }
  }

  // ---------- Rechnungen ----------
  // Rechnungen nacheinander anlegen: ein zweiter Tipp oder „alle abrechnen“ parallel vergibt sonst dieselbe Nummer
  let rechnungSperre = Promise.resolve();
  function nacheinander(f) {
    const p = rechnungSperre.then(f, f);
    rechnungSperre = p.catch(() => {});
    return p;
  }
  /** Sätze, mit denen eine Rechnung erstellt wurde (ältere Rechnungen: aktuelle Einstellungen) */
  const SAETZE = ["stundensatz", "km_satz", "planung_nacht", "mwst"];
  const saetzeVon = (r) => ({ ...einst(), ...(r && r.saetze ? r.saetze : {}) });
  const kurznameFuer = (r, k) => (r && typeof r.kurzname === "string" ? r.kurzname : kurzname(k));

  async function nummerVergeben() {
    if ([...S.unlesbar].some((x) => x.startsWith("rechnungen/"))) throw new Error("Eine gespeicherte Rechnung lässt sich nicht öffnen – neue Rechnungen sind gesperrt, bis das geklärt ist.");
    const e = einst();
    const jahr = heute().getFullYear();
    let nr = Number(e.nummer_jahr) === jahr ? Number(e.nummer_naechste) || 1 : 1;
    let nummer = `${jahr}-${String(nr).padStart(3, "0")}`;
    while (S.rechnungen[nummer] || (await S.db.doc(`rechnungen/${nummer}`).get()).exists) {
      nr += 1;
      nummer = `${jahr}-${String(nr).padStart(3, "0")}`;
    }
    await geheimSpeichern("einstellungen/app", { ...einst(), nummer_jahr: jahr, nummer_naechste: nr + 1 });
    return nummer;
  }

  function rechnungErstellen(k, woche) { return nacheinander(() => rechnungErstellenJetzt(k, woche)); }
  async function rechnungErstellenJetzt(k, woche) {
    const liste = einsaetzeVon(k).filter((e) => e.woche === woche);
    if (!liste.length) throw new Error(`Keine Einsätze in ${wocheText(woche)}`);
    const alt = rechnungFuer(k, woche);
    // neu erstellen: mit den Sätzen der ursprünglichen Rechnung, neue Rechnung: aktuelle Einstellungen
    const saetze = Object.fromEntries(SAETZE.map((x) => [x, saetzeVon(alt)[x]]));
    const kn = kurznameFuer(alt, k);
    const daten = K.rechnungsDaten(liste, { ...einst(), ...saetze }, kn);
    const nummer = alt ? alt.nummer : await nummerVergeben();
    const meta = {
      ...daten, nummer, woche, techniker: k, techniker_name: S.techniker[k].name, datum: heuteText(), saetze, kurzname: kn,
      erstellt: new Date().toISOString(), version: (alt ? alt.version || 1 : 0) + 1,
      bezahlt: alt ? Boolean(alt.bezahlt) : false, bezahlt_am: alt ? alt.bezahlt_am || null : null,
    };
    await geheimSpeichern(`rechnungen/${nummer}`, meta);
    S.rechnungen[nummer] = meta; // sofort verfügbar, der Snapshot folgt
    return meta;
  }

  async function logoDaten() {
    return S.logo && S.logo.daten ? { daten: S.logo.daten, format: S.logo.format || "JPEG", breite: S.logo.breite, hoehe: S.logo.hoehe } : null;
  }

  async function pdfVon(meta) {
    const Pdf = await jsPDF();
    return K.rechnungPdf(Pdf, meta, einst(), await logoDaten());
  }

  async function vorschau(nummer, entwurfMeta = null) {
    const meta = entwurfMeta || S.rechnungen[nummer];
    if (!meta) return;
    oeffneDialog(`
      <div class="dlg-kopf"><h2>${entwurfMeta ? "Vorschau (Entwurf)" : `Rechnung ${esc(nummer)}`}</h2><button class="knopf still" data-aktion="dialog-zu">Schließen</button></div>
      <div class="dlg-inhalt vorschau" id="vorschau-seiten"><p class="leise">PDF wird erstellt …</p></div>
      <div class="dlg-fuss"><span class="leise">${esc(rechnungWer(meta))} · ${esc(rechnungWas(meta))} · ${esc(K.euro(meta.brutto))}</span>
        ${S.downloads && !entwurfMeta ? `<button class="knopf" data-aktion="pdf-speichern" data-nummer="${esc(nummer)}">PDF speichern</button>` : ""}</div>`);
    try {
      const buf = await pdfVon(meta);
      const lib = await pdfjs();
      const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
      const ziel = $("#vorschau-seiten");
      if (!ziel) return;
      ziel.innerHTML = "";
      for (let i = 1; i <= doc.numPages; i++) {
        const seite = await doc.getPage(i);
        const vp = seite.getViewport({ scale: 2 });
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        c.setAttribute("aria-label", `Seite ${i} von ${doc.numPages}`);
        ziel.appendChild(c);
        await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      console.error(e);
      const ziel = $("#vorschau-seiten");
      if (ziel) ziel.innerHTML = `<p class="hinweis">Vorschau nicht möglich: ${esc(e.message || e)}</p>`;
    }
  }

  async function pdfSpeichern(nummer) {
    const meta = S.rechnungen[nummer];
    if (!meta || !S.downloads) return;
    try {
      const buf = await pdfVon(meta);
      await S.downloads.save({ filename: `Rechnung_${nummer}.pdf`, data: new Blob([buf], { type: "application/pdf" }) });
      melde(`Rechnung_${nummer}.pdf gespeichert.`);
    } catch (e) {
      if (e && e.code === "declined") return;
      melde(e && e.code === "rate_limited" ? "Bitte kurz warten und noch einmal tippen." : `Speichern nicht möglich: ${e.message || e}`, true);
    }
  }

  async function csvSpeichern() {
    const zeilen = Object.values(S.rechnungen).sort((a, b) => (a.nummer < b.nummer ? -1 : 1));
    const feld = (x) => { const s = String(x ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const komma = (x) => Number(x || 0).toFixed(2).replace(".", ",");
    const ibs = String(einst().empfaenger || "").split("\n")[0];
    const csv = [["Rechnungsnummer", "Rechnungsdatum", "Kunde", "Techniker", "Kalenderwoche", "Leistungszeitraum", "Netto", "MwSt", "Brutto",
      "Fällig am", "Status", "Bezahlt am", "Aufträge"],
      ...zeilen.map((r) => [r.nummer, r.datum, istFrei(r) ? r.kunde_name : ibs, istFrei(r) ? "" : r.techniker_name, r.woche ? wocheText(r.woche) : "", r.leistungszeitraum,
        komma(r.netto), komma(r.mwst), komma(r.brutto), K.datumText(faelligAm(r)), STATUS_TEXT[zahlungsstatus(r)].replace("✓ ", ""),
        isoZuText(r.bezahlt_am), [...new Set(r.auftraege || [])].join(", ")])]
      .map((z) => z.map(feld).join(";")).join("\r\n");
    try {
      await S.downloads.save({ filename: `rechnungen-${new Date().toISOString().slice(0, 10)}.csv`, data: "﻿" + csv });
      melde("Rechnungsliste gespeichert.");
    } catch (e) {
      if (e && e.code !== "declined") melde(`Speichern nicht möglich: ${e.message || e}`, true);
    }
  }

  // ---------- Auftragszettel hochladen ----------
  async function zettelHochladen(k, dateien) {
    const lib = await pdfjs();
    const balken = $("#upload-balken");
    const status = $("#upload-status");
    let ok = 0;
    const fehler = [];
    const kollegen = new Set();
    const fremdeNamen = new Set();
    const korrigiertBehalten = [];
    for (const [n, datei] of dateien.entries()) {
      if (status) status.textContent = `${datei.name} wird gelesen (${n + 1} von ${dateien.length}) …`;
      try {
        const daten = new Uint8Array(await datei.arrayBuffer());
        const doc = await lib.getDocument({ data: daten.slice(), isEvalSupported: false }).promise;
        const seiten = [];
        for (let i = 1; i <= doc.numPages; i++) seiten.push((await (await doc.getPage(i)).getTextContent()).items);
        const z = K.parseText(K.textAusSeiten(seiten), datei.name);
        const drauf = technikerAufZettel(z);
        if (!istAdmin() && !drauf.includes(k)) throw new Error("Du stehst nicht auf diesem Auftragszettel – bitte nur eigene Zettel hochladen.");
        for (const x of drauf) if (x !== k) kollegen.add(S.techniker[x].name);
        for (const n of unbekannteNamen(z)) fremdeNamen.add(n);
        const id = docId(`${k}_${datei.name}`);
        const alt = S.zettel[id];
        let asset = null;
        if (S.assets) {
          try { asset = (await S.assets.upload(new Blob([daten], { type: "application/pdf" }), { type: "application/pdf" })).id; }
          catch (e) { console.warn("Original nicht gespeichert", e); }
        }
        // Original nur ersetzen, wenn das neue gespeichert ist; eine Korrektur durch einen Admin bleibt erhalten
        const behalten = alt && alt.korrigiert
          ? { auftrags_nr: alt.auftrags_nr, kunde: alt.kunde, rueckfahrt: alt.rueckfahrt, zeilen: alt.zeilen, intern: alt.intern, warnungen: alt.warnungen, korrigiert: true } : {};
        if (alt && alt.korrigiert) korrigiertBehalten.push(datei.name);
        await S.db.doc(`zettel/${id}`).set({ ...z, ...behalten, techniker: k, datei: datei.name, asset: asset || (alt && alt.asset) || null, hochgeladen: new Date().toISOString() });
        if (alt && alt.asset && asset && alt.asset !== asset && S.assets) S.assets.delete(alt.asset).catch(() => {});
        ok += 1;
      } catch (e) {
        console.error(e);
        fehler.push(`${datei.name}: ${e && e.name === "InvalidPDFException" ? "keine lesbare PDF-Datei" : (e.message || e)}`);
      }
      if (balken) balken.style.width = `${Math.round(((n + 1) / dateien.length) * 100)}%`;
    }
    if (status) status.textContent = "";
    if (balken) balken.style.width = "0";
    if (fehler.length) melde(`${ok} gelesen. Nicht gelesen: ${fehler.join(" · ")}`, true);
    else melde(`${ok} Auftragszettel hochgeladen.${kollegen.size ? ` Auch eingetragen bei: ${[...kollegen].join(", ")}.` : ""}${korrigiertBehalten.length
      ? ` Korrektur bleibt erhalten bei: ${korrigiertBehalten.join(", ")}.` : ""}${fremdeNamen.size
      ? ` Unbekannter Name auf dem Zettel: ${[...fremdeNamen].join(", ")} – ${istAdmin() ? "unter „Techniker“ zuordnen" : "Kerem oder Bünyamin ordnen ihn zu"}.` : ""}`, fremdeNamen.size > 0);
  }

  // ---------- Darstellung ----------
  function ansicht() {
    const h = location.hash.replace(/^#/, "");
    if (S.rolle === "techniker") return h === "kalender" ? { name: "kalender" } : { name: "techniker", k: S.meinK };
    if (h.startsWith("t-") && S.techniker[h.slice(2)]) return { name: "techniker", k: h.slice(2) };
    if (["rechnungen", "einstellungen", "kalender", "ordner"].includes(h)) return { name: h };
    if (h === "frei" || h.startsWith("frei-")) return { name: "frei", nummer: h.slice(5) || null };
    return { name: "uebersicht" };
  }

  function navigation() {
    const admin = istAdmin();
    for (const a of document.querySelectorAll("[data-reiter]")) {
      const r = a.dataset.reiter;
      a.hidden = !S.rolle || S.rolle === "wartet" ? true : admin ? false : !["uebersicht", "kalender"].includes(r);
      if (r === "uebersicht") {
        a.querySelector(".reiter-text").textContent = admin ? "Techniker" : "Meine Einsätze";
        a.querySelector(".ic-admin").toggleAttribute("hidden", !admin); a.querySelector(".ic-technik").toggleAttribute("hidden", admin);
        a.href = admin ? "#uebersicht" : `#t-${S.meinK}`;
      }
    }
    $("#marke-text").textContent = admin ? "Rechnungen" : "Auftragszettel";
    $(".marke").href = admin ? "#uebersicht" : S.meinK ? `#t-${S.meinK}` : "#";
  }

  let renderGeplant = false;
  let renderAufgeschoben = false;
  function planeRender() {
    if (renderGeplant) return;
    renderGeplant = true;
    requestAnimationFrame(() => {
      renderGeplant = false;
      const aktiv = document.activeElement;
      // Nicht neu zeichnen, während jemand tippt – sonst geht die Eingabe verloren
      if (aktiv && $("#app").contains(aktiv) && /^(INPUT|TEXTAREA|SELECT)$/.test(aktiv.tagName) && aktiv.type !== "file") {
        renderAufgeschoben = true;
        return;
      }
      render();
    });
  }
  document.addEventListener("focusout", () => { if (renderAufgeschoben) { renderAufgeschoben = false; setTimeout(planeRender, 0); } });

  function render() {
    const v = ansicht();
    for (const a of document.querySelectorAll("[data-reiter]")) {
      const aktiv = a.dataset.reiter === (v.name === "techniker" ? "uebersicht" : v.name === "frei" ? "rechnungen" : v.name);
      if (aktiv) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    }
    const app = $("#app");
    navigation();
    if (S.ohneDb) { app.innerHTML = ansichtOhneDb(); return; }
    if (!S.rolle) return; // Ladezustand bleibt stehen
    if (S.rolle === "wartet") { app.innerHTML = ansichtWartet(); return; }
    if (istAdmin() && !["einst", "rechnungen"].every((x) => S.geladen.has(x))) return;
    try {
      app.innerHTML = (istAdmin() ? warnungUnlesbar() : "") + (v.name === "techniker" ? ansichtTechniker(v.k)
        : v.name === "ordner" ? ansichtOrdner()
        : v.name === "frei" ? ansichtFrei(v.nummer)
        : v.name === "rechnungen" ? ansichtRechnungen()
        : v.name === "einstellungen" ? ansichtEinstellungen()
        : v.name === "kalender" ? ansichtKalender()
        : ansichtUebersicht());
    } catch (e) {
      console.error(e);
      app.innerHTML = `<section class="karte leer"><h2>Diese Ansicht lässt sich nicht anzeigen</h2>
        <p class="leise">Ein Eintrag enthält Daten, mit denen die App nicht rechnen kann. Es wurde nichts verändert.</p>
        <p class="hinweis">${esc(e && e.message ? e.message : String(e))}</p>
        <p><a class="knopf zweit" href="#einstellungen">Einstellungen</a> <a class="knopf zweit" href="#uebersicht">Techniker</a></p></section>`;
    }
    for (const d of app.querySelectorAll("details[data-key]")) d.open = S.offeneDetails.has(d.dataset.key);
  }

  /** Verschlüsselte Dokumente, die sich nicht öffnen lassen: nichts überschreiben, nicht neu abrechnen */
  function warnungUnlesbar() {
    if (!S.unlesbar.size) return "";
    const liste = [...S.unlesbar].sort();
    const rech = liste.filter((x) => x.startsWith("rechnungen/"));
    return `<section class="karte"><p class="hinweis"><b>${liste.length === 1 ? "Ein Eintrag lässt" : `${liste.length} Einträge lassen`} sich nicht öffnen</b>
      (beschädigt oder nicht mit eurem Schlüssel gespeichert): ${liste.map((x) => esc(x.replace("rechnungen/", "Rechnung ").replace("einstellungen/", "Einstellungen "))).join(", ")}.
      Sie werden nicht überschrieben${rech.length ? "; neue Rechnungen sind gesperrt, bis das geklärt ist, damit keine Woche doppelt abgerechnet wird" : ""}.</p>
      ${rech.map((x) => loeschKnopf("unlesbar-loeschen", x, `${x.replace("rechnungen/", "Rechnung ")} löschen`)).join(" ")}</section>`;
  }

  function ansichtOhneDb() {
    return `<section class="karte leer"><div class="symbol" aria-hidden="true"></div>
      <h2>Bitte in claude.ai öffnen</h2>
      <p class="leise">Die App speichert Techniker, Auftragszettel und Rechnungen in deinem claude.ai-Konto.
      Öffne den Link in der Claude-App oder auf claude.ai und melde dich an.</p></section>`;
  }

  function ansichtWartet() {
    const wer = S.ich.name ? `Hallo ${esc(S.ich.name.split(" ")[0])}! ` : "";
    if (S.schluesselFehlt || S.schluesselFalsch) {
      return `<section class="karte leer"><div class="symbol" aria-hidden="true"></div>
        <h2>${wer}Schlüssel ${S.schluesselFehlt ? "fehlt" : "passt nicht"}</h2>
        <p class="leise">Die Rechnungen sind verschlüsselt. ${S.schluesselFehlt ? "In deinem Konto ist kein Schlüssel gespeichert" : "Der Schlüssel in deinem Konto passt nicht zu den gespeicherten Daten"}.
        Es wurde nichts verändert und es wird nichts überschrieben.</p>
        <p class="hinweis">Ein anderer Admin kann dir unter Einstellungen → Zugänge die Admin-Rechte erneut geben. Bitte nichts löschen.</p></section>`;
    }
    const text = !S.ich.id
      ? "Dein claude.ai-Konto hat in dieser App keine Kennung. Bitte melde dich bei claude.ai an oder sprich mit Kerem."
      : !S.kannSchreiben
        ? "Du wurdest nur zum Ansehen eingeladen. Bitte Kerem, dich in claude.ai über „Teilen“ als Bearbeiter einzuladen."
        : "Dein Zugang ist noch nicht freigeschaltet. Sag Kerem oder Bünyamin Bescheid – sie ordnen dich in der App deinem Namen zu. Danach siehst du hier deine Einsätze.";
    return `<section class="karte leer"><div class="symbol" aria-hidden="true"></div>
      <h2>${wer}Noch kein Zugang</h2><p class="leise">${text}</p>
</section>`;
  }

  function nurLesen() { return S.kannSchreiben ? "" : `<p class="hinweis info">Du kannst die Daten ansehen, aber nicht ändern.</p>`; }

  function abschnittUnbekannteNamen() {
    const funde = new Map();
    for (const z of Object.values(S.zettel)) for (const n of unbekannteNamen(z)) {
      const key = K.normName(n);
      const f = funde.get(key) || { name: n, dateien: [] };
      f.dateien.push(z.datei);
      funde.set(key, f);
    }
    if (!funde.size) return "";
    const ks = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));
    return `<section class="karte"><h2>Unbekannte Namen auf Auftragszetteln</h2>
      <p class="leise">Diese Namen stehen auf Zetteln, passen aber zu keinem Techniker – oft eine andere Schreibweise. Wähle aus, wer gemeint ist; die Einsätze erscheinen dann bei ihm.</p>
      <div class="liste">${[...funde.values()].map((f) => `<div class="liste-zeile"><div class="text"><b>${esc(f.name)}</b>
          <div class="leise klein">${esc([...new Set(f.dateien)].join(", "))}</div></div>
        <select data-schreibweise="${esc(f.name)}" aria-label="Techniker für ${esc(f.name)}" style="width:auto;max-width:100%" ${S.kannSchreiben ? "" : "disabled"}>
          <option value="">Wer ist das?</option>${ks.map((k) => `<option value="${esc(k)}">${esc(S.techniker[k].name)}</option>`).join("")}
        </select></div>`).join("")}</div></section>`;
  }

  function ansichtUebersicht() {
    const ks = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));
    const offenGesamt = ks.reduce((n, k) => n + offeneWochenVon(k).length, 0);
    const farben = technikerFarben();
    const karten = ks.map((k) => {
      const t = S.techniker[k];
      const e = einsaetzeVon(k);
      const offen = offeneWochenVon(k).length;
      const warn = e.reduce((n, x) => n + x.warnungen.length, 0);
      const eigene = Object.values(S.rechnungen).filter((r) => r.techniker === k);
      const letzte = eigene.sort((a, b) => (a.nummer < b.nummer ? 1 : -1))[0];
      const unbezahlt = offenSumme(eigene);
      const initialen = t.name.split(/\s+/).filter(Boolean).map((x) => x[0]).slice(0, 1).concat(t.name.split(/\s+/).filter(Boolean).slice(-1).map((x) => x[0])).join("").toUpperCase();
      return `<a class="karte techniker-karte" href="#t-${esc(k)}">
        <span class="avatar" style="--farbe:${farben[k]}" aria-hidden="true">${esc(initialen)}</span>
        <div class="tk-inhalt">
        <h2>${esc(t.name)}</h2>
        <div class="leise">${zettelVon(k).length} Auftragszettel · ${e.length} Einsätze</div>
        <div class="aktionen">
          ${offen ? `<span class="chip">${offen} Woche${offen > 1 ? "n" : ""} offen</span>` : `<span class="chip gut">alles abgerechnet</span>`}
          ${unbezahlt.offen.length ? `<span class="chip ${unbezahlt.ueber.length ? "warn" : "grau"}">${unbezahlt.offen.length} Rechnung${unbezahlt.offen.length > 1 ? "en" : ""} unbezahlt</span>` : ""}
          ${warn ? `<span class="chip warn">${warn} Hinweis${warn > 1 ? "e" : ""}</span>` : ""}
        </div>
        ${letzte ? `<div class="leise klein">Letzte Rechnung ${esc(letzte.nummer)} · ${esc(K.euro(letzte.brutto))}</div>` : ""}
        </div>
      </a>`;
    }).join("");
    return `
      <div class="kopf"><h1>Techniker. <span class="grau">Einsätze und Wochen im Blick.</span></h1>
        ${offenGesamt && S.kannSchreiben ? `<button class="knopf" data-aktion="alle-abrechnen" ${S.beschaeftigt.has("alle") ? "disabled" : ""}>${offenGesamt} offene Woche${offenGesamt > 1 ? "n" : ""} abrechnen</button>` : ""}</div>
      ${nurLesen()}
      ${abschnittUnbekannteNamen()}
      ${(() => { const o = offenSumme(Object.values(S.rechnungen)); return o.offen.length
        ? `<a class="hinweis ${o.ueber.length ? "" : "info"}" href="#rechnungen" style="text-decoration:none">${o.offen.length} Rechnung${o.offen.length > 1 ? "en" : ""} offen · ${esc(K.euro(o.betrag))}${o.ueber.length ? ` – davon ${o.ueber.length} überfällig (${esc(K.euro(o.ueberBetrag))})` : ""} →</a>` : ""; })()}
      ${ks.length ? `<div class="raster">${karten}</div>` : `<section class="karte leer"><div class="symbol" aria-hidden="true"></div>
        <h2>Noch keine Techniker</h2><p class="leise">Lege unten den ersten Techniker an. Danach lädst du seine Auftragszettel hoch.</p></section>`}
      ${S.kannSchreiben ? `<section class="karte">
        <details ${ks.length ? 'data-key="techniker-neu"' : "open"}><summary>Techniker anlegen</summary>
        <form data-form="techniker" class="felder">
          <label>Name (wie auf dem Auftragszettel)<input name="name" required autocomplete="off" placeholder="Vorname Nachname" id="neu-name"></label>
          <label>Kürzel<input name="kuerzel" required maxlength="10" autocomplete="off" placeholder="z. B. KI" id="neu-kuerzel"></label>
          <button class="knopf">Anlegen</button>
        </form></details>
      </section>` : ""}
      <p class="leise klein">Nächste Rechnungsnummer: <b>${esc(naechsteNummerAnzeige())}</b> · Stundensatz ${esc(K.euro(einst().stundensatz))} netto · Kilometer ${esc(K.euro(einst().km_satz))}</p>`;
  }

  function einsatzKarte(k, e) {
    const spanne = (label, sp, fehlt = false) => `<div><span>${label}</span><b class="zeit ${fehlt ? "fehlt" : ""}">${esc(zeitText(sp))}</b>
      ${sp ? `<small class="leise zeit">${esc(K.zahl(K.stunden(sp)))} Std.</small>` : ""}</div>`;
    const zeiten = `<div class="zeiten">
      ${spanne("Anfahrt", e.anfahrt)}${spanne("Arbeitszeit", e.arbeit)}${e.weiter ? `<div><span>Abfahrt</span><b class="zeit">weiter</b>
        <small class="leise">zu ${e.weiter.auftrags_nr ? `Auftrag ${esc(e.weiter.auftrags_nr)}` : esc(e.weiter.kunde || "nächstem Einsatz")}</small></div>`
        : spanne("Abfahrt", e.abfahrt, !e.abfahrt && !e.manuell)}
      <div><span>km</span><b class="zeit">${esc(e.km ?? "–")}</b></div>
      <div><span>Zusammen</span><b class="zeit">${esc(K.zahl(e.stunden))} Std.</b></div>
      ${e.planung_stunden ? `<div><span>Planung (ibs intern)</span><b class="zeit">${esc(K.zahl(e.planung_stunden))} Std.</b></div>` : ""}
    </div>`;
    const kosten = e.kosten.map((x) => `<span class="chip">${esc(x.bezeichnung)}${istAdmin() ? ` · ${esc(K.euro(x.betrag))}` : ""}${Number(x.menge) !== 1 ? ` × ${esc(K.zahl(x.menge))}` : ""}
      ${S.kannSchreiben && (istAdmin() || x.von === S.ich.id) ? `<button data-aktion="kosten-loeschen" data-id="${esc(x.id)}" aria-label="${esc(x.bezeichnung)} löschen" title="löschen">×</button>` : ""}</span>`).join("");
    const key = `k:${e.schluessel}`;
    const d = K.parseDatum(e.datum);
    const belege = belegeVon(k, e.schluessel);
    const belegId = `beleg-${docId(e.schluessel)}`;
    const laedt = S.beschaeftigt.has(`b:${e.schluessel}`);
    for (const [, b] of belege) dateiUrlLaden(b.datei);
    const belegHtml = belege.length || S.kannSchreiben ? `<div class="belege"><span class="leise">Belege</span>
      ${belege.map(([id, b], i) => `<button class="beleg" data-aktion="beleg-ansehen" data-id="${esc(id)}" aria-label="Beleg ${i + 1} ansehen">${b.typ === "application/pdf"
        ? "PDF" : belegUrl(b) ? `<img src="${esc(belegUrl(b))}" alt="" loading="lazy">` : "…"}</button>`).join("")}
      ${S.kannSchreiben ? `<label class="beleg neu" for="${belegId}" aria-busy="${laedt}">${laedt ? "lädt …" : "+ Foto"}</label>
        <input type="file" class="beleg-datei" id="${belegId}" accept="image/*,application/pdf" multiple data-beleg-einsatz="${esc(e.schluessel)}" data-techniker="${esc(k)}">` : ""}
    </div>` : "";
    return `<div class="einsatz">
      <div class="einsatz-kopf">
        <strong>${WOCHENTAG[d.getUTCDay()]} ${esc(e.datum)}</strong>
        <span>${e.auftrags_nr ? `Auftrag ${esc(e.auftrags_nr)}` : ""} ${esc(e.kunde)}</span>
        ${e.manuell ? `<span class="chip grau">ohne Zettel</span>` : ""}
      </div>
      ${zeiten}
      ${e.warnungen.map((w) => `<div class="hinweis">${esc(w)}</div>`).join("")}
      <div class="kosten">${kosten}</div>
      ${belegHtml}
      ${S.kannSchreiben ? `<details data-key="${esc(key)}"><summary>Kosten (Parken, Hotel …)</summary>
        <form data-form="kosten" class="felder" data-einsatz="${esc(e.schluessel)}" data-techniker="${esc(k)}">
          <label>Art<input name="bezeichnung" list="kostenarten" required placeholder="Parkkosten" id="kb-${esc(docId(e.schluessel))}"></label>
          <label>Betrag €<input name="betrag" inputmode="decimal" required placeholder="4,20" id="kp-${esc(docId(e.schluessel))}"></label>
          <label>Menge (bei Hotel: Nächte)<input name="menge" inputmode="decimal" value="1" id="km-${esc(docId(e.schluessel))}"></label>
          <button class="knopf zweit">Hinzufügen</button>
        </form></details>` : ""}
      ${e.manuell && S.kannSchreiben && istAdmin() ? `<div class="aktionen">${loeschKnopf("einsatz-loeschen", e.id, "Einsatz löschen")}</div>` : ""}
    </div>`;
  }

  function belegeOhneEinsatz(k, alle) {
    const schluessel = new Set(alle.map((e) => e.schluessel));
    const liste = Object.entries(S.belege).filter(([, b]) => b.techniker === k && (!b.einsatz || !schluessel.has(b.einsatz)))
      .sort(([, a], [, b]) => String(b.erstellt).localeCompare(String(a.erstellt)));
    if (!liste.length) return "";
    for (const [, b] of liste) dateiUrlLaden(b.datei);
    return `<section class="karte"><h2>Belege ohne Einsatz</h2>
      <p class="leise">Noch keinem Einsatz zugeordnet, z. B. Material ohne Auftragsnummer. Antippen, um zuzuordnen${S.sample ? " oder auszulesen" : ""}.</p>
      <div class="belege">${liste.map(([id, b], i) => `<button class="beleg" data-aktion="beleg-ansehen" data-id="${esc(id)}" aria-label="Beleg ${i + 1} ansehen">${b.typ === "application/pdf"
        ? "PDF" : belegUrl(b) ? `<img src="${esc(belegUrl(b))}" alt="" loading="lazy">` : "…"}</button>`).join("")}</div></section>`;
  }

  function loeschKnopf(aktion, id, text) {
    const bestaetigen = S.loeschBestaetigung === `${aktion}:${id}`;
    return `<button class="knopf ${bestaetigen ? "gefahr" : "still"}" data-aktion="${aktion}" data-id="${esc(id)}">${bestaetigen ? "Wirklich löschen?" : esc(text)}</button>`;
  }

  function ansichtTechniker(k) {
    const t = S.techniker[k];
    const alle = einsaetzeVon(k);
    const e = einst();
    const h = heute();
    const hTag = Date.UTC(h.getFullYear(), h.getMonth(), h.getDate());
    const wochen = Object.entries(K.wochen(alle)).map(([woche, liste]) => {
      const [mo, so] = K.wocheZeitraum(woche);
      const r = rechnungFuer(k, woche);
      const daten = r ? K.rechnungsDaten(liste, saetzeVon(r), kurznameFuer(r, k)) : K.rechnungsDaten(liste, e, kurzname(k));
      const veraltet = r && !r.bearbeitet && K.rechnungGeaendert(r, daten);
      const abgeschlossen = so < hTag;
      const neuMarke = `neu:${k}:${woche}`;
      const zs = r ? zahlungsstatus(r) : null;
      const status = !istAdmin() ? "" : r ? (veraltet ? `<span class="chip warn">Zettel geändert – neu erstellen?</span>`
        : `<span class="chip ${zs === "bezahlt" ? "gut" : zs === "ueberfaellig" ? "warn" : ""}">Rechnung ${esc(r.nummer)}${r.bearbeitet ? " · bearbeitet" : ""} · ${zs === "bezahlt" ? "bezahlt" : zs === "ueberfaellig" ? "überfällig" : "offen"}</span>`)
        : abgeschlossen ? `<span class="chip">noch nicht abgerechnet</span>` : `<span class="chip grau">Woche läuft noch</span>`;
      const busy = S.beschaeftigt.has(`r:${k}:${woche}`);
      const knoepfe = !istAdmin() ? "" : [
        r ? `<button class="knopf zweit" data-aktion="vorschau" data-nummer="${esc(r.nummer)}">Ansehen</button>` : "",
        r && S.downloads ? `<button class="knopf still" data-aktion="pdf-speichern" data-nummer="${esc(r.nummer)}">PDF speichern</button>` : "",
        r && S.kannSchreiben ? `<a class="knopf still" href="#frei-${esc(r.nummer)}">Bearbeiten</a>` : "",
        S.kannSchreiben ? `<button class="knopf ${S.loeschBestaetigung === neuMarke ? "gefahr" : r && !veraltet ? "still" : ""}" data-aktion="rechnung" data-k="${esc(k)}" data-woche="${esc(woche)}" ${busy ? "disabled" : ""}>${busy ? "Wird erstellt …"
          : S.loeschBestaetigung === neuMarke ? "Wirklich? Deine Änderungen gehen verloren" : r ? "Neu erstellen" : "Rechnung erstellen"}</button>` : "",
      ].join("");
      return `<section class="karte woche">
        <div class="woche-kopf">
          <div class="woche-titel"><h2>KW ${esc(woche.slice(-2))}</h2><span class="leise">${esc(K.datumText(mo).slice(0, 6))}–${esc(K.datumText(so))}</span> ${status}</div>
          <div class="aktionen">${knoepfe}</div>
        </div>
        ${liste.map((x) => einsatzKarte(k, x)).join("")}
        <div class="woche-fuss"><span>${esc(K.zahl(daten.stunden))} Std. · ${esc(String(Math.round(daten.km)))} km</span>${istAdmin() ? `<span>${esc(K.euro(daten.netto))} netto</span>` : ""}</div>
      </section>`;
    }).join("");
    const admin = istAdmin();
    const zettel = zettelVon(k).sort(([, a], [, b]) => (a.datei < b.datei ? -1 : 1)).map(([id, z]) => {
      const von = z.techniker !== k && S.techniker[z.techniker] ? S.techniker[z.techniker].name : "";
      const mit = technikerAufZettel(z).filter((x) => x !== k).map((x) => S.techniker[x].name);
      return `
      <div class="liste-zeile"><div class="text"><b>${esc(z.datei)}</b>
        <div class="leise klein">${z.auftrags_nr ? `Auftrag ${esc(z.auftrags_nr)} · ` : ""}${esc([...new Set((z.zeilen || []).map((r) => r.datum))].join(", "))} · ${z.rueckfahrt ? "Rückfahrt" : "Auftrag"}${z.korrigiert ? " · korrigiert" : ""}${von ? ` · hochgeladen von ${esc(von)}` : ""}${mit.length ? ` · mit ${esc(mit.join(", "))}` : ""}</div>
        ${admin && unbekannteNamen(z).length ? `<div class="leise klein"><span class="chip warn">unbekannt: ${esc(unbekannteNamen(z).join(", "))}</span> – in der Übersicht zuordnen</div>` : ""}</div>
        <div class="aktionen">
          ${z.asset ? `<a class="knopf still" href="${esc(blobUrl(z.asset))}" target="_blank" rel="noopener">Original</a>` : ""}
          ${S.kannSchreiben && admin ? `<button class="knopf still" data-aktion="korrigieren" data-id="${esc(id)}">Korrigieren</button>` : ""}

        </div></div>`;
    }).join("");
    return `
      ${admin ? `<a class="zurueck" href="#uebersicht">← Alle Techniker</a>` : ""}
      <div class="kopf"><h1>${admin ? `${esc(t.name)}. <span class="grau">Einsätze nach Woche.</span>` : `Deine Einsätze. <span class="grau">${esc(t.name)}</span>`}</h1></div>
      ${admin ? "" : `<p class="leise klein">Hier siehst du deine Einsätze. Rechnungen und abgerechnete Beträge sehen nur Kerem und Bünyamin.</p>`}
      ${nurLesen()}
      ${S.kannSchreiben ? `<section class="upload">
        <h2>Auftragszettel hochladen</h2>
        <p class="leise">PDFs aus Dateien, Mail oder iCloud – gern mehrere auf einmal, auch Rückfahrt-Zettel. Zeiten, km und „ibs intern“ liest die App selbst. Steht ein Kollege mit auf dem Zettel, erscheint der Einsatz auch bei ihm.</p>
        <label class="knopf" for="datei-wahl">PDFs auswählen</label>
        <input type="file" id="datei-wahl" accept="application/pdf,.pdf" multiple data-techniker="${esc(k)}">

        <div class="leise klein" id="upload-status"></div>
        <div class="beleg-upload">
          <h3>Belege: Hotel, Parken, Material</h3>
          <p class="leise">Foto oder PDF. ${S.sample ? "Die App liest Betrag, Datum und Nächte aus und schlägt die Buchung vor. Material nur mit handschriftlicher Auftragsnummer." : "Die Kosten trägst du danach beim Einsatz ein."}</p>
          <label class="knopf zweit" for="beleg-wahl">Beleg hochladen</label>
          <input type="file" id="beleg-wahl" class="beleg-datei" accept="image/*,application/pdf" multiple data-techniker="${esc(k)}">
        </div>
      </section>
      ${belegeOhneEinsatz(k, alle)}
      ${admin ? `<section class="karte">
        <details data-key="neu-einsatz"><summary>Einsatz ohne Auftragszettel (z. B. Arbeit bei IBS)</summary>
          <form data-form="einsatz" class="felder" data-techniker="${esc(k)}">
            <label>Datum<input name="datum" value="${esc(heuteText())}" placeholder="TT.MM.JJJJ" required id="ne-datum"></label>
            <label>Bezeichnung<input name="bezeichnung" value="IBS" required id="ne-bez"></label>
            <label>Auftrags-Nr. (falls vorhanden)<input name="auftrags_nr" inputmode="numeric" id="ne-nr"></label>
            <label>Anfahrt<input name="anfahrt" placeholder="07:00-07:45" id="ne-an"></label>
            <label>Arbeitszeit<input name="arbeit" placeholder="07:45-09:00" id="ne-ar"></label>
            <label>Rückfahrt<input name="abfahrt" placeholder="09:00-09:30" id="ne-ab"></label>
            <label>km<input name="km" inputmode="numeric" id="ne-km"></label>
            <button class="knopf zweit">Hinzufügen</button>
          </form>
          <p class="leise klein">Ohne Auftrags-Nr. steht er auf der Rechnung z. B. als „IBS, 31.03.26, 7:45-9:00 Uhr“ mit der Position Arbeitslohn.</p>
        </details>
      </section>` : ""}` : ""}
      ${wochen || `<section class="karte leer"><div class="symbol" aria-hidden="true"></div><h2>Noch keine Einsätze</h2>
        <p class="leise">Lade die ersten Auftragszettel hoch – die Einsätze erscheinen hier nach Kalenderwochen sortiert.</p></section>`}
      <section class="karte">
        <details data-key="zettel-liste"><summary>Auftragszettel (${zettelVon(k).length})</summary>
          <div class="liste">${zettel || `<p class="leise">Noch keine Zettel.</p>`}</div></details>
      </section>
      ${S.kannSchreiben && admin ? `<section class="karte">
        <details data-key="techniker-daten"><summary>Name, Schreibweise und Tagessoll</summary>
          <form data-form="techniker-daten" class="felder" data-techniker="${esc(k)}">
            <label>Name (wie auf dem Auftragszettel)<input name="name" value="${esc(t.name)}" required id="td-name"></label>
            <label>Auf der Rechnung<input name="kurzname" value="${esc(t.kurzname || "")}" placeholder="${esc(K.kurznameVon(t.name))}" id="td-kurz"></label>
            <label class="ganz">Weitere Schreibweisen auf Zetteln (mit Komma trennen)<input name="aliase" value="${esc((t.aliase || []).join(", "))}" placeholder="z. B. Samed Makbay" id="td-aliase"></label>
            <label>Tagessoll in Stunden (Mo–Fr)<input name="tagessoll" value="${esc(stdText(sollVon(k)))}" inputmode="decimal" id="td-soll"></label>
            <label>Soll zählt ab (leer = erster Einsatz)<input type="date" name="soll_ab" value="${esc(datumOderNull(t.soll_ab) ? t.soll_ab.split(".").reverse().join("-") : "")}" id="td-soll-ab"></label>
            <button class="knopf zweit">Speichern</button>
          </form></details>

      <datalist id="kostenarten">${KOSTENARTEN.map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist>`;
  }

  function ansichtRechnungen() {
    const alle = Object.values(S.rechnungen).sort((a, b) => (a.nummer < b.nummer ? 1 : -1));
    const offeneWochen = Object.keys(S.techniker).reduce((n, k) => n + offeneWochenVon(k).length, 0);
    const f = S.filter;
    const bezahlt = alle.filter((r) => r.bezahlt);
    const { offen, ueber, betrag, ueberBetrag } = offenSumme(alle);
    const liste = alle.filter((r) => (!f.techniker || (f.techniker === "_frei" ? istFrei(r) : r.techniker === f.techniker)) &&
      (f.status === "alle" || (f.status === "offen" ? !r.bezahlt : zahlungsstatus(r) === f.status)));
    const anzahl = (n) => `${n} Rechnung${n === 1 ? "" : "en"}`;
    const kachel = (status, titel, n, summe, klasse = "") => `<button class="kachel ${klasse}" data-aktion="filter" data-status="${status}" aria-pressed="${f.status === status}">
      <span>${titel}</span><b>${esc(K.euro(summe))}</b><small>${anzahl(n)}</small></button>`;
    const filterKnopf = (status, text) => `<button data-aktion="filter" data-status="${status}" aria-pressed="${f.status === status}">${text}</button>`;
    const techniker = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));
    const zeilen = liste.map((r) => {
      const woche = !istFrei(r) && S.techniker[r.techniker] ? einsaetzeVon(r.techniker).filter((e) => e.woche === r.woche) : [];
      const aktuell = woche.length ? K.rechnungsDaten(woche, saetzeVon(r), kurznameFuer(r, r.techniker)) : null;
      const veraltet = aktuell && K.rechnungGeaendert(r, aktuell);
      const st = zahlungsstatus(r);
      const busy = S.beschaeftigt.has(`z:${r.nummer}`);
      const statusZeile = r.bezahlt
        ? `<span class="bezahlt-datum">bezahlt am ${S.kannSchreiben
          ? `<input type="date" value="${esc(r.bezahlt_am || "")}" data-bezahlt-datum="${esc(r.nummer)}" id="bd-${esc(r.nummer)}" aria-label="Zahlungsdatum ${esc(r.nummer)}">`
          : esc(isoZuText(r.bezahlt_am))}</span>`
        : `<span class="${st === "ueberfaellig" ? "fehlt" : "leise"} klein">fällig am ${esc(K.datumText(faelligAm(r)))}</span>`;
      return `<div class="rechnung">
        <div class="text"><div><b>${esc(r.nummer)}</b> · ${esc(rechnungWer(r))}${istFrei(r) ? "" : ` <span class="leise klein">(IBS)</span>`}</div>
          <div class="leise klein">${esc([rechnungWas(r), istFrei(r) && r.betreff ? r.leistungszeitraum : istFrei(r) ? "" : r.leistungszeitraum, `vom ${r.datum}`].filter(Boolean).join(" · "))}${r.version > 1 ? ` · Version ${esc(r.version)}` : ""}</div>
          ${statusZeile}
          ${r.bearbeitet ? `<span class="chip" style="justify-self:start">von Hand bearbeitet</span>`
            : veraltet ? `<span class="chip warn" style="justify-self:start">Zettel geändert – beim Techniker neu erstellen</span>` : ""}</div>
        <div class="betrag">${esc(K.euro(r.brutto))}</div>
        <div class="aktionen">
          <button class="status-knopf ${st}" data-aktion="bezahlt-umschalten" data-nummer="${esc(r.nummer)}" aria-pressed="${Boolean(r.bezahlt)}"
            ${S.kannSchreiben && !busy ? "" : "disabled"} title="${r.bezahlt ? "Als offen markieren" : "Als bezahlt markieren"}">${STATUS_TEXT[st]}</button>
          <button class="knopf zweit" data-aktion="vorschau" data-nummer="${esc(r.nummer)}">Ansehen</button>
          ${S.kannSchreiben ? `<a class="knopf still" href="#frei-${esc(r.nummer)}">Bearbeiten</a>` : ""}
          ${S.downloads ? `<button class="knopf still" data-aktion="pdf-speichern" data-nummer="${esc(r.nummer)}">PDF</button>` : ""}
          ${S.kannSchreiben ? loeschKnopf("rechnung-loeschen", r.nummer, "Löschen") : ""}</div>
      </div>`;
    }).join("");
    const summe = K.runden(liste.reduce((s, r) => s + r.brutto, 0));
    return `
      <div class="kopf"><h1>Rechnungen. <span class="grau">Offen, fällig, bezahlt.</span></h1>
        <div class="aktionen">
          ${S.kannSchreiben ? `<a class="knopf ${offeneWochen ? "zweit" : ""}" href="#frei">+ Neue Rechnung</a>` : ""}
          ${offeneWochen && S.kannSchreiben ? `<button class="knopf" data-aktion="alle-abrechnen" ${S.beschaeftigt.has("alle") ? "disabled" : ""}>${offeneWochen} offene Woche${offeneWochen > 1 ? "n" : ""} abrechnen</button>` : ""}
          ${alle.length && S.downloads ? `<button class="knopf zweit" data-aktion="csv">Liste für Excel</button>` : ""}
        </div></div>
      ${alle.length ? `<div class="kacheln">
        ${kachel("offen", "Offen", offen.length, betrag)}
        ${kachel("ueberfaellig", "Überfällig", ueber.length, ueberBetrag, ueber.length ? "warn" : "")}
        ${kachel("bezahlt", "Bezahlt", bezahlt.length, K.runden(bezahlt.reduce((s, r) => s + r.brutto, 0)), "gut")}
      </div>` : ""}
      <section class="karte">${alle.length ? `
        <div class="filter" role="group" aria-label="Filter">
          <div class="segment">${filterKnopf("alle", "Alle")}${filterKnopf("offen", "Offen")}${filterKnopf("ueberfaellig", "Überfällig")}${filterKnopf("bezahlt", "Bezahlt")}</div>
          ${techniker.length > 1 || alle.some(istFrei) ? `<select data-filter-techniker id="filter-techniker" aria-label="Techniker oder Kunde">
            <option value="">Alle Rechnungen</option>${techniker.map((k) => `<option value="${esc(k)}" ${f.techniker === k ? "selected" : ""}>IBS · ${esc(S.techniker[k].name)}</option>`).join("")}
            <option value="_frei" ${f.techniker === "_frei" ? "selected" : ""}>Andere Kunden</option></select>` : ""}
        </div>
        <div class="liste">${zeilen || `<p class="leise">Keine Rechnungen für diesen Filter.</p>`}</div>
        <div class="leise klein">${anzahl(liste.length)} · zusammen ${esc(K.euro(summe))} brutto · Zahlungsziel ${esc(String(einst().zahlungsziel_tage))} Tage</div>`
        : `<div class="leer"><div class="symbol" aria-hidden="true"></div><h2>Noch keine Rechnungen</h2>
          <p class="leise">IBS-Rechnungen entstehen beim Techniker je Kalenderwoche – oder hier gesammelt über „offene Wochen abrechnen“. Rechnungen an andere Kunden schreibst du über „+ Neue Rechnung“.</p></div>`}</section>`;
  }

  // ---------- Freie Rechnung an andere Kunden ----------
  const ENTWURF_SCHLUESSEL = "freie-rechnung-entwurf";
  const EINHEITEN = ["Std.", "Stk.", "km", "Pauschale", "m", "Tag"];
  const leerePosition = (vorlage = {}) => ({ titel: "", menge: "1", einheit: "Std.", einzelpreis: "", ...vorlage });
  function neuerEntwurf() {
    const e = einst();
    return { nummer: null, kunde_id: "", kunde_name: "", adresse: "", merken: true, datum: isoDatum(heute()), leistungszeitraum: heuteText(),
      betreff: "", mwst_satz: zahlText(e.mwst), einleitung: e.einleitung, gruppen: [{ titel: "", positionen: [leerePosition()] }] };
  }
  function entwurfAus(r) {
    const ibs = !istFrei(r);
    const [name, ...adresse] = String(r.empfaenger || (ibs ? einst().empfaenger : "") || "").split("\n");
    return { nummer: r.nummer, ibs, gegliedert: ibs, auftraege: [...new Set(r.auftraege || [])].join(", "),
      kunde_id: r.kunde_id || "", kunde_name: (ibs ? name : r.kunde_name || name) || "", adresse: adresse.join("\n"), merken: false,
      datum: textZuIso(r.datum), leistungszeitraum: r.leistungszeitraum || "", betreff: r.betreff || "", mwst_satz: zahlText(r.mwst_satz),
      einleitung: r.einleitung ?? einst().einleitung,
      gruppen: r.gruppen.map((g) => ({ titel: g.titel || "", positionen: g.positionen.map((x) => ({ titel: x.titel, menge: zahlText(x.menge), einheit: x.einheit || "", einzelpreis: zahlText(x.einzelpreis) })) })) };
  }
  function entwurfVorbereiten(nummer) {
    if (S.entwurf && S.entwurf.nummer === (nummer || null)) return;
    S.entwurfFehler = null;
    if (nummer) { S.entwurf = entwurfAus(S.rechnungen[nummer]); return; }
    let gemerkt = null;
    try { gemerkt = JSON.parse(localStorage.getItem(ENTWURF_SCHLUESSEL) || "null"); } catch { gemerkt = null; }
    S.entwurf = gemerkt && Array.isArray(gemerkt.gruppen) ? { ...gemerkt, nummer: null } : neuerEntwurf();
  }
  function entwurfMerken() {
    if (!S.entwurf || S.entwurf.nummer) return;
    try { localStorage.setItem(ENTWURF_SCHLUESSEL, JSON.stringify(S.entwurf)); } catch { /* privat-Modus */ }
  }
  function entwurfVergessen() { try { localStorage.removeItem(ENTWURF_SCHLUESSEL); } catch { /* egal */ } }
  function entwurfSetzen(pfad, wert) {
    const t = pfad.split(":");
    if (t[0] === "g") S.entwurf.gruppen[+t[1]].titel = wert;
    else if (t[0] === "p") S.entwurf.gruppen[+t[1]].positionen[+t[2]][t[3]] = wert;
    else S.entwurf[pfad] = wert;
  }
  function posSumme(x) {
    try { const m = K.zahlEingabe(x.menge) ?? 1; const p = K.zahlEingabe(x.einzelpreis); return p === null ? null : K.runden(m * p); } catch { return null; }
  }
  function freiSummenZeigen() {
    if (!S.entwurf) return;
    const d = K.freieRechnungsDaten(S.entwurf);
    for (const el of document.querySelectorAll("[data-pos-summe]")) {
      const [g, i] = el.dataset.posSumme.split(":").map(Number);
      const x = S.entwurf.gruppen[g] && S.entwurf.gruppen[g].positionen[i];
      const sum = x ? posSumme(x) : null;
      el.textContent = sum === null ? "–" : K.zahl(sum);
    }
    const setze = (n, t) => { const el = $(`[data-summe="${n}"]`); if (el) el.textContent = t; };
    setze("netto", K.euro(d.netto)); setze("mwst", K.euro(d.mwst)); setze("brutto", K.euro(d.brutto));
    setze("satz", `${zahlText(d.mwst_satz)} % MwSt`);
  }
  function freiMeta(e, d, nummer, alt) {
    const kunde = String(e.kunde_name || "").trim();
    const adresse = String(e.adresse || "").split("\n").map((x) => x.trim()).filter(Boolean);
    return {
      art: "frei", nummer, datum: isoZuText(e.datum) || heuteText(), kunde_id: e.kunde_id || null, kunde_name: kunde,
      empfaenger: [kunde, ...adresse].join("\n"), betreff: String(e.betreff || "").trim(), leistungszeitraum: String(e.leistungszeitraum || "").trim(),
      einleitung: String(e.einleitung ?? ""), gruppen: d.gruppen, netto: d.netto, mwst_satz: d.mwst_satz, mwst: d.mwst, brutto: d.brutto,
      auftraege: [], techniker: null, woche: null, erstellt: new Date().toISOString(), version: (alt ? alt.version || 1 : 0) + 1,
      bezahlt: alt ? Boolean(alt.bezahlt) : false, bezahlt_am: alt ? alt.bezahlt_am || null : null,
    };
  }
  /** Bearbeitete IBS-Rechnung: Woche, Techniker und Sätze bleiben, Inhalte wie eingegeben – die Zettel bleiben unverändert */
  function ibsMeta(e, d, alt) {
    const kunde = String(e.kunde_name || "").trim();
    const adresse = String(e.adresse || "").split("\n").map((x) => x.trim()).filter(Boolean);
    const s = K.summen(d.gruppen.flatMap((g) => g.positionen), { mwst: d.mwst_satz });
    return {
      ...alt, datum: isoZuText(e.datum) || alt.datum, empfaenger: [kunde, ...adresse].join("\n"),
      leistungszeitraum: String(e.leistungszeitraum || "").trim(), einleitung: String(e.einleitung ?? ""),
      auftraege: String(e.auftraege || "").split(/[,;\s]+/).map((x) => x.trim()).filter(Boolean),
      gruppen: d.gruppen, netto: d.netto, mwst_satz: d.mwst_satz, mwst: d.mwst, brutto: d.brutto, stunden: s.stunden, km: s.km,
      bearbeitet: true, erstellt: new Date().toISOString(), version: (alt.version || 1) + 1,
    };
  }
  async function kundeMerken(id, name, adresse) {
    const liste = [...S.kunden];
    let k = liste.find((x) => (id && x.id === id) || K.normName(x.name) === K.normName(name));
    if (k) Object.assign(k, { name, adresse });
    else { k = { id: `k${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, name, adresse }; liste.push(k); }
    liste.sort((a, b) => a.name.localeCompare(b.name, "de"));
    await geheimSpeichern("einstellungen/kunden", { liste });
    S.kunden = liste;
    return k.id;
  }
  async function freieRechnungSpeichern(knopf) {
    const e = S.entwurf;
    if (!e) return;
    const d = K.freieRechnungsDaten(e);
    const fehler = [...d.fehler];
    if (!String(e.kunde_name || "").trim()) fehler.unshift("Bitte den Kunden eintragen (Name oder Firma).");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.datum || "")) fehler.push("Bitte ein Rechnungsdatum wählen.");
    if (fehler.length) {
      S.entwurfFehler = fehler; render();
      const box = $("#frei-fehler"); if (box) box.scrollIntoView({ block: "center" });
      return;
    }
    knopf.disabled = true;
    const alt = e.nummer ? S.rechnungen[e.nummer] : null;
    let nummer = null;
    const ok = await schreibe(() => nacheinander(async () => {
      nummer = alt ? alt.nummer : await nummerVergeben();
      const meta = e.ibs && alt ? ibsMeta(e, d, alt) : freiMeta(e, d, nummer, alt);
      if (e.merken && !e.ibs) meta.kunde_id = await kundeMerken(e.kunde_id, meta.kunde_name, meta.empfaenger.split("\n").slice(1).join("\n"));
      await geheimSpeichern(`rechnungen/${nummer}`, meta);
      S.rechnungen[nummer] = meta;
    }), alt ? `Rechnung ${alt.nummer} gespeichert.` : null);
    knopf.disabled = false;
    if (!ok) return;
    if (!alt) { entwurfVergessen(); melde(`Rechnung ${nummer} erstellt.`); }
    S.entwurf = null; S.entwurfFehler = null;
    location.hash = "#rechnungen";
    vorschau(nummer);
  }

  function ansichtFrei(nummer) {
    if (nummer && !S.rechnungen[nummer]) return `<a class="zurueck" href="#rechnungen">← Rechnungen</a><p class="hinweis">Rechnung ${esc(nummer)} gibt es nicht.</p>`;
    entwurfVorbereiten(nummer);
    const e = S.entwurf;
    const d = K.freieRechnungsDaten(e);
    const id = (pfad) => `fe-${pfad.replace(/:/g, "-")}`;
    const feld = (pfad, label, attrs = "", klasse = "") => `<label class="${klasse}">${label}<input data-e="${pfad}" id="${id(pfad)}" value="${esc(e[pfad])}" ${attrs}></label>`;
    const satz = einst();
    const vorlagen = [
      ["Arbeitslohn", { titel: "Arbeitslohn", einheit: "Std.", einzelpreis: zahlText(satz.stundensatz) }],
      ["Fahrzeit", { titel: "Fahrzeitkosten", einheit: "Std.", einzelpreis: zahlText(satz.stundensatz) }],
      ["Kilometer", { titel: "Kilometergeld Hin- und Zurück", menge: "", einheit: "km", einzelpreis: zahlText(satz.km_satz) }],
      ["Material", { titel: "", einheit: "Stk.", einzelpreis: "" }],
      ["Pauschale", { titel: "", einheit: "Pauschale", einzelpreis: "" }],
    ];
    const vorschlaege = [...new Set(["Arbeitslohn", "Fahrzeitkosten", "Kilometergeld Hin- und Zurück", "Parkkosten", "Material", "Wartung",
      ...Object.values(S.rechnungen).filter(istFrei).flatMap((r) => r.gruppen.flatMap((g) => g.positionen.map((x) => x.titel)))])].slice(0, 60);
    const mehrere = e.gruppen.length > 1;
    let lfd = 0;
    const abschnitte = e.gruppen.map((g, gi) => `<div class="abschnitt">
        ${mehrere || g.titel ? `<div class="pos-kopf"><input data-e="g:${gi}" id="${id(`g:${gi}`)}" value="${esc(g.titel)}" placeholder="Abschnitt, z. B. Objekt oder Auftrag (optional)" aria-label="Überschrift Abschnitt ${gi + 1}" style="font-weight:600">
          ${mehrere ? `<button class="pos-weg" data-aktion="abschnitt-weg" data-g="${gi}" aria-label="Abschnitt ${gi + 1} entfernen" title="Abschnitt entfernen">×</button>` : ""}</div>` : ""}
        ${g.positionen.map((x, pi) => { lfd += 1; const pf = `p:${gi}:${pi}`; const sum = posSumme(x); return `<div class="position">

    return `

  // ---------- Ordner je Rechnung (Rechnung + Auftragszettel + Belege) ----------
  const datumZeit = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${heuteTextVon(d)}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const heuteTextVon = (d) => `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
  const ordnerName = (r) => (istFrei(r) ? `${r.nummer} ${r.kunde_name || "Kunde"}` : `${r.nummer} KW${String(r.woche).slice(-2)} ${r.techniker_name || r.techniker}`)
    .replace(/[\\/:*?"<>|]/g, "-");
  function ordnerInhalt(r) {
    if (istFrei(r)) return { liste: [], zettel: [], belege: [], signatur: K.fingerabdruck(K.kanonisch([r.version || 1, r.erstellt || ""])) };
    const liste = einsaetzeVon(r.techniker).filter((e) => e.woche === r.woche);
    const index = zettelIndexVon(r.techniker);
    const schluessel = new Set(liste.map((e) => e.schluessel));
    const zettel = [...new Set(liste.flatMap((e) => e.dateien))].map((key) => index[key]).filter(Boolean)
      .map(([id, z]) => ({ id, name: z.datei || id, asset: z.asset || null }));
    const belege = Object.entries(S.belege).filter(([, b]) => b.techniker === r.techniker && schluessel.has(b.einsatz))
      .sort(([, a], [, b]) => String(a.erstellt).localeCompare(String(b.erstellt)))
      .map(([id, b], i) => {
        const e = liste.find((x) => x.schluessel === b.einsatz);
        const endung = b.typ === "application/pdf" ? "pdf" : b.typ === "image/png" ? "png" : "jpg";
        const tag = e ? e.datum.split(".").reverse().join("-") : "Beleg";
        return { id, b, name: `${tag}${e && e.auftrags_nr ? ` Auftrag ${e.auftrags_nr}` : ""} Beleg ${i + 1}.${endung}` };
      });
    // nur der Fingerabdruck wird in einstellungen/export gespeichert – sonst wächst das Dokument je Rechnung um ~1 KB (Grenze 256 KB)
    const signatur = K.fingerabdruck(K.kanonisch([r.version || 1, r.erstellt || "", zettel.map((z) => [z.id, z.asset]), belege.map((x) => [x.id, x.b.asset || x.b.datei || ""])]));
    return { liste, zettel, belege, signatur };
  }

  function ansichtOrdner() {
    const alle = Object.values(S.rechnungen).sort((a, b) => (a.nummer < b.nummer ? 1 : -1));
    const stand = (S.exportStand && S.exportStand.ordner) || {};
    const infos = alle.map((r) => ({ r, inhalt: ordnerInhalt(r) }));
    const neu = infos.filter(({ r, inhalt }) => stand[r.nummer] !== inhalt.signatur);
    const busy = S.beschaeftigt.has("export");
    const zuletzt = S.exportStand && S.exportStand.zuletzt;
    return `
      <div class="kopf"><h1>Ordner. <span class="grau">Rechnung, Zettel und Belege.</span></h1></div>
      <section class="karte">
        <h2>Export</h2>
        <p>${zuletzt ? `Zuletzt exportiert am ${esc(datumZeit(zuletzt))}.` : "Noch nichts exportiert."}
          ${neu.length ? `<b>${neu.length} Ordner ${neu.length > 1 ? "sind" : "ist"} neu oder geändert.</b>` : alle.length ? "Alle Ordner sind exportiert." : ""}</p>
        <div class="aktionen">
          ${S.downloads ? `<button class="knopf" data-aktion="export-neu" ${!neu.length || busy ? "disabled" : ""}>${busy ? "ZIP wird erstellt …" : `Neue als ZIP (${neu.length})`}</button>
            <button class="knopf zweit" data-aktion="export-alle" ${!alle.length || busy ? "disabled" : ""}>Alle als ZIP</button>`
            : `<span class="leise">Speichern ist in dieser Ansicht nicht möglich.</span>`}
        </div>
        <p class="leise klein">Jede Rechnung hat einen eigenen Ordner mit Rechnungs-PDF, Auftragszetteln und Belegen (Hotel, Parken). Am besten jede Woche nach dem Abrechnen „Neue als ZIP“ tippen und die Datei z. B. in iCloud Drive sichern.</p>
      </section>
      ${infos.length ? infos.map(({ r, inhalt }) => ordnerKarte(r, inhalt, stand[r.nummer] === inhalt.signatur)).join("")
        : `<section class="karte leer"><div class="symbol" aria-hidden="true"></div><h2>Noch keine Ordner</h2><p class="leise">Sobald eine Rechnung erstellt ist, erscheint hier ihr Ordner.</p></section>`}`;
  }

  function ordnerKarte(r, inhalt, exportiert) {
    const anzahl = 1 + inhalt.zettel.length + inhalt.belege.length;
    return `<section class="karte ordner">
      <details data-key="o:${esc(r.nummer)}"><summary><span class="ordner-symbol" aria-hidden="true"></span>
        <span class="ordner-titel"><b>${esc(ordnerName(r))}</b><span class="leise klein">${anzahl} Datei${anzahl > 1 ? "en" : ""} · ${esc(K.euro(r.brutto))}</span></span>
        ${exportiert ? `<span class="chip gut">exportiert</span>` : `<span class="chip">neu</span>`}</summary>
        <ul class="dateiliste">
          <li><button class="knopf-link" data-aktion="vorschau" data-nummer="${esc(r.nummer)}">Rechnung_${esc(r.nummer)}.pdf</button></li>
          ${inhalt.zettel.map((z) => `<li>${z.asset ? `<a href="${esc(blobUrl(z.asset))}" target="_blank" rel="noopener">Auftragszettel/${esc(z.name)}</a>` : `<span class="leise">Auftragszettel/${esc(z.name)} – Original nicht gespeichert</span>`}</li>`).join("")}
          ${inhalt.belege.map((x) => `<li><button class="knopf-link" data-aktion="beleg-ansehen" data-id="${esc(x.id)}">Belege/${esc(x.name)}</button></li>`).join("")}
        </ul>
        ${S.downloads ? `<button class="knopf still" data-aktion="export-ordner" data-nummer="${esc(r.nummer)}">Ordner als ZIP</button>` : ""}
      </details></section>`;
  }

  async function dateiBlob(x) {
    if (x.asset) {
      const antwort = await fetch(blobUrl(x.asset));
      if (!antwort.ok) throw new Error("Datei nicht abrufbar");
      return antwort.blob();
    }
    if (x.datei) {
      const d = await S.db.doc(`dateien/${x.datei}`).get();
      if (!d.exists) throw new Error("Datei nicht gefunden");
      return (await fetch(d.data().daten)).blob();
    }
    return null;
  }

  async function ordnerExportieren(rechnungen, dateiname) {
    if (!S.downloads || !rechnungen.length) return;
    S.beschaeftigt.add("export"); render();
    const fehlend = [];
    try {
      await ladeSkript(CDN.jszip);
      const zip = new window.JSZip();
      const stand = {};
      for (const r of rechnungen) {
        const inhalt = ordnerInhalt(r);
        const ordner = zip.folder(ordnerName(r));
        const namen = new Set();
        const eindeutig = (n) => { let x = n, i = 2; while (namen.has(x)) x = n.replace(/(\.[^.]+)?$/, (m) => ` (${i++})${m}`); namen.add(x); return x; };
        ordner.file(`Rechnung_${r.nummer}.pdf`, await pdfVon(r));
        for (const z of inhalt.zettel) {
          if (!z.asset) { fehlend.push(z.name); continue; }
          try { ordner.file(`Auftragszettel/${eindeutig(z.name)}`, await dateiBlob(z)); } catch { fehlend.push(z.name); }
        }
        for (const x of inhalt.belege) {
          try { ordner.file(`Belege/${eindeutig(x.name)}`, await dateiBlob(x.b)); } catch { fehlend.push(x.name); }
        }
        stand[r.nummer] = inhalt.signatur;
      }
      const daten = await zip.generateAsync({ type: "blob", mimeType: "application/zip" });
      await S.downloads.save({ filename: dateiname, data: daten });
      const alt = (S.exportStand && S.exportStand.ordner) || {};
      S.exportStand = { zuletzt: new Date().toISOString(), ordner: { ...alt, ...stand } };
      await geheimSpeichern("einstellungen/export", S.exportStand);
      melde(`${rechnungen.length} Ordner exportiert.${fehlend.length ? ` Ohne Original: ${fehlend.slice(0, 3).join(", ")}${fehlend.length > 3 ? " …" : ""}` : ""}`);
    } catch (e) {
      console.error(e);
      if (!(e && e.code === "declined")) melde(e && e.code === "too_large" ? "Die ZIP-Datei ist zu groß – bitte einzelne Ordner exportieren." : `Export nicht möglich: ${(e && e.message) || e}`, true);
    } finally {
      S.beschaeftigt.delete("export"); render();
    }
  }

  // ---------- Zugänge (wer ist wer) ----------
  let profileAnfrage = "";
  function profileLaden(ids) {
    const fehlt = ids.filter((id) => !(id in S.profile));
    if (!S.user || !fehlt.length || profileAnfrage === fehlt.join()) return;
    profileAnfrage = fehlt.join();
    S.user.profiles(ids).then((ps) => { S.profile = { ...S.profile, ...ps }; planeRender(); }).catch(() => {});

  function abschnittZugaenge() {

    const ks = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));
    const zeilen = ids.sort((a, b) => name(a).localeCompare(name(b), "de")).map((id) => {
      const z = S.zuordnung[id] || {};

      return `<div class="liste-zeile"><div class="text"><b>${esc(name(id))}</b>${S.profile[id] && S.profile[id].guest ? ` <span class="chip grau">Gast</span>` : ""}
          <div class="leise klein">${wert === "admin" ? "Admin – sieht alles" : wert && S.techniker[wert] ? `Techniker – sieht nur die Einsätze von ${esc(S.techniker[wert].name)}` : "noch nicht freigeschaltet"}</div></div>
        <select data-zugang="${esc(id)}" aria-label="Zugang" style="width:auto;max-width:100%" ${gesperrt ? "disabled" : ""}>
          <option value="">kein Zugang</option>

          ${ks.map((k) => `<option value="${esc(k)}" ${wert === k ? "selected" : ""}>Techniker: ${esc(S.techniker[k].name)}</option>`).join("")}
        </select></div>`;
    }).join("");

      <p class="leise">Jeder meldet sich mit seinem eigenen claude.ai-Konto an. Einladen: in claude.ai oben auf <b>Teilen</b>, die Person per E-Mail einladen und ihr das Recht zum <b>Bearbeiten</b> geben. Sobald sie die App öffnet, erscheint sie hier – dann auswählen, wer sie ist.</p>
      <div class="liste">
        <div class="liste-zeile"><div class="text"><b>${esc(S.ich.name || "Du")}</b><div class="leise klein">${S.ich.owner ? "Inhaber – Admin, sieht alles" : "Admin – sieht alles"}</div></div></div>
        ${zeilen || `<p class="leise">Es hat sich noch niemand angemeldet.</p>`}
      </div>
      ${S.ich.owner ? "" : `<p class="leise klein">Admins kann nur der Inhaber ernennen.</p>`}
    </section>`;

  /** Eigenständige Version: Zugänge mit Benutzername und Passwort, angelegt von Admins */
  function abschnittZugaengeExtern() {
    const P = window.PLATTFORM;
    if (!S.zugangsListe && !S.zugangsListeLaedt) {
      S.zugangsListeLaedt = true;
      P.zugangsListe().then((l) => { S.zugangsListe = l; }).catch((e) => { S.zugangsListe = []; melde(e.message || String(e), true); })
        .finally(() => { S.zugangsListeLaedt = false; planeRender(); });
    }
    const alle = S.zugangsListe || [];

    const ks = Object.keys(S.techniker).sort((a, b) => S.techniker[a].name.localeCompare(S.techniker[b].name, "de"));

      return `<div class="liste-zeile"><div class="text"><b>${esc(u.name || u.benutzer)}</b>

        ${u.inhaber ? "" : `<select data-zugang="${esc(u.id)}" aria-label="Zugang von ${esc(u.name || u.benutzer)}" style="width:auto;max-width:100%" ${gesperrt ? "disabled" : ""}>

            ${ks.map((k) => `<option value="${esc(k)}">Techniker: ${esc(S.techniker[k].name)}</option>`).join("")}

            <option value="">noch kein Zugang</option></select></label>
