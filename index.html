<title>Techniker-Rechnungen</title>
<style>
/* Layout: Apple-Store-Sprache – hellgrauer Grund, weiße Karten mit großen Rundungen und weichem Schatten,
   Systemschrift (SF Pro), zweifarbige Überschriften, blaue Pillen-Knöpfe, Milchglas-Leisten; iPhone: Tab-Leiste unten. */
:root {
  --grund: #f5f5f7; --flaeche: #ffffff; --feld: #f5f5f7; --tinte: #1d1d1f; --leise: #6e6e73; --linie: #e5e5ea; --linie-stark: #d2d2d7;
  --akzent: #0071e3; --link: #0066cc; --akzent-weich: #e8f1fc; --akzent-tinte: #ffffff;
  --primaer: #0071e3; --primaer-hover: #0077ed; --primaer-tinte: #ffffff; --zweit: #e8e8ed; --zweit-hover: #dcdce1; --stahl: #86868b;
  --segment: #e8e8ed; --segment-aktiv: #ffffff;
  --glas: rgb(251 251 253 / .8); --glas-tab: rgb(250 250 252 / .88); --glas-linie: rgb(0 0 0 / .14);
  --warn: #b64400; --warn-grund: #fff2e8; --gut: #1a7f37; --gut-grund: #e9f6ec; --rot: #d70015; --rot-grund: #fdecee;
  --schatten: 0 4px 14px rgb(0 0 0 / .06); --schatten-hoch: 0 10px 30px rgb(0 0 0 / .12);
  --fokus: 0 0 0 4px rgb(0 125 250 / .35);
  --schrift: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --schrift-titel: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius: 18px; --radius-klein: 12px;
  --fahrt: #a9c8f5; --planung: #ff9f0a;
  --m1: #0071e3; --m2: #ff9500; --m3: #34c759; --m4: #af52de; --m5: #ff3b30; --m6: #30b0c7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --grund: #000000; --flaeche: #1c1c1e; --feld: #2c2c2e; --tinte: #f5f5f7; --leise: #a1a1a6; --linie: #38383a; --linie-stark: #48484a;
    --akzent: #2997ff; --link: #2997ff; --akzent-weich: #0b2a4a; --akzent-tinte: #000000;
    --primaer: #0071e3; --primaer-hover: #0077ed; --primaer-tinte: #ffffff; --zweit: #3a3a3c; --zweit-hover: #48484a; --stahl: #8e8e93;
    --segment: #2c2c2e; --segment-aktiv: #636366;
    --glas: rgb(22 22 23 / .8); --glas-tab: rgb(22 22 23 / .88); --glas-linie: rgb(255 255 255 / .12);
    --warn: #ff9f0a; --warn-grund: #3a2205; --gut: #30d158; --gut-grund: #0f2e19; --rot: #ff453a; --rot-grund: #3b0f0d;
    --schatten: none; --schatten-hoch: none;
    --fahrt: #1f4e8c; --planung: #ff9f0a;
    --m1: #0a84ff; --m2: #ff9f0a; --m3: #30d158; --m4: #bf5af2; --m5: #ff453a; --m6: #64d2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --grund: #000000; --flaeche: #1c1c1e; --feld: #2c2c2e; --tinte: #f5f5f7; --leise: #a1a1a6; --linie: #38383a; --linie-stark: #48484a;
  --akzent: #2997ff; --link: #2997ff; --akzent-weich: #0b2a4a; --akzent-tinte: #000000;
  --primaer: #0071e3; --primaer-hover: #0077ed; --primaer-tinte: #ffffff; --zweit: #3a3a3c; --zweit-hover: #48484a; --stahl: #8e8e93;
  --segment: #2c2c2e; --segment-aktiv: #636366;
  --glas: rgb(22 22 23 / .8); --glas-tab: rgb(22 22 23 / .88); --glas-linie: rgb(255 255 255 / .12);
  --warn: #ff9f0a; --warn-grund: #3a2205; --gut: #30d158; --gut-grund: #0f2e19; --rot: #ff453a; --rot-grund: #3b0f0d;
  --schatten: none; --schatten-hoch: none;
  --fahrt: #1f4e8c; --planung: #ff9f0a;
  --m1: #0a84ff; --m2: #ff9f0a; --m3: #30d158; --m4: #bf5af2; --m5: #ff453a; --m6: #64d2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--grund); color: var(--tinte); font: 400 16px/1.47 var(--schrift); letter-spacing: -.011em; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--schrift-titel); }
h1 { font-weight: 600; font-size: 2.5rem; line-height: 1.1; letter-spacing: -.02em; }
h1 .grau, h2 .grau { color: var(--leise); }
@media (max-width: 720px) { h1 { font-size: 2rem; } }
h2 { font-size: 1.3rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.25; }
h3 { font-size: 1.02rem; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--link); text-decoration: none; }

button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
.zahlen, td, .zeit { font-variant-numeric: tabular-nums; }

/* Kopf: Milchglas wie die Apple-Navigation; die Glasfläche liegt auf ::before, damit die Tab-Leiste unten frei positioniert bleibt */
.leiste { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.leiste::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--glas); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--glas-linie); }
.leiste-innen { max-width: 1000px; margin: 0 auto; padding-inline: 22px; display: flex; align-items: center; gap: 16px; min-height: 52px; }
.marke { color: var(--tinte); margin-right: auto; display: flex; align-items: center; gap: 9px; min-width: 0; }
.marke:hover { text-decoration: none; }
.marke svg { flex: none; }
.marke-text { display: flex; align-items: baseline; gap: 6px; font-size: 1.06rem; letter-spacing: -.02em; white-space: nowrap; }
.marke-name { font-weight: 600; }
.marke-zusatz { color: var(--leise); font-weight: 400; }
.reiter { display: flex; gap: 2px; }
.reiter a { color: var(--tinte); opacity: .8; font-size: .82rem; padding: 8px 11px; border-radius: 980px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.reiter a:hover { opacity: 1; text-decoration: none; }
.reiter a[aria-current="page"] { opacity: 1; font-weight: 600; background: var(--zweit); }
.reiter svg { display: none; width: 24px; height: 24px; flex: none; }
.reiter svg[hidden] { display: none !important; }
@media (max-width: 720px) {
  .leiste-innen { min-height: 48px; padding-inline: 16px; }
  .reiter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0;
    background: var(--glas-tab); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--glas-linie); padding: 6px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .reiter a { flex-direction: column; gap: 2px; font-size: .64rem; font-weight: 500; letter-spacing: 0; padding: 4px 2px; opacity: 1; color: var(--stahl); min-width: 0; }
  .reiter a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .reiter a[aria-current="page"] { color: var(--akzent); background: transparent; font-weight: 500; }
  .reiter svg { display: block; }
  main { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)) !important; }
  #meldung { bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }
}

main { max-width: 1000px; margin: 0 auto; padding-inline: 22px; padding-block: 36px 80px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (max-width: 720px) { main { padding-inline: 16px; padding-block: 24px 0; gap: 16px; } }
.karte { background: var(--flaeche); border: 0; border-radius: var(--radius); padding: 22px 24px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--schatten); }
@media (max-width: 720px) { .karte { padding: 20px 18px; } }
.kopf { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.leise { color: var(--leise); font-size: .94rem; }
.klein { font-size: .82rem; }
.zurueck { font-size: .94rem; }

.knopf { appearance: none; border: 0; border-radius: 980px; background: var(--primaer); color: var(--primaer-tinte); font-weight: 400; font-size: 1rem; letter-spacing: -.01em;
  padding: 0 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; transition: background .2s, transform .2s; }
.knopf:hover { background: var(--primaer-hover); text-decoration: none; }
.knopf.zweit { background: var(--zweit); color: var(--tinte); }
.knopf.zweit:hover { background: var(--zweit-hover); }
.knopf.still { background: transparent; color: var(--link); padding-inline: 8px; }
.knopf.still:hover { text-decoration: underline; }
.knopf.gefahr { background: var(--rot-grund); color: var(--rot); }
.knopf:disabled { opacity: .45; cursor: progress; }
.knopf:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, .reiter a:focus-visible, button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--fokus); }
.aktionen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

label { display: grid; gap: 6px; font-size: .82rem; color: var(--leise); font-weight: 400; }
input, select, textarea { width: 100%; min-width: 0; border: 1px solid var(--linie-stark); border-radius: var(--radius-klein); background: var(--flaeche); padding: 12px 14px; font-size: 17px; color: var(--tinte); min-height: 50px; transition: border-color .2s, box-shadow .2s; }
textarea { line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--akzent); outline: none; box-shadow: var(--fokus); }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; padding: 0; accent-color: var(--akzent); }
.check { display: flex; align-items: center; gap: 10px; color: var(--tinte); font-size: 1rem; }
.felder { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; align-items: end; }
.felder .ganz { grid-column: 1 / -1; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 980px; padding: 3px 10px; font-size: .76rem; font-weight: 600; background: var(--feld); color: var(--tinte); white-space: nowrap; letter-spacing: 0; }
.chip.warn { background: var(--warn-grund); color: var(--warn); }
.chip.gut { background: transparent; color: var(--gut); padding-inline: 0; }
.chip.gut::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.grau { background: transparent; color: var(--leise); padding-inline: 0; font-weight: 400; }
.hinweis { border-radius: var(--radius-klein); padding: 12px 16px; font-size: .92rem; background: var(--warn-grund); color: var(--warn); }
.hinweis.info { background: var(--flaeche); color: var(--tinte); box-shadow: var(--schatten); }
a.hinweis.info { color: var(--link); }

/* Übersicht: Techniker wie eine iOS-Liste mit Avataren */
.raster { display: grid; background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); overflow: hidden; }
.raster .techniker-karte { border-radius: 0; box-shadow: none; padding: 16px 44px 16px 18px; gap: 4px 14px; position: relative; grid-template-columns: 46px minmax(0, 1fr); align-items: center; }
.raster .techniker-karte + .techniker-karte::before { content: ""; position: absolute; left: 78px; right: 0; top: 0; border-top: 1px solid var(--linie); }
.techniker-karte { color: inherit; transition: background .2s; }
.techniker-karte:hover { background: var(--feld); text-decoration: none; }
.techniker-karte::after { content: ""; position: absolute; right: 22px; top: 50%; width: 8px; height: 8px; border-top: 2px solid var(--linie-stark); border-right: 2px solid var(--linie-stark); transform: translateY(-50%) rotate(45deg); }
.tk-inhalt { display: grid; gap: 3px; min-width: 0; }
.tk-inhalt h2 { font-size: 1.06rem; }
.tk-inhalt .aktionen { gap: 2px 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 .95rem/1 var(--schrift-titel); letter-spacing: .02em;
  background: linear-gradient(180deg, color-mix(in srgb, var(--farbe, #8e8e93) 70%, #fff), var(--farbe, #8e8e93)); }
.kuerzel { font-size: .72rem; font-weight: 600; letter-spacing: .04em; color: var(--leise); background: var(--feld); border-radius: 6px; padding: 2px 7px; vertical-align: middle; font-family: var(--schrift); }

.upload { display: grid; gap: 12px; justify-items: start; background: var(--flaeche); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--schatten); }
@media (max-width: 720px) { .upload { padding: 20px 18px; } }
.upload input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.fortschritt { height: 3px; border-radius: 2px; background: transparent; overflow: hidden; width: 100%; margin-top: -4px; }
.fortschritt > i { display: block; height: 100%; background: var(--akzent); width: 0; transition: width .2s; }

.woche { display: grid; gap: 0; padding: 0; overflow: hidden; }
.woche-kopf { padding: 22px 24px 18px; display: grid; gap: 12px; border-bottom: 1px solid var(--linie); }
.woche-titel { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.woche-titel h2 { font-size: 1.5rem; letter-spacing: -.02em; }
.woche-fuss { padding: 16px 24px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 600; font-size: .98rem; background: var(--feld); font-variant-numeric: tabular-nums; }
.einsatz { padding: 18px 24px; border-bottom: 1px solid var(--linie); display: grid; gap: 12px; }
@media (max-width: 720px) { .woche-kopf, .einsatz, .woche-fuss { padding-inline: 18px; } }
.einsatz-kopf { display: flex; gap: 2px 12px; align-items: baseline; flex-wrap: wrap; }
.einsatz-kopf strong { font-weight: 600; font-size: 1.06rem; letter-spacing: -.015em; }
.einsatz-kopf > span { color: var(--leise); font-size: .94rem; }
.zeiten { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px 16px; }
.zeiten div { display: grid; gap: 0; }
.zeiten span { font-size: .76rem; color: var(--leise); }
.zeiten b { font-weight: 600; font-size: 1.06rem; letter-spacing: -.01em; }
.fehlt { color: var(--warn); }
.kosten { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kosten:empty { display: none; }
.kosten .chip { font-weight: 500; }
.belege { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.belege > .leise { font-size: .76rem; margin-right: 4px; }
.beleg { appearance: none; padding: 0; border: 0; border-radius: var(--radius-klein); width: 58px; height: 58px; overflow: hidden; background: var(--feld); cursor: pointer; display: grid; place-items: center; color: var(--leise); font: 600 .72rem/1 var(--schrift); flex: none; }
.beleg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.beleg.neu { border: 1.5px dashed var(--linie-stark); color: var(--link); text-align: center; line-height: 1.15; padding: 4px; background: transparent; font-weight: 500; }
.beleg.neu[aria-busy="true"] { opacity: .6; pointer-events: none; }
.beleg-datei { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.beleg-gross { display: grid; gap: 14px; padding: 0 0 18px; }
.beleg-gross > :not(.dlg-kopf) { margin-inline: 20px; }
.beleg-gross img { width: auto; max-width: calc(100% - 40px); max-height: 70vh; object-fit: contain; border-radius: var(--radius-klein); background: var(--feld); }
.chip button { border: 0; background: none; color: var(--leise); font-size: 1rem; line-height: 1; padding: 0 0 0 2px; cursor: pointer; min-height: 0; }
.chip button:hover { color: var(--rot); }
details > summary { cursor: pointer; color: var(--link); font-weight: 400; font-size: .98rem; list-style: none; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; }
details[open] > summary::before { content: "– "; }
details > form, details > div { margin-top: 14px; }

.liste { display: grid; gap: 0; }
.liste-zeile { display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--linie); flex-wrap: wrap; }
.liste-zeile:first-child { border-top: 0; padding-top: 4px; }
.liste-zeile .text { min-width: 0; flex: 1 1 220px; overflow-wrap: anywhere; display: grid; gap: 2px; }

/* Dialoge: Desktop als Fenster, iPhone als Blatt von unten */
dialog { border: 0; border-radius: 22px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); background: var(--flaeche); color: var(--tinte); box-shadow: 0 30px 80px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
.dlg { display: grid; grid-template-rows: auto 1fr auto; max-height: calc(100dvh - 32px); }
.dlg-kopf, .dlg-fuss { padding: 16px 22px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dlg-kopf h2 { font-size: 1.3rem; }
.dlg-kopf { border-bottom: 1px solid var(--linie); }
.dlg-fuss { border-top: 1px solid var(--linie); }
.dlg-inhalt { overflow: auto; padding: 22px; display: grid; gap: 18px; background: var(--grund); }
@media (max-width: 720px) {
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 22px 22px 0 0; max-height: 92dvh; }
  .dlg { max-height: 92dvh; }
  .dlg-fuss { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
.vorschau canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: 6px; box-shadow: 0 2px 10px rgb(0 0 0 / .1); }
.zeilen-edit { display: grid; gap: 12px; }
.zeile-edit { background: var(--feld); border-radius: var(--radius-klein); padding: 14px; display: grid; gap: 12px; }

/* Rechnungen */
.kacheln { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); overflow: hidden; }
.kachel { appearance: none; text-align: left; border: 0; border-left: 1px solid var(--linie); background: transparent; padding: 18px 20px; display: grid; gap: 2px; cursor: pointer; color: var(--tinte); min-width: 0; transition: background .2s; }
.kachel:first-child { border-left: 0; }
.kachel:hover { background: var(--feld); }
.kachel span { font-size: .82rem; font-weight: 600; color: var(--leise); }
.kachel b { font-family: var(--schrift-titel); font-weight: 600; font-size: clamp(1.15rem, 5.4vw, 1.75rem); letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kachel small { color: var(--leise); font-size: .8rem; }
.kachel.warn b { color: var(--warn); }
.kachel.gut b { color: var(--gut); }
.kachel[aria-pressed="true"] { background: var(--akzent-weich); }
@media (max-width: 420px) { .kachel { padding: 14px 12px; } }
.filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.segment { display: inline-flex; background: var(--segment); border-radius: 9px; padding: 2px; gap: 0; max-width: 100%; overflow-x: auto; }
.segment button, .filter > button { appearance: none; border: 0; background: transparent; color: var(--tinte); border-radius: 7px; padding: 6px 13px; font-weight: 500; font-size: .84rem; cursor: pointer; min-height: 32px; white-space: nowrap; letter-spacing: -.005em; }
.segment button[aria-pressed="true"], .filter > button[aria-pressed="true"] { background: var(--segment-aktiv); box-shadow: 0 3px 8px rgb(0 0 0 / .12), 0 3px 1px rgb(0 0 0 / .04); font-weight: 600; }
.filter select { width: auto; max-width: 100%; min-height: 36px; padding: 6px 12px; border-radius: 9px; font-size: .9rem; border-color: var(--linie); background: var(--feld); }
.rechnung { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; padding: 18px 0; border-top: 1px solid var(--linie); }
.rechnung:first-child { border-top: 0; padding-top: 6px; }
.rechnung .text { min-width: 0; overflow-wrap: anywhere; display: grid; gap: 3px; }
.rechnung .text > div:first-child { font-size: 1.04rem; }
.rechnung .betrag { font-weight: 600; font-size: 1.1rem; letter-spacing: -.015em; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.rechnung .aktionen { grid-column: 1 / -1; gap: 6px; }

<script>
/* Rechnungs-App – Kern für die Web-Version (iPhone/Browser).
 *
 * Übertragung der Python-Module auftragszettel.py und rechnung.py:
 * Auftragszettel lesen, Einsätze bilden, Positionen berechnen und die
 * Rechnung als PDF im Layout der Vorlage Rechnung_2026-073 erzeugen.
 * Läuft im Browser (eingebettet in die Seite) und in Node (Tests).
 */
(function (global) {
  "use strict";

  // ---------- Text aus pdf.js-Textelementen (wie pypdf extraction_mode="layout") ----------

  function textAusSeiten(seiten) {
    const ausgabe = [];
    for (const items of seiten) {
      const teile = [];
      for (const it of items) {
        if (!it.str || !it.str.trim()) continue;
        const t = it.transform;
        if (Math.abs(t[1]) > 0.01 || Math.abs(t[2]) > 0.01) continue; // gedrehter Randtext
        const gr = Math.hypot(t[0], t[1]) || Math.abs(t[3]) || 10;
        teile.push({ s: it.str, x: t[4], y: t[5], b: it.width || 0, gr });
      }
      teile.sort((a, b) => b.y - a.y || a.x - b.x);
      const zeilen = [];
      for (const t of teile) {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.y - t.y) <= Math.max(2, t.gr * 0.35)) z.teile.push(t);
        else zeilen.push({ y: t.y, teile: [t] });
      }
      for (const z of zeilen) {
        z.teile.sort((a, b) => a.x - b.x);
        let s = "";
        let ende = null;
        for (const t of z.teile) {
          if (ende !== null) {
            const luecke = t.x - ende;
            // Spaltenabstand -> mehrere Leerzeichen (die Muster erwarten \s{2,} zwischen Spalten)
            s += luecke > t.gr * 0.8 ? "   " : luecke > t.gr * 0.12 ? " " : "";
          }
          s += t.s;
          ende = t.x + t.b;
        }
        ausgabe.push(s);
      }
    }
    return ausgabe.join("\n");
  }

  // ---------- Auftragszettel auslesen (wie auftragszettel.py) ----------

  const ZEIT = String.raw`\d{1,2}[:.]\d{2}`;
  const SPANNE = String.raw`(?:${ZEIT}\s*[-–]\s*${ZEIT}|-)`;
  const ZEILE_RE = new RegExp(
    String.raw`^\s*(?<datum>\d{2}\.\d{2}\.\d{4})\s+(?<techniker>\S.*?)\s{2,}` +
    String.raw`(?<anfahrt>${SPANNE})\s+(?<arbeit>${SPANNE})\s+(?<abfahrt>${SPANNE})` +
    String.raw`(?:\s+(?<km>\d+))?\s*$`);
  const BLOCK_RE = /^\s*(\d{2}\.\d{2}\.\d{4})\s*\((.+?)\)\s*$/;
  const INTERN_SPANNE_RE = new RegExp(
    String.raw`^ibs\s*[-_]?\s*intern\W*?(${ZEIT})\s*(?:[-–]|bis)\s*(${ZEIT})`, "i");
  const INTERN_DAUER_RE = /^ibs\s*[-_]?\s*intern\W*?(\d+(?:[,.]\d+)?)\s*(?:std|stunden|h)\b/i;
  const INTERN_RE = /ibs\s*[-_]?\s*intern/gi;

  /** JSON mit sortierten Schlüsseln – der Speicher liefert Felder in anderer Reihenfolge zurück. */
  function kanonisch(x) {
    if (Array.isArray(x)) return `[${x.map(kanonisch).join(",")}]`;
    if (x && typeof x === "object") return `{${Object.keys(x).sort().map((k) => `${JSON.stringify(k)}:${kanonisch(x[k])}`).join(",")}}`;
    return JSON.stringify(x === undefined ? null : x);
  }

  // „Barış Kaya“ = „Baris Kaya“, „Çakmak“ = „Cakmak“, „Bünyamin“ = „Bunyamin“
  const normName = (name) => String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i")
    .replace(/\s+/g, " ").trim().toLowerCase();
  const istHotel = (bezeichnung) => /hotel|übernacht/i.test(String(bezeichnung || ""));
  const blockKey = (datum, techniker) => `${datum}|${normName(techniker)}`;

  function zeit(z) {
    const [h, m] = z.split(/[:.]/);
    return `${String(parseInt(h, 10)).padStart(2, "0")}:${m}`;
  }

  function spanne(wert) {
    wert = wert.trim();
    if (wert === "-") return null;
    const [von, bis] = wert.split(/\s*[-–]\s*/);
    return `${zeit(von)}-${zeit(bis)}`;
  }

  function feld(text, label, zeilenanfang = true) {
    const re = new RegExp((zeilenanfang ? String.raw`^\s*` : "") + label + String.raw`\s+(.+?)(?:\s{2,}|$)`, "m");
    const m = text.match(re);
    return m ? m[1].trim() : "";
  }

  function internAus(text) {
    const erg = [];
    for (const m of text.matchAll(INTERN_RE)) {
      const rest = text.slice(m.index, m.index + 60);
      const s = rest.match(INTERN_SPANNE_RE);
      const d = rest.match(INTERN_DAUER_RE);
      if (s) erg.push({ von: zeit(s[1]), bis: zeit(s[2]), stunden: null, text: s[0] });
      else if (d) erg.push({ von: null, bis: null, stunden: parseFloat(d[1].replace(",", ".")), text: d[0] });
      else erg.push({ von: null, bis: null, stunden: null, text: rest.split(")")[0] });
    }
    return erg;
  }

  function parseText(text, datei = "") {
    const z = {
      datei, auftrags_nr: null, rueckfahrt: false, kunde: "", typ: "", objekt_strasse: "",
      objekt_ort: "", beschreibung: "", zeilen: [], arbeiten: {}, intern: {}, warnungen: [],
    };
    let m = text.match(/Auftrags-Nr:\s*(\d+)/);
    z.auftrags_nr = m ? m[1] : null;
    if (!z.auftrags_nr) z.warnungen.push("Auftrags-Nr. nicht gefunden");
    z.rueckfahrt = text.includes("Nachweis über die getätigte Abfahrtszeit") || datei.toLowerCase().includes("rueckfahrt");
    z.kunde = feld(text, String.raw`Kd-K\S*rzel`, false);
    z.typ = feld(text, "Typ");
    z.objekt_strasse = feld(text, "Straße");
    z.objekt_ort = feld(text, "PLZ Ort");

    m = text.match(/Beschreibung:\s*([\s\S]*?)\n\s*Datum\s+Techniker/);
    if (m) z.beschreibung = m[1].split(/\s+/).filter(Boolean).join(" ");

    for (const zeile of text.split("\n")) {
      const r = zeile.match(ZEILE_RE);
      if (r) {
        const g = r.groups;
        if (!gueltigesDatum(g.datum)) { z.warnungen.push(`Ungültiges Datum ${g.datum} – Zeile übersprungen, bitte prüfen`); continue; }
        z.zeilen.push({
          datum: g.datum,
          techniker: g.techniker.split(/\s+/).filter(Boolean).join(" "),
          anfahrt: spanne(g.anfahrt), arbeit: spanne(g.arbeit), abfahrt: spanne(g.abfahrt),
          km: g.km ? parseInt(g.km, 10) : null,
        });
      }
    }
    if (!z.zeilen.length) z.warnungen.push("Keine Zeiten (Datum/Techniker/Anfahrt/Arbeitszeit/Abfahrt) gefunden");

    m = text.match(/Arbeiten ausgeführt:\s*\n([\s\S]*?)(?:\n\s*Materialaufwand:|\n\s*Auftrag erledigt|$)/);
    if (m) {
      let aktuell = null;
      const bloecke = {};
      for (const zeile of m[1].split("\n")) {
        const b = zeile.match(BLOCK_RE);
        if (b) {
          aktuell = blockKey(b[1], b[2]);
          bloecke[aktuell] = bloecke[aktuell] || [];
        } else if (zeile.trim()) {
          if (aktuell === null && z.zeilen.length) aktuell = blockKey(z.zeilen[0].datum, z.zeilen[0].techniker);
          const k = aktuell || "";
          (bloecke[k] = bloecke[k] || []).push(zeile.trim());
        }
      }
      for (const [key, zeilen] of Object.entries(bloecke)) {
        const inhalt = zeilen.join(" ");
        z.arbeiten[key] = inhalt;
        const interne = internAus(inhalt);
        if (interne.length) z.intern[key] = interne;
      }
    }
    for (const liste of Object.values(z.intern)) {
      for (const i of liste) {
        if (i.stunden === null && !i.von) z.warnungen.push(`„ibs intern“ ohne lesbare Zeit: ${i.text}`);
      }
    }
    return z;
  }

  // ---------- Zeit, Datum, Geld ----------

  function minuten(sp) {
    if (!sp) return 0;
    const [von, bis] = sp.split("-");
    const a = +von.slice(0, 2) * 60 + +von.slice(3);
    const b = +bis.slice(0, 2) * 60 + +bis.slice(3);
    return b >= a ? b - a : b + 24 * 60 - a; // über Mitternacht
  }

  const stunden = (sp) => Math.round((minuten(sp) / 60) * 100) / 100;

  function parseDatum(d) {
    const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(d).trim());
    if (!m) throw new Error(`Ungültiges Datum: ${d}`);
    const dt = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
    if (dt.getUTCDate() !== +m[1] || dt.getUTCMonth() !== +m[2] - 1) throw new Error(`Ungültiges Datum: ${d}`);
    return dt;
  }

  const gueltigesDatum = (d) => { try { parseDatum(d); return true; } catch { return false; } };
  const zwei = (n) => String(n).padStart(2, "0");
  const datumText = (dt, jahr4 = true) =>
    `${zwei(dt.getUTCDate())}.${zwei(dt.getUTCMonth() + 1)}.${jahr4 ? dt.getUTCFullYear() : zwei(dt.getUTCFullYear() % 100)}`;

  function isoWoche(dt) {
    const d = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()));
    const tag = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - tag);
    const jahr = d.getUTCFullYear();
    const woche = Math.ceil(((d - Date.UTC(jahr, 0, 1)) / 86400000 + 1) / 7);
    return [jahr, woche];
  }

  const wocheVon = (dt) => { const [j, w] = isoWoche(dt); return `${j}-KW${zwei(w)}`; };

  function wocheZeitraum(woche) {
    const [j, w] = woche.split("-KW").map(Number);
    const jan4 = new Date(Date.UTC(j, 0, 4));
    const montag = new Date(jan4);
    montag.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (w - 1) * 7);
    const sonntag = new Date(montag);
    sonntag.setUTCDate(montag.getUTCDate() + 6);
    return [montag, sonntag];
  }

  /** Kaufmännisch auf Cent runden wie Python Decimal(str(x)).quantize(0.01, ROUND_HALF_UP). */
  function runden(x) {
    let s = String(+Number(x).toPrecision(15));
    if (/e/i.test(s)) return Math.round(x * 100) / 100;
    const neg = s.startsWith("-");
    if (neg) s = s.slice(1);
    const [g, f = ""] = s.split(".");
    const ff = (f + "000").slice(0, 3);
    let cent = BigInt(g) * 100n + BigInt(ff.slice(0, 2));
    if (+ff[2] >= 5) cent += 1n;
    const v = Number(cent) / 100;
    return neg ? -v : v;
  }

  /** 1397.45 -> "1.397,45" */
  function zahl(x) {
    const [g, f] = Math.abs(x).toFixed(2).split(".");
    const minus = x < 0 && (g !== "0" || f !== "00"); // kein „-0,00“
    return `${minus ? "-" : ""}${g.replace(/\B(?=(\d{3})+(?!\d))/g, ".")},${f}`;
  }

  const euro = (x) => `${zahl(x)} €`;
  /** Menge/Einzelpreis: 2 Nachkommastellen, 3 wenn eingegeben (0,125 Std., 1,789 €) */
  function zahlGenau(x) {
    if (Math.abs(x * 100 - Math.round(x * 100)) <= 1e-6) return zahl(x);
    const [g, f] = Math.abs(x).toFixed(3).split(".");
    return `${x < 0 ? "-" : ""}${g.replace(/\B(?=(\d{3})+(?!\d))/g, ".")},${f}`;
  }

  // ---------- Einsätze (wie rechnung.einsaetze) ----------

  const SEGMENTE = ["anfahrt", "arbeit", "abfahrt"];

  function stadt(plzOrt) {
    const teile = (plzOrt || "").split(/\s+/);
    return teile.length >= 2 && /^\d+$/.test(teile[0]) ? plzOrt.trim().slice(teile[0].length).trim() : (plzOrt || "");
  }

  function internStunden(i) {
    if (i.von && i.bis) return stunden(`${i.von}-${i.bis}`);
    return Number(i.stunden || 0);
  }

  function beginn(e) {
    const z = SEGMENTE.filter((s) => e[s]).map((s) => e[s].split("-")[0]);
    return z.length ? z.sort()[0] : "99:99";
  }

  /**
   * index: {datei: zettel}, extras: {kosten: [...], einsaetze: [...]}
   * technikerName: Name oder Liste von Schreibweisen (erste = Name des Technikers).
   * Führt Haupt- und Rückfahrtzettel je (Auftrag, Datum, Techniker) zusammen.
   */
  function einsaetze(index, technikerName, extras = {}) {
    const alleNamen = [].concat(technikerName).filter(Boolean);
    const namen = new Set(alleNamen.map(normName));
    technikerName = alleNamen[0] || "";
    // alle Schreibweisen des Technikers sind dieselbe Person (Haupt- und Rückfahrtzettel zusammenführen)
    const person = (n) => (namen.has(normName(n)) ? "\u0000" : normName(n));
    const gruppen = new Map();
    const internGenutzt = new Set(); // „ibs intern“-Block je Zettel und Tag nur einmal verwenden
    const eintraege = Object.entries(index).sort(([da, a], [db, b]) =>
      (a.rueckfahrt ? 1 : 0) - (b.rueckfahrt ? 1 : 0) || (da < db ? -1 : da > db ? 1 : 0));
    for (const [datei, z] of eintraege) {
      const zeilen = (z.zeilen || []).filter((r) => gueltigesDatum(r.datum));
      const eigene = zeilen.filter((r) => namen.has(normName(r.techniker)));
      const fremd = !eigene.length && zeilen.length;
      for (const r of eigene.length ? eigene : zeilen) {
        const basis = `${z.auftrags_nr || datei}|${r.datum}`;
        let n = 1;
        let e = gruppen.get(`${basis}|${person(r.techniker)}|1`);
        // zweite Zeile am selben Tag auf demselben Zettel (z. B. vormittags und nachmittags): eigener Einsatz
        while (e && !z.rueckfahrt && e.dateien.includes(datei) && SEGMENTE.some((s) => r[s] && e[s])) {
          n += 1;
          e = gruppen.get(`${basis}|${person(r.techniker)}|${n}`);
        }
        if (!e) {
          e = {
            auftrags_nr: z.auftrags_nr || "?",
            schluessel: n > 1 ? `${basis}|${n}` : basis,
            manuell: false, bezeichnung: "", kosten: [],
            datum: r.datum, techniker: r.techniker, kunde: z.kunde || "", typ: z.typ || "",
            stadt: stadt(z.objekt_ort), ort: [z.objekt_strasse, z.objekt_ort].filter(Boolean).join(", "),
            arbeiten: "", anfahrt: null, arbeit: null, abfahrt: null, km: null,
            intern: [], dateien: [], warnungen: [],
          };
          gruppen.set(`${basis}|${person(r.techniker)}|${n}`, e);
        }
        e.dateien.push(datei);
        for (const seg of SEGMENTE) {
          if (r[seg] && (e[seg] === null || (z.rueckfahrt && seg === "abfahrt"))) e[seg] = r[seg];
        }
        if (r.km !== null && r.km !== undefined) e.km = Math.max(e.km || 0, r.km);
        const bk = blockKey(r.datum, r.techniker);
        if (!e.arbeiten) e.arbeiten = (z.arbeiten || {})[bk] || "";
        // „ibs intern“ je Zettel einmal; was Haupt- und Rückfahrtzettel beide enthalten, nur einmal –
        // zwei gleiche Einträge auf einem Zettel („1 Std Material … 1 Std Bericht“) zählen doppelt
        if (!internGenutzt.has(`${datei}|${bk}`)) {
          internGenutzt.add(`${datei}|${bk}`);
          const vorher = e.intern.map(kanonisch);
          for (const i of (z.intern || {})[bk] || []) if (!vorher.includes(kanonisch(i))) e.intern.push(i);
        }
        if (fremd) e.warnungen.push(`${datei}: Techniker „${r.techniker}“ weicht vom Ordner ab`);
        for (const w of z.warnungen || []) e.warnungen.push(`${datei}: ${w}`);
      }
    }
    const erg = [...gruppen.values()];
    for (const m of extras.einsaetze || []) {
      erg.push({
        auftrags_nr: m.auftrags_nr || "", schluessel: `m:${m.id}`, id: m.id,
        manuell: true, bezeichnung: m.bezeichnung || "", kosten: [],
        datum: m.datum, techniker: technikerName, kunde: m.bezeichnung || "",
        typ: "", stadt: "", ort: "", arbeiten: "",
        anfahrt: m.anfahrt || null, arbeit: m.arbeit || null, abfahrt: m.abfahrt || null,
        km: m.km ?? null, intern: [], dateien: [], warnungen: [],
      });
    }
    const nachSchluessel = new Map(erg.map((e) => [e.schluessel, e]));
    for (const k of extras.kosten || []) {
      const e = nachSchluessel.get(k.einsatz);
      if (e) e.kosten.push(k);
    }
    for (const e of erg) {
      e.stunden = Math.round(SEGMENTE.reduce((s, x) => s + stunden(e[x]), 0) * 100) / 100;
      e.planung_stunden = Math.round(e.intern.reduce((s, i) => s + internStunden(i), 0) * 100) / 100;
      e.woche = wocheVon(parseDatum(e.datum));
    }
    erg.sort((a, b) => parseDatum(a.datum) - parseDatum(b.datum) ||
      (beginn(a) < beginn(b) ? -1 : beginn(a) > beginn(b) ? 1 : 0) ||
      (a.auftrags_nr < b.auftrags_nr ? -1 : a.auftrags_nr > b.auftrags_nr ? 1 : 0));
    erg.forEach((e, n) => {
      if (e.manuell) return;
      if (!e.abfahrt) {
        // Folgt am selben Tag noch ein Einsatz, fährt der Techniker direkt weiter:
        // die Fahrt ist die Anfahrt des nächsten Auftrags, eine Abfahrt gibt es nicht
        const naechster = erg[n + 1] && erg[n + 1].datum === e.datum ? erg[n + 1] : null;
        if (naechster) e.weiter = { auftrags_nr: naechster.auftrags_nr, kunde: naechster.kunde };
        else e.warnungen.push("Keine Abfahrt eingetragen – Rückfahrtzettel fehlt evtl.");
      }
      if (!e.arbeit) e.warnungen.push("Keine Arbeitszeit eingetragen");
      for (const i of e.intern) {
        if (!i.von && (i.stunden === null || i.stunden === undefined)) {
          e.warnungen.push(`„${i.text}“: Zeit nicht lesbar – bitte korrigieren`);
        }
      }
    });
    return erg;
  }

  /**
   * Arbeitstage für den Kalender: je Datum Beginn, Ende, Stunden und die einzelnen Zeitspannen
   * (Anfahrt, Arbeitszeit, Abfahrt, ibs intern mit Uhrzeit) aus allen Einsätzen dieses Tages.
   */
  function arbeitstage(liste) {
    const zuMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3);
    const zuText = (m) => `${zwei(Math.floor((m % 1440) / 60))}:${zwei(m % 60)}`;
    const minutenVonBis = (sp) => { const [a, b] = sp.split("-").map(zuMin); return [a, b < a ? b + 1440 : b]; };
    const tage = {};
    for (const e of liste) {
      const t = (tage[e.datum] = tage[e.datum] || { datum: e.datum, spannen: [], stunden: 0, einsaetze: [], abfahrtFehlt: false });
      // Anfahrt → Arbeit → Abfahrt fortlaufend: beginnt ein Abschnitt mehr als 12 Std. vor dem Ende des
      // vorigen, liegt er nach Mitternacht (Nachtschicht: Abfahrt 03:30 nach Arbeit bis 03:30)
      let ende = null;
      for (const art of SEGMENTE) {
        if (!e[art]) continue;
        let [von, bis] = minutenVonBis(e[art]);
        if (ende !== null && von < ende - 720) { von += 1440; bis += 1440; }
        ende = bis;
        t.spannen.push({ art, spanne: e[art], auftrag: e.auftrags_nr, von, bis });
      }
      for (const i of e.intern) {
        if (!i.von || !i.bis) continue;
        const [von, bis] = minutenVonBis(`${i.von}-${i.bis}`);
        t.spannen.push({ art: "planung", spanne: `${i.von}-${i.bis}`, auftrag: e.auftrags_nr, von, bis });
      }
      t.stunden += e.stunden + e.planung_stunden;
      t.einsaetze.push(e);
      if (!e.abfahrt && !e.manuell && !e.weiter) t.abfahrtFehlt = true;
    }
    for (const t of Object.values(tage)) {
      t.spannen.sort((x, y) => x.von - y.von);
      t.beginnMin = t.spannen.length ? Math.min(...t.spannen.map((x) => x.von)) : null;
      t.endeMin = t.spannen.length ? Math.max(...t.spannen.map((x) => x.bis)) : null;
      t.beginn = t.beginnMin === null ? "" : zuText(t.beginnMin);
      t.ende = t.endeMin === null ? "" : zuText(t.endeMin);
      t.stunden = Math.round(t.stunden * 100) / 100;
    }
    return tage;
  }

  function wochen(liste) {
    const erg = {};
    for (const e of liste) (erg[e.woche] = erg[e.woche] || []).push(e);
    return Object.fromEntries(Object.entries(erg).sort(([a], [b]) => (a < b ? 1 : a > b ? -1 : 0)));
  }

  /** Kurzer Fingerabdruck eines Textes (2 × FNV-1a, 16 Hex-Zeichen) */
  function fingerabdruck(s) {
    s = String(s);
    let a = 0x811c9dc5, b = 0x01000193 ^ 0x5bd1e995;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      a ^= c; a = Math.imul(a, 0x01000193) >>> 0;
      b ^= c; b = Math.imul(b, 0x5bd1e995) >>> 0; b ^= b >>> 15;
    }
    return a.toString(16).padStart(8, "0") + (b >>> 0).toString(16).padStart(8, "0");
  }

  /** Fingerabdruck der abrechnungsrelevanten Daten – erkennt „Zettel geändert“. */
  function signatur(liste, einst) {
    const relevant = liste.map((e) => [e.auftrags_nr, e.datum, e.anfahrt, e.arbeit, e.abfahrt, e.km,
      e.intern, e.bezeichnung, (e.kosten || []).map((k) => [k.id, k.bezeichnung, k.betrag, k.menge, k.naechte || null])]);
    const s = kanonisch([relevant, einst.stundensatz, einst.km_satz, einst.mwst]);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, "0");
  }

  // ---------- Positionen (wie rechnung.gruppen) ----------

  const uhrzeitKurz = (sp) => sp.split("-").map((t) => `${parseInt(t.slice(0, 2), 10)}:${t.slice(3)}`).join("-");

  function gruppen(liste, einst, kurzname) {
    const satz = Number(einst.stundensatz);
    const kmSatz = Number(einst.km_satz || 0);
    const nachtSatz = Number(einst.planung_nacht || 0);
    const wer = kurzname ? ` (${kurzname})` : "";
    const erg = [];
    let planung = 0;
    const pos = (titel, menge, einheit, preis) => ({ titel, menge, einheit, einzelpreis: preis, gesamt: runden(menge * preis) });

    for (const e of liste) {
      const datumKurz = datumText(parseDatum(e.datum), false);
      let titel;
      if (e.manuell && !e.auftrags_nr) {
        const z = e.arbeit ? `${uhrzeitKurz(e.arbeit)} Uhr` : "";
        titel = [e.bezeichnung || "Einsatz", datumKurz, z].filter(Boolean).join(", ");
      } else {
        const ort = e.manuell ? e.bezeichnung : [e.typ || e.kunde, e.stadt].filter(Boolean).join("/");
        titel = [`Auftrag ${e.auftrags_nr}`, ort, datumKurz].filter(Boolean).join(", ");
      }
      const p = [];
      if (e.anfahrt) p.push(pos(`Fahrzeitkosten Hinfahrt${wer}`, stunden(e.anfahrt), "Std.", satz));
      if (e.arbeit) p.push(pos(`Arbeitslohn${wer}`, stunden(e.arbeit), "Std.", satz));
      if (e.abfahrt) p.push(pos(`Fahrzeitkosten Rückfahrt${wer}`, stunden(e.abfahrt), "Std.", satz));
      if (e.km && kmSatz) p.push(pos("Kilometergeld Hin- und Zurück", Number(e.km), "km", kmSatz));
      for (const k of e.kosten || []) {
        const menge = Number(k.menge || 1);
        p.push(pos(k.bezeichnung, menge, "Pauschale", Number(k.betrag)));
        // pro Hotelnacht zusätzlich Planungszeit (Nächte = eigenes Feld oder Menge)
        if (nachtSatz && istHotel(k.bezeichnung)) p.push(pos("Planungszeit Hotelübernachtung", Number(k.naechte || menge), "Pauschale", nachtSatz));
      }
      if (p.length) erg.push({ titel, positionen: p, summe: runden(p.reduce((s, x) => s + x.gesamt, 0)) });
      planung += e.intern.reduce((s, i) => s + internStunden(i), 0);
    }
    if (planung) {
      const p = [pos("Planungszeit", Math.round(planung * 100) / 100, "Std.", satz)];
      erg.push({ titel: "IBS", positionen: p, summe: p[0].gesamt });
    }
    erg.forEach((g, n) => g.positionen.forEach((x, m) => { x.nr = `${n + 1}.${m + 1}`; }));
    return erg;
  }

  function summen(pos, einst) {
    const netto = runden(pos.reduce((s, p) => s + p.gesamt, 0));
    const satz = Number(einst.mwst);
    const mwst = runden((netto * satz) / 100);
    return {
      netto, mwst_satz: satz, mwst, brutto: runden(netto + mwst),
      stunden: Math.round(pos.filter((p) => p.einheit === "Std.").reduce((s, p) => s + p.menge, 0) * 100) / 100,
      km: Math.round(pos.filter((p) => p.einheit === "km").reduce((s, p) => s + p.menge, 0) * 100) / 100,
    };
  }

  function leistungszeitraum(liste) {
    if (!liste.length) return "";
    const d = liste.map((e) => parseDatum(e.datum)).sort((a, b) => a - b);
    const von = d[0];
    const bis = d[d.length - 1];
    if (+von === +bis) return datumText(von);
    const vonText = von.getUTCFullYear() === bis.getUTCFullYear()
      ? `${zwei(von.getUTCDate())}.${zwei(von.getUTCMonth() + 1)}.` : datumText(von);
    return `${vonText}-${datumText(bis)}`;
  }

  /** Abgeschlossene Wochen (Sonntag vor heute) ohne Rechnung, älteste zuerst. */
  function offeneWochen(liste, vorhandeneWochen, heute) {
    const h = Date.UTC(heute.getFullYear(), heute.getMonth(), heute.getDate());
    return Object.keys(wochen(liste)).filter((w) => wocheZeitraum(w)[1] < h && !vorhandeneWochen.has(w)).sort();
  }

  // ---------- PDF (Layout der Vorlage Rechnung_2026-073, Maße in mm von oben/links) ----------

  function rechnungPdf(JsPDF, meta, einst, logo) {

      const t = oben + 1.2;

    const betreff = meta.art === "frei" ? String(meta.betreff || "") : `Aufträge: ${[...new Set(meta.auftraege || [])].join(", ")}`;
    if (betreff) {

    tabellenkopf(oben);
    let y = oben + 10.4; // Oberkante der ersten Gruppenüberschrift

      const ohneZw = !g.titel && meta.gruppen.length === 1;

      });

      const kopfHoehe = kopf.length ? (kopf.length - 1) * 4.94 + 4.55 : -2.5;

      if (hoeheBis(y) > FRAME_UNTEN) y = folgeseite(laufend);

      text(X_RECHTS, zeile + 1.11, `€ ${zahl(g.summe)}`, 10, true, "right");

    // --- Summen unten auf der letzten Seite ---
    const letzteUnterkante = y - 9.2 + 3.6;
    if (letzteUnterkante > SUMMEN_OBEN) folgeseite(laufend);
    linie(T_LINKS, SUMMEN_OBEN, T_RECHTS, SUMMEN_OBEN);
    const mwstLabel = `${zahl(meta.mwst_satz).replace(",00", "")}% MwSt`;
    text(129.3, 242.4, "Netto", 10); text(X_RECHTS, 242.4, zahl(meta.netto), 10, false, "right");
    text(129.3, 247.3, mwstLabel, 10); text(X_RECHTS, 247.3, zahl(meta.mwst), 10, false, "right");
    text(129.3, 252.2, "Gesamtbetrag €", 10, true); text(X_RECHTS, 252.2, zahl(meta.brutto), 10, true, "right");
    linie(128.3, 256.05, T_RECHTS, 256.05);
    linie(128.3, 256.4, T_RECHTS, 256.4);
    text(T_LINKS, 262.5, meta.zahlungstext ?? einst.zahlungstext ?? "", 9, true);
    const verwendung = umbrechen('Bei Überweisung mittels Internet-Banking tragen Sie bitte im Feld "Verwendungszweck" die Rechnungsnummer ein.',
      T_RECHTS - T_LINKS - 6.4, 9, true);
    verwendung.forEach((z, i) => text(T_LINKS, 269.9 + i * 3.53, z, 9, true));

    const seiten = doc.getNumberOfPages();
    const teile = [];
    for (const [label, wert] of [["Institut", einst.bank_institut], ["Inhaber", einst.firma_inhaber], ["IBAN", einst.bank_iban]]) {
      if (!wert) continue;
      if (teile.length) teile.push(["normal", "  •  "]);

    for (let s = 1; s <= seiten; s++) {
      doc.setPage(s);
      doc.setFontSize(10);
      const breite = teile.reduce((b, [f, t]) => { doc.setFont("helvetica", f); return b + doc.getTextWidth(t); }, 0);
      let x = MITTE - breite / 2;
      for (const [f, t] of teile) {
        doc.setFont("helvetica", f);
        doc.text(t, x, 278.3 + ASC * 10 * PT);
        x += doc.getTextWidth(t);
      }
      text(MITTE, 282.6, `Seite ${s} von ${seiten}`, 10, false, "center");
    }
    return doc.output("arraybuffer");
  }

  // ---------- Rechnung zusammenstellen ----------

  /** Erstellt die Rechnungsdaten einer Woche (ohne Nummer/Datum). */
  function rechnungsDaten(liste, einst, kurzname) {
    const grp = gruppen(liste, einst, kurzname);
    const pos = grp.flatMap((g) => g.positionen);
    return {
      leistungszeitraum: leistungszeitraum(liste),
      gruppen: grp,
      ...summen(pos, einst),
      signatur: signatur(liste, einst),
      warnungen: liste.flatMap((e) => e.warnungen),
      auftraege: liste.filter((e) => e.auftrags_nr).map((e) => e.auftrags_nr),
    };
  }

  /** „1.000“, „12.500“ (ohne Komma) sind deutsche Tausenderpunkte, „46.00“ und „1.5“ Dezimalpunkte. */
  const tausender = (t) => /^-?[1-9]\d{0,2}(\.\d{3})+$/.test(t);

  /** Zahl aus einer Eingabe wie „1,5“, „-10“, „1.000“ oder „1.234,56 €“; leer -> null; ungültig -> Fehler. */
  function zahlEingabe(wert) {
    let t = String(wert ?? "").replace("€", "").replace(/\s/g, "");
    if (!t) return null;
    if (t.includes(",") || tausender(t)) t = t.replace(/\./g, "").replace(",", ".");
    const z = Number(t);
    if (!Number.isFinite(z)) throw new Error(String(wert));
    return Math.round(z * 1000) / 1000;
  }

  /**
   * Freie Rechnung (an einen beliebigen Kunden): Entwurf mit Texteingaben -> Positionen und Summen.
   * entwurf: {mwst_satz, gruppen: [{titel, positionen: [{titel, menge, einheit, einzelpreis}]}]}
   * Liefert {gruppen, netto, mwst_satz, mwst, brutto, fehler: [...]}.
   */
  function freieRechnungsDaten(entwurf) {
    const fehler = [];
    const grp = [];
    for (const g of entwurf.gruppen || []) {
      const pos = [];
      for (const p of g.positionen || []) {
        const titel = String(p.titel || "").trim();
        if (!titel && !String(p.einzelpreis ?? "").trim()) continue; // leere Zeile
        if (!titel) { fehler.push("Jede Position braucht eine Beschreibung."); continue; }
        let menge, preis;
        try { menge = zahlEingabe(p.menge) ?? 1; preis = zahlEingabe(p.einzelpreis); } catch { menge = NaN; }
        if (!Number.isFinite(menge) || menge === 0 || preis === null || !Number.isFinite(preis)) {
          fehler.push(`„${titel}“: Menge und Einzelpreis bitte als Zahl eingeben, z. B. 1,5 und 46,00.`);
          continue;
        }
        pos.push({ titel, menge, einheit: String(p.einheit || "").trim(), einzelpreis: preis, gesamt: runden(menge * preis) });
      }
      if (pos.length) grp.push({ titel: String(g.titel || "").trim(), positionen: pos, summe: runden(pos.reduce((s, x) => s + x.gesamt, 0)) });
    }
    if (!grp.length && !fehler.length) fehler.push("Bitte mindestens eine Position eintragen.");
    // IBS-Rechnungen sind immer gegliedert (1.1, 1.2 …), freie nur bei mehreren Abschnitten
    const mehrere = grp.length > 1 || Boolean(entwurf.gegliedert);
    grp.forEach((g, n) => g.positionen.forEach((x, m) => { x.nr = mehrere ? `${n + 1}.${m + 1}` : String(m + 1); }));
    let satz = 19;
    try { satz = zahlEingabe(entwurf.mwst_satz) ?? 19; } catch { satz = NaN; }
    if (!(satz >= 0 && satz <= 100)) { fehler.push("Umsatzsteuer bitte als Zahl zwischen 0 und 100, z. B. 19."); satz = 19; }
    const s = summen(grp.flatMap((g) => g.positionen), { mwst: satz });
    return { gruppen: grp, netto: s.netto, mwst_satz: satz, mwst: s.mwst, brutto: s.brutto, fehler };
  }

  // ---------- Belege (Hotel, Parken, Material) auswerten ----------

  const tageZwischen = (a, b) => Math.round((parseDatum(b) - parseDatum(a)) / 86400000);

  /** Zahl aus der Antwort: 136.3, "136,30", "1.234,56 €" -> Zahl; sonst NaN */
  function zahlAus(x) {
    if (typeof x === "number") return x;
    try { const z = zahlEingabe(x); return z === null ? NaN : z; } catch { return NaN; }
  }
  /** Datum aus der Antwort: "05.10.2026", "5.10.26", "2026-10-05" -> "05.10.2026"; sonst null */
  function datumAus(x) {
    const t = String(x ?? "").trim();
    let m = /^(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})$/.exec(t);
    const teile = m ? [m[1], m[2], m[3].length === 2 ? `20${m[3]}` : m[3]]
      : (m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t)) ? [m[3], m[2], m[1]] : null;
    if (!teile) return null;
    const s = `${zwei(+teile[0])}.${zwei(+teile[1])}.${teile[2]}`;
    try { parseDatum(s); return s; } catch { return null; }
  }
  /** Antwort von Claude in feste Form bringen (fehlende Felder, Zahlen als Text, andere Datumsformate). */
  function belegNormieren(roh, hinweise) {
    const a = roh && typeof roh === "object" ? roh : {};
    const satz = (x) => (x === null || x === undefined || x === "" ? null : zahlAus(x));
    const datum = (feld) => {
      const d = datumAus(a[feld]);
      if (!d && a[feld]) hinweise.push(`Datum „${a[feld]}“ nicht lesbar – bitte prüfen.`);
      return d;
    };
    const liste = (x) => (Array.isArray(x) ? x.filter((y) => y && typeof y === "object") : []);
    return {
      ...a,
      datum: datum("datum"), anreise: datum("anreise"), abreise: datum("abreise"), naechte: zahlAus(a.naechte),
      posten: liste(a.posten).map((x) => ({ ...x, brutto: zahlAus(x.brutto), menge: zahlAus(x.menge), mwst_satz: satz(x.mwst_satz) })),
      mwst_tabelle: liste(a.mwst_tabelle).map((x) => ({ ...x, satz: satz(x.satz), netto: zahlAus(x.netto) })),
      summe_brutto: zahlAus(a.summe_brutto),
    };
  }
  /**
   * Beleg ohne Claude: aus dem erkannten Text (Texterkennung auf dem Gerät oder PDF-Text) nach festen Regeln
   * dieselbe Form bauen, die belegAuswerten erwartet. Grob, aber kostenlos – das Ergebnis ist ein Vorschlag zum Prüfen.
   */
  function belegAusText(text) {
    // „195, 20“ (Lücke nach dem Komma) liest die Texterkennung oft – zusammenziehen
    const zeilen = String(text || "").split(/\r?\n/).map((z) => z.replace(/\s+/g, " ").replace(/(\d), (\d{2})(?!\d)/g, "$1,$2").trim()).filter(Boolean);
    const alles = zeilen.join("\n");
    const art = /hotel|übernacht|uebernacht|logis|anreise|abreise|zimmer|pension|gasthof/i.test(alles) ? "hotel"
      : /park(haus|schein|platz|ticket|gebühr|gebuehr|en\b|dauer|zeit)|apcoa|contipark|q-park|tiefgarage/i.test(alles) ? "parken"
      : /baumarkt|bauhaus|hornbach|\bobi\b|toom|hagebau|globus|elektro|conrad|würth|wuerth|werkzeug|material/i.test(alles) ? "material" : "sonstiges";
    // Beträge: 1.234,56 / 63,70 / 4.50 (Punkt nur mit genau zwei Stellen und nicht als Datum)
    const betraege = (z) => [...z.matchAll(/(?<![\d.,])(\d{1,3}(?:\.\d{3})+|\d+)[,.](\d{2})(?![\d.,]*\d)/g)]
      .filter((m) => !/^\d{1,2}\.\d{2}\.\d{2,4}/.test(z.slice(m.index)))
      .map((m) => Number(`${m[1].replace(/\./g, "")}.${m[2]}`)).filter((x) => x > 0 && x < 100000);
    const daten = [...alles.matchAll(/(?<!\d)(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/g)].map((m) => datumAus(m[0])).filter(Boolean);
    const nachWort = (wort) => {
      const z = zeilen.find((x) => wort.test(x));
      const m = z && /(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})/.exec(z.slice(z.search(wort)));
      return m ? datumAus(m[0]) : null;
    };
    let anreise = null, abreise = null;
    if (art === "hotel") {
      anreise = nachWort(/anreise|ankunft|arrival|check-?in|\bvon\b/i);
      abreise = nachWort(/abreise|abfahrt|departure|check-?out|\bbis\b/i);
      const zeitraum = /(\d{1,2}\.\d{1,2}\.(?:\d{4}|\d{2}))\s*(?:-|–|bis)\s*(\d{1,2}\.\d{1,2}\.(?:\d{4}|\d{2}))/.exec(alles);
      if ((!anreise || !abreise) && zeitraum) { anreise = datumAus(zeitraum[1]); abreise = datumAus(zeitraum[2]); }
      if (anreise && abreise && tageZwischen(anreise, abreise) <= 0) abreise = null;
    }
    const nachtTreffer = /(\d{1,2})\s*(?:x\s*)?(?:nächte|naechte|nacht|übernachtung(?:en)?|uebernachtung(?:en)?)/i.exec(alles);
    const naechte = art !== "hotel" ? null : nachtTreffer ? Number(nachtTreffer[1]) : anreise && abreise ? tageZwischen(anreise, abreise) : null;
    // Summe: größter Betrag in einer Summenzeile, sonst der größte Betrag überhaupt
    const SUMME = /gesamt|summe|total|endbetrag|rechnungsbetrag|zu zahlen|zahlbetrag|betrag|brutto/i, NICHT = /netto|mwst|mehrwert|ust|steuer|zwischensumme|rückgeld|rueckgeld|gegeben/i;
    const summen = zeilen.filter((z) => SUMME.test(z) && !NICHT.test(z)).flatMap(betraege);
    const alle = zeilen.flatMap(betraege);
    // ohne Summenzeile: der größte Betrag, der zweimal vorkommt (Summe und Zahlung), sonst der größte
    const doppelt = alle.filter((x, i) => alle.indexOf(x) !== i);
    const summe = summen.length ? Math.max(...summen) : doppelt.length ? Math.max(...doppelt) : alle.length ? Math.max(...alle) : null;
    // Steueraufstellung: Zeile mit Satz und Netto + MwSt = Brutto
    const tabelle = [];
    for (const z of zeilen) {
      const s = /(?<!\d)(19|7)(?:[,.]0{1,2})?\s?%/.exec(z);
      const b = betraege(z);
      if (!s || b.length < 2) continue;
      const satz = Number(s[1]);
      for (const netto of b) {
        const brutto = b.find((x) => x !== netto && Math.abs(runden(netto * (1 + satz / 100)) - x) <= 0.02);
        if (brutto && !tabelle.some((t) => t.satz === satz)) { tabelle.push({ satz, netto, mwst: runden(brutto - netto), brutto }); break; }
      }
    }
    const saetze = [...new Set([...alles.matchAll(/(?<!\d)(19|7)(?:[,.]0{1,2})?\s?%/g)].map((m) => Number(m[1])))];
    const gastTreffer = art !== "hotel" ? null
      : /(?:[Gg]ast(?:name)?|[Gg]uest|\b[Nn]ame)[ \t]*:?[ \t]*((?:[Hh]errn?|[Ff]rau)[ \t]+)?([A-ZÄÖÜ][\p{L}'-]+(?:,?[ \t]+[A-ZÄÖÜ][\p{L}'-]+){0,2})/u.exec(alles)
        || /([Hh]errn?|[Ff]rau)[ \t]+([A-ZÄÖÜ][\p{L}'-]+[ \t]+[A-ZÄÖÜ][\p{L}'-]+)/u.exec(alles);
    const gast = gastTreffer ? gastTreffer[2].trim() : null;
    const bezeichnung = { hotel: "Übernachtung", parken: "Parken", material: "Material", sonstiges: "Beleg" }[art];
    const tabSumme = runden(tabelle.reduce((s, t) => s + t.brutto, 0));
    const passt = tabelle.length && summe !== null && Math.abs(tabSumme - summe) <= 0.02;
    const posten = summe === null ? []
      : passt ? tabelle.map((t) => ({ text: art === "hotel" ? (t.satz === 7 ? "Übernachtung" : "Frühstück und Nebenleistungen") : bezeichnung, gast, menge: art === "hotel" && t.satz === 7 ? naechte || 1 : 1, brutto: t.brutto, mwst_satz: t.satz }))
        : [{ text: bezeichnung, gast, menge: art === "hotel" ? naechte || 1 : 1, brutto: summe, mwst_satz: saetze.length === 1 ? saetze[0] : art === "hotel" && !saetze.length ? 7 : null }];
    return {
      art, haendler: zeilen[0] || "", belegnummer: null, datum: daten[0] || null, anreise, abreise, naechte,
      fruehstueck: art === "hotel" ? /frühstück|fruehstueck|breakfast/i.test(alles) : null, gast, auftragsnummer_handschriftlich: null,
      posten, summe_brutto: summe, mwst_tabelle: passt ? tabelle : [], lesbar: summe !== null && daten.length > 0,
      hinweis: "Auf dem Gerät gelesen (ohne Claude) – bitte Betrag, Datum und Zuordnung prüfen.",
    };
  }

  /** „112 Herr Max Muster“, „Zi. 112 Max Muster“, „Muster, Max“ -> „Max Muster“ */
  function gastName(g) {
    let s = String(g || "").trim();
    for (let alt = null; alt !== s;) {
      alt = s;
      s = s.replace(/^(zi(mmer)?\.?\s*\d+\w?|nr\.?\s*\d+\w?|\d+\w?|herrn?|frau|hr\.?|fr\.?)(\s+|[,:;]\s*|$)/i, "").trim();
    }
    const m = /^([^,]+),\s*([^,]+)$/.exec(s);
    return m ? `${m[2].trim()} ${m[1].trim()}` : s;
  }

  /**
   * Was Claude aus einem Beleg gelesen hat -> Vorschläge für Kosten.
   * a: {art, haendler, datum, anreise, abreise, naechte, fruehstueck, auftragsnummer_handschriftlich,
   *     posten: [{text, gast, menge, brutto, mwst_satz}], summe_brutto, mwst_tabelle: [{satz, netto, mwst, brutto}]}
   * kontext: {hochlader: k, techniker: [{k, name, namen: [...]}], einsaetze: {k: [{schluessel, datum, auftrags_nr}]}}
   * Regeln: Hotel und Parken netto; Material nur mit handschriftlicher Auftragsnummer.
   * Liefert {eintraege: [{k, einsatz, bezeichnung, betrag, menge, naechte, netto, brutto, hinweise}], hinweise: [...]}
   */
  function belegAuswerten(roh, kontext) {
    const hinweise = [];
    const a = belegNormieren(roh, hinweise);
    const art = ["hotel", "parken", "material"].includes(a.art) ? a.art : "sonstiges";
    const posten = a.posten.filter((x) => Number.isFinite(x.brutto) && x.brutto > 0);
    const tabelle = a.mwst_tabelle.filter((x) => Number.isFinite(x.netto));
    const nurEinSatz = tabelle.length === 1 && Number.isFinite(tabelle[0].satz) ? tabelle[0].satz : null;
    const satzVon = (x) => (x.mwst_satz === null || x.mwst_satz === undefined || x.mwst_satz === "" ? nurEinSatz : Number(x.mwst_satz));
    const techniker = kontext.techniker || [];
    const namenVon = (t) => [t.name, ...(t.namen || [])].map(normName);
    const sortiert = (n) => n.split(" ").sort().join(" ");
    function technikerFuer(gast) {
      const n = normName(gast);
      if (!n) return { k: kontext.hochlader, hinweis: "" };
      // ganzer Name, auch in anderer Reihenfolge („MUSTER MAX“)
      const genau = techniker.filter((t) => namenVon(t).some((x) => x === n || sortiert(x) === sortiert(n)));
      if (genau.length) return { k: genau[0].k, hinweis: "" };
      const teile = n.split(" ");
      let kandidaten = techniker.filter((t) => namenVon(t).some((x) => teile.includes(x.split(" ").pop())));
      // „B. Irmak“: Anfangsbuchstabe des Vornamens entscheidet
      if (kandidaten.length > 1 && teile.length > 1) {
        const vorn = teile[0][0];
        const passt = kandidaten.filter((t) => namenVon(t).some((x) => x[0] === vorn));
        if (passt.length === 1) kandidaten = passt;
      }
      if (kandidaten.length === 1) return { k: kandidaten[0].k, hinweis: teile.length === 1 ? `Auf dem Beleg steht nur „${gast}“ – bitte prüfen.` : "" };
      if (kandidaten.length > 1) {
        const bevorzugt = kandidaten.find((t) => t.k === kontext.hochlader) || kandidaten[0];
        return { k: bevorzugt.k, hinweis: `„${gast}“ passt zu mehreren Technikern (${kandidaten.map((t) => t.name).join(", ")}) – bitte wählen.` };
      }
      return { k: null, hinweis: `„${gast}“ ist kein angelegter Techniker – bitte wählen.` };
    }

    // Hotel: Zeilen je Techniker (nicht je Schreibweise) – Zeilen ohne Namen (Kurtaxe, Frühstück) gehören
    // zum Gast im Kopf, sonst zum einzigen Gast, sonst zum Hochlader bzw. ersten Gast. Sonst eine Gruppe.
    const gastVon = (x) => (art === "hotel" ? gastName(x.gast) || gastName(a.gast) : "");
    const wer = new Map();
    for (const x of posten) {
      const gast = gastVon(x);
      if (gast && !wer.has(normName(gast))) wer.set(normName(gast), { gast, ...technikerFuer(gast) });
    }
    // nur Nachname („229 Irmak“) neben einem eindeutig erkannten Gast mit diesem Nachnamen: dieselbe Person
    for (const [n, w] of wer) {
      if (n.includes(" ")) continue;
      const sicher = [...wer].filter(([m, v]) => m !== n && !v.hinweis && v.k && m.split(" ").pop() === n);
      if (sicher.length === 1) wer.set(n, { ...w, k: sicher[0][1].k, hinweis: "" });
    }
    const ohneNamen = () => {
      const alle = [...wer.values()];
      return alle.length === 1 ? alle[0] : alle.find((w) => w.k === kontext.hochlader) || alle[0] || { gast: "", ...technikerFuer("") };
    };
    const gruppen = new Map();
    let ohneSatz = false;
    for (const x of posten) {
      let satz = satzVon(x);
      if (satz === null || !Number.isFinite(satz)) { satz = 19; ohneSatz = true; }
      const netto = runden(Number(x.brutto) / (1 + satz / 100));
      const gast = gastVon(x);
      const w = gast ? wer.get(normName(gast)) : ohneNamen();
      const schl = art !== "hotel" ? "" : w.k || `?${normName(w.gast)}`;
      const g = gruppen.get(schl) || { gast: w.gast, k: w.k, hinweis: w.hinweis, netto: 0, brutto: 0, texte: [], naechte: 0 };
      g.netto = runden(g.netto + netto); g.brutto = runden(g.brutto + Number(x.brutto)); g.texte.push(String(x.text || "").trim());
      if (/übernacht|uebernacht|logis|zimmer/i.test(String(x.text || ""))) g.naechte += Number(x.menge) || 1;
      gruppen.set(schl, g);
    }
    if (ohneSatz) hinweise.push("MwSt-Satz nicht erkennbar – mit 19 % gerechnet, bitte prüfen.");
    // Summe an die Steueraufstellung des Belegs angleichen (Rundung je Zeile)
    const tabNetto = runden(tabelle.reduce((s, x) => s + Number(x.netto), 0));
    const sumNetto = runden([...gruppen.values()].reduce((s, g) => s + g.netto, 0));
    if (tabelle.length && Math.abs(tabNetto - sumNetto) > 0 && Math.abs(tabNetto - sumNetto) <= 0.02 * Math.max(1, posten.length)) {
      const groesste = [...gruppen.values()].sort((x, y) => y.netto - x.netto)[0];
      if (groesste) groesste.netto = runden(groesste.netto + tabNetto - sumNetto);
    } else if (tabelle.length && Math.abs(tabNetto - sumNetto) > 0.02 * Math.max(1, posten.length)) {
      hinweise.push(`Netto laut Beleg ${zahl(tabNetto)} €, aus den Zeilen ${zahl(sumNetto)} € – bitte prüfen.`);
    }
    if (Number.isFinite(a.summe_brutto)) {
      const sumBrutto = runden([...gruppen.values()].reduce((s, g) => s + g.brutto, 0));
      if (Math.abs(sumBrutto - a.summe_brutto) > 0.01) hinweise.push(`Zeilen ergeben ${zahl(sumBrutto)} € brutto, der Beleg ${zahl(a.summe_brutto)} € – bitte prüfen.`);
    }

    function einsatzFuer(k, von, bis, auftrag) {
      const liste = ((kontext.einsaetze || {})[k] || []).filter((e) => e.datum);
      if (auftrag) {
        const passend = liste.filter((e) => String(e.auftrags_nr) === String(auftrag));
        if (!passend.length) return null;
        if (!von) return passend.sort((x, y) => parseDatum(x.datum) - parseDatum(y.datum))[0].schluessel;
        return passend.sort((x, y) => Math.abs(tageZwischen(von, x.datum)) - Math.abs(tageZwischen(von, y.datum)))[0].schluessel;
      }
      if (!von) return null;
      const innen = liste.filter((e) => tageZwischen(von, e.datum) >= 0 && tageZwischen(e.datum, bis || von) >= 0);
      if (innen.length) return innen.sort((x, y) => parseDatum(x.datum) - parseDatum(y.datum))[0].schluessel;
      const abstand = (e) => Math.abs(tageZwischen(von, e.datum)) * 2 + (tageZwischen(von, e.datum) < 0 ? 1 : 0);
      const nah = liste.filter((e) => Math.abs(tageZwischen(von, e.datum)) <= 3).sort((x, y) => abstand(x) - abstand(y));

    const eintraege = [];
    const datum = a.anreise || a.datum || null;
    if (art !== "sonstiges" && !gruppen.size) hinweise.push("Keine Beträge auf dem Beleg erkannt – bitte Kosten von Hand eintragen.");
    if (art === "hotel") {
      let naechteBeleg = Number(a.naechte) || (a.anreise && a.abreise ? tageZwischen(a.anreise, a.abreise) : 0);
      const bis = a.abreise || datum;
      for (const g of gruppen.values()) {
        const naechte = Math.max(1, naechteBeleg || g.naechte || 1);
        const { k, hinweis } = g;
        const einsatz = k ? einsatzFuer(k, datum, bis) : null;
        const cent = Math.round(g.netto * 100);
        const teilbar = cent % naechte === 0;
        const h = [];
        if (hinweis) h.push(hinweis);
        if (k && !einsatz) h.push(`Kein Einsatz am ${datum || "Belegdatum"} gefunden – bitte Einsatz wählen.`);
        const extras = g.texte.filter((t) => !/übernacht|uebernacht/i.test(t));
        if (extras.length) h.push(`Enthält auch: ${extras.join(", ")}.`);
        eintraege.push({ k, einsatz, bezeichnung: `Hotelkosten für 1 Techniker ${a.fruehstueck ? "mit" : "ohne"} Frühstück`,
          betrag: teilbar ? cent / naechte / 100 : g.netto, menge: teilbar ? naechte : 1, naechte, netto: g.netto, brutto: g.brutto, hinweise: h });
      }
    } else if (art === "parken") {
      const g = [...gruppen.values()][0];
      if (g) {
        const k = kontext.hochlader;
        const einsatz = einsatzFuer(k, datum, datum);
        eintraege.push({ k, einsatz, bezeichnung: "Parkkosten", betrag: g.netto, menge: 1, naechte: null, netto: g.netto, brutto: g.brutto,
          hinweise: einsatz ? [] : [`Kein Einsatz am ${datum || "Belegdatum"} gefunden – bitte Einsatz wählen.`] });
      }
    } else if (art === "material") {
      const nr = String(a.auftragsnummer_handschriftlich || "").replace(/\D/g, "");
      if (!nr) {
        hinweise.push("Keine handschriftliche Auftragsnummer auf dem Beleg – Material wird nicht verrechnet, der Beleg wird nur abgelegt.");
      } else if (gruppen.size) {
        const g = [...gruppen.values()][0];
        const k = kontext.hochlader;
        const einsatz = einsatzFuer(k, datum, datum, nr);
        const kurz = g.texte.join(", ");
        eintraege.push({ k, einsatz, bezeichnung: `Material: ${kurz.length > 70 ? kurz.slice(0, 67) + "…" : kurz}`, betrag: g.netto, menge: 1, naechte: null,
          netto: g.netto, brutto: g.brutto, auftrag: nr, hinweise: einsatz ? [] : [`Auftrag ${nr} ist bei diesem Techniker nicht vorhanden – bitte Einsatz wählen.`] });
      }
    } else {
      hinweise.push("Kein Hotel-, Park- oder Materialbeleg erkannt – der Beleg wird nur abgelegt.");
    }
    return { art, eintraege, hinweise };
  }

  // ---------- Arbeitszeitkonto: Feiertage, Urlaub/Krank, Soll ----------
  const naechsterTag = (d) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1));

  /** Ostersonntag (gregorianisch) als UTC-Datum */
  function ostersonntag(jahr) {

    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

      [fest(1, 1), "Neujahr", "Neujahr"], [relativ(-2), "Karfreitag", "Karfreitag"], [relativ(1), "Ostermontag", "Ostermontag"],

      [fest(12, 25), "1. Weihnachtstag", "Weihnachten"], [fest(12, 26), "2. Weihnachtstag", "Weihnachten"],
    ].reduce((erg, [d, name, kurz]) => {

  }

  const feiertagsJahre = {};
  /** "TT.MM.JJJJ" -> {name, kurz} oder null */

    const jahr = Number(String(datum).slice(6, 10));
    if (!feiertagsJahre[jahr]) feiertagsJahre[jahr] = feiertage(jahr);

  }

  const ABWESENHEITEN = { urlaub: "Urlaub", krank: "Krank" };

  /** Einträge [{art, von, bis}] -> {"TT.MM.JJJJ": "urlaub"|"krank"}; an einem Tag mit beidem zählt „krank“ */
  function abwesenheitsTage(liste) {
    const erg = {};
    for (const a of liste || []) {
      if (!ABWESENHEITEN[a.art] || !gueltigesDatum(a.von) || !gueltigesDatum(a.bis)) continue;
      const ende = parseDatum(a.bis);
      for (let d = parseDatum(a.von), n = 0; d <= ende && n < 400; d = naechsterTag(d), n++) {
        const t = datumText(d);
        if (erg[t] !== "krank") erg[t] = a.art;
      }
    }
    return erg;
  }

  /** Tagessoll aus einer Eingabe/Einstellung: 0–24 Stunden, sonst 8 */
  function tagessoll(wert) {
    const z = Number(String(wert ?? "").replace(",", "."));

  }

  /**
   * Soll und Ist je Tag von `von` bis `bis` (UTC-Daten) für einen Mitarbeiter.
   * tage: Ergebnis von arbeitstage(), abwesend: abwesenheitsTage(). Soll gilt Mo–Fr, nicht an Feiertagen,
   * nicht bei Urlaub oder Krankheit. Soll und Differenz zählen nur bis `stichtag` (meist heute) und erst ab `ab`
   * (Beginn der Erfassung – vorher gibt es kein Soll).
   */
  function stundenKonto({ von, bis, tage = {}, abwesend = {}, soll = 8, stichtag = null, ab = null }) {
    const zeilen = [];
    const summe = { ist: 0, soll: 0, sollGesamt: 0, diff: 0, arbeitstage: 0, urlaub: 0, krank: 0, feiertage: 0 };
    for (let d = new Date(von), n = 0; d <= bis && n < 400; d = naechsterTag(d), n++) {
      const datum = datumText(d), wochentag = d.getUTCDay();
      const ft = feiertag(datum), abw = abwesend[datum] || null;
      const werktag = wochentag >= 1 && wochentag <= 5;
      const vorher = Boolean(ab) && d < ab;
      const tagSoll = werktag && !ft && !abw && !vorher ? soll : 0;
      const ist = tage[datum] ? tage[datum].stunden : 0;
      const zaehlt = !vorher && (!stichtag || d <= stichtag);
      zeilen.push({ datum, wochentag, ist, soll: tagSoll, feiertag: ft, abwesend: abw, zaehlt, diff: zaehlt ? runden(ist - tagSoll) : null });
      if (!vorher) summe.ist += ist;
      summe.sollGesamt += tagSoll;
      if (zaehlt) { summe.soll += tagSoll; summe.diff += ist - tagSoll; }
      if (ist > 0 && !vorher) summe.arbeitstage += 1;
      if (werktag && ft) summe.feiertage += 1;
      if (werktag && !ft && abw) summe[abw] += 1;
    }
    for (const x of ["ist", "soll", "sollGesamt", "diff"]) summe[x] = runden(summe[x]);
    return { tage: zeilen, summe };
  }

  /** Würde die Rechnung mit den heutigen Daten anders aussehen? (Positionen, Zeitraum, Aufträge, Beträge) */

    return inhalt(gespeichert) !== inhalt(aktuell);

  function kurznameVon(name) {

    return teile.length < 2 ? String(name || "").trim() : `${teile[0][0]}.${teile[teile.length - 1]}`;
  }

  /** „07:45-09:00“, „7.45 – 9.00“ -> „07:45-09:00“; leer -> null; ungültig -> Fehler. */

    wert = String(wert || "").trim();

    const teile = wert.replace("–", "-").split("-").map((x) => x.trim());
